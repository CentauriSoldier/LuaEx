    "LuaEx": {
        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <div class=\"container py-4\">\n  <div class=\"text-center\">\n    <img src=\"https://raw.githubusercontent.com/CentauriSoldier/LuaEx/main/logo.png\" alt=\"LuaEx Logo\" class=\"img-fluid mb-4\" style=\"max-height: 150px;\">\n    <p class=\"lead\">A powerful, lightweight extension of Lua 5.3+<\/p>\n  <\/div>\n\n  <div class=\"my-5\">\n    <h3 class=\"mb-3\">Key Features<\/h3>\n    <ul class=\"list-group\">\n      <li class=\"list-group-item\">✅ Drop-in global environment initializer<\/li>\n      <li class=\"list-group-item\">✅ Class system with full OOP: inheritance, encapsulation, polymorphism<\/li>\n      <li class=\"list-group-item\">✅ Dox documentation generator<\/li>\n      <li class=\"list-group-item\">✅ CoG game framework<\/li>\n      <li class=\"list-group-item\">✅ Event system<\/li>\n      <li class=\"list-group-item\">✅ Ships with basic classes (<em>E.g., Set, Stack, Queue, SortedDictionary, etc.<\/em>)<\/li>\n      <li class=\"list-group-item\">✅ Strict naming, coding and commenting conventions for clarity and consistency<\/li>\n      <li class=\"list-group-item\">✅ Enhanced type system with subtype support<\/li>\n      <li class=\"list-group-item\">✅ Boolean arithmetic and coercion features<\/li>\n      <li class=\"list-group-item\">✅ Safe <code>null<\/code> type (distinct from <code>nil<\/code>)<\/li>\n      <li class=\"list-group-item\">✅ Simple constant definition<\/li>\n      <li class=\"list-group-item\">✅ Typed objects like <strong>arrays<\/strong>, <strong>enums<\/strong>, and <strong>structs<\/strong><\/li>\n      <li class=\"list-group-item\">✅ Built-in serializer/deserializer system with metatable support<\/li>\n    <\/ul>\n  <\/div>\n\n  <div class=\"my-5\">\n    <h3 class=\"mb-3\">Class System<\/h3>\n    <p>Supports:<\/p>\n    <ul>\n      <li>Static initializers and constructors<\/li>\n      <li>Final classes and final methods<\/li>\n      <li>Optional interface declarations<\/li>\n      <li>Auto-accessor properties via <code>__AUTO<\/code> directive<\/li>\n      <li>Support for encapsulation (private/protected/public)<\/li>\n    <\/ul>\n  <\/div>\n\n  <div class=\"my-5\">\n    <h3 class=\"mb-3\">Advanced Data Types<\/h3>\n    <div class=\"row\">\n      <div class=\"col-md-4\">\n        <h5>Arrays<\/h5>\n        <ul>\n          <li>Fixed length<\/li>\n          <li>Type-safe<\/li>\n          <li>Bounds checked<\/li>\n          <li>Optional initial values<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"col-md-4\">\n        <h5>Enums<\/h5>\n        <ul>\n          <li>Strict ordinal values<\/li>\n          <li>Optional value types<\/li>\n          <li>Runtime creation support<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"col-md-4\">\n        <h5>Structs<\/h5>\n        <ul>\n          <li>Fixed key/value pairs<\/li>\n          <li>Immutable or mutable<\/li>\n          <li>Strict typing per key<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"my-5\">\n    <h3 class=\"mb-3\">Serialization<\/h3>\n    <p>Supports native Lua types and custom types that implement:<\/p>\n    <ul>\n      <li><code>__serialize<\/code> metamethod for object state extraction<\/li>\n      <li><code>deserialize()<\/code> static function for reconstitution<\/li>\n      <li>Class objects have built-in auto serialization/deserialization<\/li>\n    <\/ul>\n    <p class=\"text-white\">Threads and userdata are not serializable.<\/p>\n  <\/div>\n\n  <div class=\"my-5\">\n    <h3 class=\"mb-3\">Simplicity & Compatibility<\/h3>\n    <ul>\n      <li>Designed for Lua 5.3<\/li>\n      <li>Backwards-compatible with Lua 5.1 (where possible)<\/li>\n      <li>Minimal learning curve with intuitive APIs<\/li>\n      <li>Effortlessly extendable<\/li>\n    <\/ul>\n  <\/div>\n\n  <div class=\"my-5\">\n    <h3 class=\"mb-3\">License<\/h3>\n    <p><strong>LuaEx<\/strong> is released under <a href=\"https://opensource.org/licenses/unlicense\" target=\"_blank\">The Unlicense<\/a>. Use it freely for any purpose, personal or commercial.<\/p>\n  <\/div>\n\n  <div class=\"my-5 text-center\">\n    <a href=\"https://centaurisoldier.github.io/LuaEx\" class=\"btn btn-primary btn-lg\" target=\"_blank\">📚 View Full Documentation<\/a>\n    <a href=\"https://github.com/CentauriSoldier/LuaEx\" class=\"btn btn-outline-secondary btn-lg ml-3\" target=\"_blank\">🌐 Visit GitHub Repo<\/a>\n  <\/div>\n<\/div><\/div><\/div><\/div>`,
        "subtable": {
        "Class%20System": {
            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       <h3>Lua's (<i>pseudo<\/i>) Object Oriented Programming<\/h3>\n    <p>The class module aims to bring a simple-to-use, fully functional, OOP class system to Lua to the extent that such a feat is possible.\n    <br>Among other things, It includes encapsulation, inheritence & polymorphism, final, limited and abstract classes, final methods, auto-setter/getter and read-only directives (<b><i>properties<\/i><\/b>) as well as interfaces.\n    <\/p><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Features<\/div><div class=\"section-content\">   <h4>Strongly Typed<\/h4>\n<p>Fields that are set in classes remain the type with which they were intialized. The only expection to this is the <a href=\"#LuaEx.Class System.null\">null<\/a> value. Any field set to null in its declaration can be changed to any other type once. Once the type has been set, it cannot be changed again. This allows field types be to set during contruction or on first mutation.\n<br><br>\nFields marked as read-only cannot be modified once set. This, of course, excludes fields initialized as null. They can be set once and only once from the null value to something else.\n<br><br>\nClass methods cannot be overriden except by subclasses and only if they're not marked as final by the parent class.\n<\/p>\n<h4>Encapsulation<\/h4>\n<p>Class tables' access is appropriately restricted to prevent incidental access. Each class method (and metamethod) is infused with two arguments. The first is the class object itself so each method has access to the protected and public fields and methods of the class. The second is the class data table which is indexed by five tables:\n<ul>\n    <li><b>met<\/b><\/li> (class metamethods)\n    <li><b>pri<\/b><\/li> (class private fields and methods)\n    <li><b>pro<\/b><\/li> (class protected fields and methods)\n    <li><b>pub<\/b><\/li> (class public fields and methods)\n    <li><b>ins<\/b><\/li> (class instances)\n<\/ul>\n<b>Note<\/b>: for obvious reasons, methods in the static public table do not get infused with these instance-specific arguments. The only method in that table that has an argument infused into it is the static inializer <i>(not to be confused with the static constructor)<\/i> that has the static public table as its first argument to allow it to make changes to the static public tables upon class creation.\n<br>\n<br>\nTo facilitate a class's instances accessing and mutating each other (as is common in most other programming laguages), the <b>ins<\/b> table is provided. This table is indexed by class instance objects whose values are the class data of that instance. This allows other class instances input as arguments into a method to be directly manipulated (incuding private, protected, etc.) by the class method.\n<b>Note<\/b>: as is expected, this works only for instances of the same class. ClassA cannot access class data from an instance of ClassB.\n<\/p>\n<h4>Inheritance<\/h4>\n<br><p>Subclasses can be created by declaring the Parent class in the class arguments.<\/p>\n<p>Each subclasses will inherit all protected and public fields and methods from the parent class and may access them as if they were its own.<\/p>\n<p>Parent methods can be overriden by the child class unless they are marked as final in the parent class.\n<h5>Restrictions on Inheritance<\/h5>\n<ol>\n    <li>Any class with a blacklist or whitelist may or may not allow certain classes to subclass it.<\/li>\n    <li>Classes marked as final cannot be subclassed.<\/li>\n<\/ol>\n<\/p>\n<h4>Polymorphism<\/h4>\n<p>Polymorphism is a key component of the class system and is honored in class fields.\n<br>For example, if a class has a Creature class object (whose subclasses are Human and Monster) as a field, the object in that field can be changed to either another Creature, a Human or a Monster since Human and Monster are both subclasses of the Creature class.<\/p><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Website<\/div><div class=\"section-content\">   https://github.com/CentauriSoldier/LuaEx<\/div><\/div><\/div>`,
            "subtable": {
            "Directives": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Directives provide a way for classes to set methods as final,\n<br>set values as read only and create <a href=\"#LuaEx.Class System.class.Properties\">Properties<\/a>.\n<br><br>\n<h3>List of Base Directives<\/h3>\n<ul>\n    <li><strong>__AUTO__<\/strong> The Upper Auto Directive<\/li>\n    <li><strong>__auto__<\/strong> The Lower Auto Directive<\/li>\n    <li><strong>__FNL<\/strong> The Final Directive<\/li>\n    <li><strong>__RO<\/strong> The Read-only Directive<\/li>\n<\/ul>\n<hr>\n<h3>Auto Directives<\/h3>\n<p>Auto directives may be applied only to class members that are fields, never methods.\n<br>They can be used to create accessor and/or mutator methods for that field.\n<br><br>The Upper and Lower Auto Directives behave identically except that when method prefixes are auto-generated,\n<br>the Upper Auto makes the first letter of the method uppercase and the Lower Auto makes it lowercase.\n<br><br>\nThe last two characters (__) of the directive can be changed to allow customization of the method(s) and field.\n<br><br>\nThe first of the two underscores refers to the methods to be created.\n<ul>\n    <li>If an \"<strong>A<\/strong>\" is used, only an accessor method will be created for the field.<\/li>\n    <li>If an \"<strong>M<\/strong>\" is used, only a mutator method will be created for the field.<\/li>\n    <li>If an \"<strong>R<\/strong>\" is used, only an accessor method will be created for the field and the field will be set to read-only.<\/li>\n    <li>If any other character (including an underscore) is used, both an accessor and mutator method will be created for the field.<\/li>\n<\/ul>\n<br><br>\nThe second of the two underscores refers to the finality of the methods created (whether they can be overriden by subclasses).\n<ul>\n    <li>If an \"<strong>A<\/strong>\" is used, only the accessor method will be set to final.<\/li>\n    <li>If an \"<strong>M<\/strong>\" is used, only the mutator method will be set to final.<\/li>\n    <li>If an \"<strong>F<\/strong>\" is used, both the accessor and mutator methods will be set to final.<\/li>\n    <li>If any other character (including an underscore) is used, neither method will be set to final.<\/li>\n<\/ul>\n<br>\n<br>\n<strong>Note<\/strong>: As with all other fields, directive fields may contain only the types for which they were designed.\n<br><strong>Note<\/strong>: The exception (as with other fields) being, initial null values are permitted.\n<br><br>\nIn addition, if any characters are found after the trailing two underscodes (or letters if applicable), that string will be used for the accessor prefix.\n<pre><code class=\"language-lua\">\n--this will create an accessor method named 'isEnabled' and a mutator method called 'setEnabled'\nEnabled__auto__is = true\n--this will create an accessor method named 'getEnabled' and a mutator method called 'setEnabled'\nEnabled__auto__ = true\n--this will create an accessor method named 'isEnabled' and set the field to read-only.\nEnabled__autoR_is = true\n<\/code><\/pre>\n<hr>\n<\/p>\n<h3>Final Directive<\/h3>\n<p>\nAdding the __FNL directive to the end of a method name prevents it from being overridden by a child class.\n<pre><code class=\"language-lua\">\nMyMethod__FNL = function() end\n<\/code><\/pre>\n<\/p>\n<h3>Read-only Directive<\/h3>\n<p>\nBy adding the __RO directive to the end of a field name, it becomes read-only and may not be interally or externally modified.\n<pre><code class=\"language-lua\">\nMyField__RO = 12,\n<\/code><\/pre>\n<\/p><\/div><\/div><\/div>`,
                "subtable": null
            },
            "Initialization": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   When a class is built, there is an opportunity to call a static initializer, a static constructor or both.\n<h3>The Static Initializer<\/h3>\n<p>The static initializer is called by creating a static public method named <b>__INIT<\/b>. This is called <b><i>before<\/i><\/b> the class object is created and is used to modify the static public fields and methods. Items can be added, changed or deleted from the static public table of the class at this point. The only parameter passed to the <b>__INIT<\/b> method is the static public table.<br><b>Note<\/b>: Since the class has not yet been built, this cannot access/modify class methods that have yet to be added during the class object's assembly or any other fields declared in the non-static portion of the class declaration.<\/p>\n<h3>The Static Constructor<\/h3>\n<p>The static constructor is called by creating a static public method having the <b><u>exact<\/u><\/b> same name as the class itself. This is called <b><i>after<\/i><\/b> the class object is created and is used to perform static operations while having access to the fully-built class object. The two parameters passed to the static constructor method are the class object itself and an authentication code for proving (often to parent, static methods) that this class's static constructor is currently running. This can be tested by running the <b>class.isstaticconstructorrunning<\/b> method inputing the class object and authentication code.\n<br><b>Note<\/b>: the authentication code is destroyed upon the static constructor being run so the test will pass only while the static constructor is running.\n<br><b>Note<\/b>: actions performed using the class object are governed as would any actions on the class object performed outside the static constructor. That is, the static constructor is given no special privileges or access to the class object.<\/div><\/div><\/div>`,
                "subtable": null
            },
            "Snapshot%20Hooks": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Classes retain autogenerated serialization and static deserialization. The reserved private hooks prepareSnapshot(tState) and validateSnapshot(tState) customize generated state without replacing those methods. These internal hooks receive the class's plain {pri, pro, pub} state directly, without this/cdat injection. Plain state tables and table keys are copied with aliases/cycles preserved; typed objects, class instances, and functions retain their identity and must be treated as read-only by hooks. prepareSnapshot may edit or omit copied fields. validateSnapshot may validate or normalize copied state and must avoid runtime side effects. Hooks run base-to-derived, separately for each declaring class; the entire hierarchy validates before any instance is constructed. Runtime fields omitted from snapshots retain class defaults. Unknown fields, incompatible field types, replacement declared methods, and changed immutable scalars are rejected. Restored initialized read-only fields remain locked. The global serializer's support for cyclic graphs is separate from copying snapshot tables.<\/div><\/div><\/div>`,
                "subtable": null
            },
            "class": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   The table containing the class functions and data.<\/div><\/div><\/div>`,
                "subtable": {
                "Functions": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   While there are many local functions in this list, there also several global class helper functions that provide essential utilities for querying and managing class relationships, inheritance structures, and object identification.\n<br>They enable checking class existence (exists), retrieving class hierarchy details (getbase, getparent, getchildren), determining relationships (isbaseof, ischild, isparent, etc.), verifying object types (isinstance, of), and ensuring proper class instantiation (isstaticconstructorrunning).\n<br>Collectively, these functions support robust type checking, hierarchy traversal, and validation of inheritance and instance properties.<\/div><\/div><\/div>`,
                    "subtable": {
                    "build": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Builds a complete class object given the <a href=\"#LuaEx.Class System.kit\">kit<\/a> table. This is called by kit.build().\n<br>For info on class initializers and constructors, see <a href=\"#LuaEx.Class System.Initialization\">Initialization<\/a>.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Scope<\/div><div class=\"section-content\">   local<\/div><\/div><div class=\"custom-section\"><div id=\"d9d4c862-164f-1b91-32fd-1cb25f328400\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tKit<\/em>   The kit that is to be built.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f7b2a65e-3f90-e0a8-a8ac-eed7b5bacf14\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>class<\/em><\/strong>   <em>A<\/em>   class object.<br><\/div><\/div><\/div>`,

                    "class": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Builds a class.<br><strong>Note<\/strong>: every method within the static public, private, protected and public tables must accept the instance object and class data table as their first and second arguments respectively.<br><strong>Note<\/strong>: all metamethods within the metamethods table also accept the class instance and cdat table but may also accept a second item depending on if the metamethod is using binary operators such as +, %, etc.<br><strong>Note<\/strong>: The class data table is indexed by <strong>pri<\/strong> (private members), <strong>pro<\/strong> (protected members), <strong>pub<\/strong> (public members) and <strong>ins<\/strong> (for all class instances of this class type) and each grants access to the items in that table.<br><strong>Note<\/strong>: to prevent fatal conflicts within the code, all class members are strongly typed. No member's type may be changed with the exception of the null type. Types may be set to and from null; however, items which begin as null, once set to another type, cannot be changed from that type to another non-null type. Items that begins as a type and are then set to null, may be changed back to that original type only. In addition, no class member may be set to nil.<br>Class methods cannot be changed to other methods but may be overridden by methods of the same name within child classes. The one exception to this is methods which have the __FNL suffix added to their name. These methods are final and may not be overridden. <strong>Note<\/strong>: though the __FNL suffix appears within the method name in the class table, that suffix is removed during class creation. That is, a method such as, MyMethod_FNL will be called as MyMethod(), leaving off the __FNL suffix during calls to that method. __FNL (and other such suffixes that may be added in the future) can be thought of as a directive to the class building code which, after it renames the method to remove the suffix, marks it as final within the class code to prevent overrides.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Scope<\/div><div class=\"section-content\">   global<\/div><\/div><div class=\"custom-section\"><div id=\"584a8d91-f42d-f1af-d8ec-d11d6cdfe8fd\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sClass<\/em>   The name of the class. <strong>Note<\/strong>: this must be a unique, variable-compliant string.   <strong><em>table<\/em><\/strong>   <em>tMetamethods<\/em>   A table containing the class metamethods. <strong>Note<\/strong>: undeclared metamethods in this class, if present in a parent class, are automatically inherited.   <strong><em>table<\/em><\/strong>   <em>tStaticPublic<\/em>   A table containing static public class members.   <strong><em>table<\/em><\/strong>   <em>tPrivate<\/em>   A table containing the private class members.   <strong><em>table<\/em><\/strong>   <em>tProtected<\/em>   A table containing the protected class members.   <strong><em>table<\/em><\/strong>   <em>tPublic<\/em>   A table containing the public class members.   <strong><em>class<\/em><\/strong>   <em>cExtendor<\/em>   The parent class (if any) from which this class is derived.   <strong><em>interface|table|nil<\/em><\/strong>   <em>The<\/em>   interface (or numerically-indexed table of interface) this class implements (or nil, if none).   <strong><em>boolean<\/em><\/strong>   <em>bIsFinal<\/em>   Whether this class is final.<br><\/div><\/div><div class=\"custom-section\"><div id=\"583b8361-8ac8-4d74-c358-4a660ec6c401\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>class<\/em><\/strong>   <em>The<\/em>   class object.<br><\/div><\/div><\/div>`,

            "kit": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   The table containing all the functions and data relating to and dealing with class kits.\n    <br>\n    <h1>Kits<\/h1>\n    Kits are used in the class building process. When a class is created by the user, the parameters of that class are stored in a kit. The class is then constructed from the kit and any parent kits.\n    <br>This approach facilitates inheritance while mitigating any issues with shared tables that shouldn't be shared. It also permits classes to retain private methods and still properly function within scope when that class is extended.\n    <br>Essentially, kits solve the problems that arise from inheritance in Lua. Kits are the building blocks of all classes and are where all class data is stored.\n    <br>\n    <strong>Note<\/strong>: the class data stored in kits is strictly managed and controlled to prevent incidental access and modification out of scope.\n\n    <h1>Kit Usage<\/h1>\n    Kits are first created by a call to <a href=\"#LuaEx.Class System.kit.Functions.build\">kit.build<\/a>. The globally-available alias to this function is <strong>class<\/strong>.\n\n    Once a call to class has been made, the class building process begins.\n    Below is the order in which events occur.\n\n    <ol>\n        <li>The class name is validated by <a href=\"#LuaEx.Class System.kit.Functions.validateName\">kit.validateName<\/a> to ensure it's variable-safe and doesn't already exist.<\/li>\n        <li>The <a href=\"#LuaEx.Class System.kit.Functions.validateTables\">kit.validateTables<\/a> check the validity of the tables containing the metamethods as well as the static public, private, protected, and public class members.<\/li>\n        <li><a href=\"#LuaEx.Class System.kit.Functions.validateInterfaces\">kit.validateInterfaces<\/a><\/li>\n        <li><a href=\"#LuaEx.Class System.kit.Functions.validateName\"><\/a><\/li>\n        <li><a href=\"#LuaEx.Class System.kit.Functions.validateName\"><\/a><\/li>\n        <li><a href=\"#LuaEx.Class System.kit.Functions.validateName\"><\/a><\/li>\n        <li><a href=\"#LuaEx.Class System.kit.Functions.validateName\"><\/a><\/li>\n\n        (sName, tMetamethods, tStaticPublic, tPrivate, tProtected, tPublic);\n        kit.validateInterfaces(sName, tInterfaces);\n    <\/ol><\/div><\/div><\/div>`,
                "subtable": {
                "Functions": {
                    "value": ``,

                    "build": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Imports a kit for later use in building class objects.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Scope<\/div><div class=\"section-content\">   local<\/div><\/div><div class=\"custom-section\"><div id=\"8714f8a3-c412-2437-86ca-12c90fa24de2\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sName<\/em>   The name of the class kit. This must be a unique, variable-compliant name.   <strong><em>table<\/em><\/strong>   <em>tMetamethods<\/em>   A table containing all class metamethods.   <strong><em>table<\/em><\/strong>   <em>tStaticPublic<\/em>   A table containing all static public class members.   <strong><em>table<\/em><\/strong>   <em>tPrivate<\/em>   A table containing all private class members.   <strong><em>table<\/em><\/strong>   <em>tProtected<\/em>   A table containing all protected class members.   <strong><em>table<\/em><\/strong>   <em>tPublic<\/em>   A table containing all public class members.   <strong><em>class|nil<\/em><\/strong>   <em>cExtendor<\/em>   The parent class from which this class ischild (if any). If there is no parent class, this argument should be nil.   <strong><em>boolean|table|nil<\/em><\/strong>   <em>vLimitationsOrFinal<\/em>   A boolean value indicating whether this class is final, nil indicating false, or a numerically-indexed table of strings whose values are class names to which subclasses should be limited.   <strong><em>interface|nil<\/em><\/strong>   <em>The<\/em>   interface(s) this class implements (or nil, if none). This is a cararg table, so many or none may be entered.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2c19809c-be10-4ded-2d00-230ddd6542e8\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>class                         "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   inserts one to many rows starting at the provided index <em>(or at the end of the Grid rows table if no position is indicated)<\/em>.<\/div><\/div><div class=\"custom-section\"><div id=\"0679263c-70ec-4dce-0160-71c3bcfc9b49\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nPosition<\/em>   The position at which to insert the row(s). If set to nil or -1, appends the rows to the end of the Grid.   <strong><em>string|table|nil<\/em><\/strong>   <em>vData<\/em>   The value to insert into each of the row's cells. If nothing is provided, a blank string will be inserted. If a non-nil, non-table value is provided, it will be coerced to a string and inserted into each cell. If a table is provided <em>(that has numerical indices equal to the number of columns and whose values are strings or things that can be coerced into a string)<\/em>, the table's data will be inserted at each relative position.   <strong><em>number|nil<\/em><\/strong>   <em>The<\/em>   number of rows to insert. By default, if no valid argument is provided, one row will be inserted.<br><\/div><\/div><div class=\"custom-section\"><div id=\"0d23cd2c-833e-8416-ef93-532db2b8f2c8\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Grid<\/em><\/strong>   <em>oGrid<\/em>   The Grid object.<br><\/div><\/div><\/div>`,

            "Potentiometer": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       <h2>Potentiometer<\/h2>\n    <p>A logical potentiometer object. The client can set minimum and maximum values for the object, as well as rate of increase/decrease.\n    Note: 'increase' and 'decrease' are logical terms referring to motion along a line based on the current direction. E.g., If a pot is\n    alternating and descending, 'increase' would cause the positional value to be absolutely reduced, while 'decrease' would have the opposite\n    effect.\n    By default, values are clamped at min and max; however, if the object is set to be revolving (or alternating), any values which exceed the minimum or maximum\n    boundaries, are carried over. For example, imagine a pot is set to have a min value of 0 and a max of 100. Then, imagine its position is set to 120.\n    If revolving, it would have a final positional value of 19; if alternating it would have a final positional value of 80 and, if neither, its final positional\n    value would be 100.<\/p><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Changelog<\/div><div class=\"section-content\">   <ul>\n    <li>\n        <b>1.5<\/b>\n        <br>\n        <p>Change: updated to be compatible with new LuaEx class system.<\/p>\n    <\/li>\n    <li>\n        <b>1.4<\/b>\n        <br>\n        <p>Bugfix: clamping values was not working correctly cause unpredictable results.<\/p>\n    <\/li>\n    <li>\n        <b>1.3<\/b>\n        <br>\n        <p>Added serialization and deserialization methods.<\/p>\n    <\/li>\n    <li>\n        <b>1.2<\/b>\n        <br>\n        <p>Fixed a bug in the revolution mechanism.<\/p>\n        <p>Added the ability which allows the potentiometer to be continuous in a revolving or alternating manner.<\/p>\n    <\/li>\n    <li>\n        <b>1.1<\/b>\n        <br>\n        <p>Added the option for the potentiometer to be continuous in a revolving manner.<\/p>\n    <\/li>\n    <li>\n        <b>1.0<\/b>\n        <br>\n        <p>Created the module.<\/p>\n    <\/li>\n<\/ul><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Version<\/div><div class=\"section-content\">   1.5<\/div><\/div><div class=\"custom-section\"><div id=\"d77967df-2211-d206-fcac-30f1634cd580\" class=\"section-title\">Author(s)<\/div><div class=\"section-content\">   Centauri Soldier<br><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">License<\/div><div class=\"section-content\">   <p>The Unlicense<br>\n<br><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Website<\/div><div class=\"section-content\">   https://github.com/CentauriSoldier<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Copyright<\/div><div class=\"section-content\">   Public Domain<\/div><\/div><\/div>`,
                "subtable": {
                "Continuity": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   NONE clamps to the endpoints. REVOLVE uses the inclusive period maximum - minimum + 1; fractional values in the final one-unit seam clamp to maximum. ALT reflects overshoot, preserving every boundary crossing and its direction change. Bounds and arithmetic must remain finite and representable.<\/div><\/div><div class=\"custom-section\"><div id=\"a7277fc8-092e-fa30-f9c7-4e3e5a74620a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local oWrap   = Potentiometer(0, 100, 120, 1, POT_CONTINUITY_REVOLVE);\nlocal oBounce = Potentiometer(0, 100, 120, 1, POT_CONTINUITY_ALT);\nassert(oWrap.getPos() == 19 and oBounce.getPos() == 80);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "Potentiometer": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates a bounded position. Nonnumeric or omitted arguments retain the original defaults. Invalid numeric bounds raise MAX to MIN + 1; rate is a nonnegative magnitude capped to the span. Nonfinite values are rejected.<\/div><\/div><div class=\"custom-section\"><div id=\"14eb17ce-cf70-e9f7-5bd6-91195b096b7a\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nMin<\/em>   Minimum; defaults to 0.   <strong><em>number|nil<\/em><\/strong>   <em>nMax<\/em>   Maximum; defaults to 99.   <strong><em>number|nil<\/em><\/strong>   <em>nPos<\/em>   Starting position; defaults to 0 and is normalized to the selected mode.   <strong><em>number|nil<\/em><\/strong>   <em>nRate<\/em>   Rate magnitude; defaults to 1.   <strong><em>number|nil<\/em><\/strong>   <em>nContinuity<\/em>   NONE, REVOLVE or ALT; defaults to NONE.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8ba438da-24fa-61a9-09e9-67bc65fa892a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Potentiometer<\/em><\/strong>   <em>oPot<\/em>   The new object.<br><\/div><\/div><div class=\"custom-section\"><div id=\"eeede568-3a0d-2189-fd2f-67140f1077ba\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPot = Potentiometer(0, 10, 5, 2);\n    assert(oPot.getPos() == 5 and oPot.getRate() == 2);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },

                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates an independent copy preserving bounds, rate, position, continuity and direction.<\/div><\/div><div class=\"custom-section\"><div id=\"6c82f5e3-6eaf-c6f6-d1d0-7d2e80429a2a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Potentiometer<\/em><\/strong>   <em>oCopy<\/em>   The copy.<br><\/div><\/div><div class=\"custom-section\"><div id=\"33f39305-9942-d27a-6d2a-1c8dc99c701e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPot  = Potentiometer(0, 10, 11, 1, POT_CONTINUITY_ALT);\n    local oCopy = clone(oPot);\n    assert(oCopy.isDescending() and oCopy.getPos() == 9);<\/code><\/pre><\/div><\/div><\/div>`,

                "setContinuity": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets a supported boundary mode. Unsupported values are ignored. Leaving alternating mode resets direction to ascending; no debugging output is emitted.<\/div><\/div><div class=\"custom-section\"><div id=\"b892291f-d163-2f83-876e-a8e4c7719f90\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nContinuity<\/em>   A POT_CONTINUITY constant.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bb8af50a-08f4-2914-29e6-7826cd4926dc\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Potentiometer<\/em><\/strong>   <em>oPot<\/em>   This object.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e4a4df7f-6209-9f7b-9bda-bba50917077a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPot = Potentiometer(0, 10, 5, 2);\n    oPot.setContinuity(POT_CONTINUITY_REVOLVE);\n    assert(oPot.isRevolving());<\/code><\/pre><\/div><\/div><\/div>`,

                "setMax": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets maximum and normalizes position and rate. Values at or below minimum become minimum + 1. Nonnumeric input leaves state unchanged.<\/div><\/div><div class=\"custom-section\"><div id=\"6d51778d-cd5f-db4a-256a-fdc2285ed9c1\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nValue<\/em>   The requested maximum.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d5d7bcaa-b4a3-fb34-df40-66347cb7dea6\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Potentiometer<\/em><\/strong>   <em>oPot<\/em>   This object.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f132e651-6b0d-0a6b-081e-a8b93765f2e6\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPot = Potentiometer(0, 10, 5, 2);\n    oPot.setMax(4);\n    assert(oPot.getPos() == 4 and oPot.isAtEnd());<\/code><\/pre><\/div><\/div><\/div>`,

                    "subtable": {
                    "__clone": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates an independent, unlinked snapshot. Copies modifiers, bounds, calculation mode, cached final value and callback locks. Retains the callback reference and active state. Does not invoke callbacks.<\/div><\/div><div class=\"custom-section\"><div id=\"64a8ddee-920f-7ed3-9327-b39410097115\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Protean<\/em><\/strong>   <em>oClone<\/em>   A new snapshot instance.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e386a0f6-a64e-df64-090a-f8b7f50b2a28\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oCopy = clone(oProtean);<\/code><\/pre><\/div><\/div><\/div>`,

                "Methods": {
                    "value": ``,
                    "subtable": {
                    "Protean": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   The constructor for the Protean class.<\/div><\/div><div class=\"custom-section\"><div id=\"a59f3600-4f30-2361-7a45-494a4d4e512d\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>nBaseValue<\/em><\/strong>   <em>number<\/em>   This value is <code>Vb where Vf = [(Vb + Bb - Bp) * (1 + Mb - Mp)] + Ab - Ap<\/code> and where Vf is the calculated, final value. If set to nil, it will default to 0.   <strong><em>nBaseBonus<\/em><\/strong>   <em>number/nil<\/em>   This value is Bb where Vf = [(Vb + Bb - Bp) * (1 + Mb - Mp)] + Ab - Ap and where Vf is the calculated, final value. If set to nil, it will default to 0.   <strong><em>nBasePenalty<\/em><\/strong>   <em>number/nil<\/em>   This value is Bp where Vf = [(Vb + Bb - Bp) * (1 + Mb - Mp)] + Ab - Ap and where Vf is the calculated, final value. If set to nil, it will default to 0.   <strong><em>nMultiplicativeBonus<\/em><\/strong>   <em>number/nil<\/em>   This value is Mb where Vf = [(Vb + Bb - Bp) * (1 + Mb - Mp)] + Ab - Ap and where Vf is the calculated, final value. If set to nil, it will default to 0.   <strong><em>nMultiplicativePenalty<\/em><\/strong>   <em>number/nil<\/em>   This value is Mp where Vf = [(Vb + Bb - Bp) * (1 + Mb - Mp)] + Ab - Ap and where Vf is the calculated, final value. If set to nil, it will default to 0.   <strong><em>nAddativeBonus<\/em><\/strong>   <em>number/nil<\/em>   This value is Ab where Vf = [(Vb + Bb - Bp) * (1 + Mb - Mp)] + Ab - Ap and where Vf is the calculated, final value. If set to nil, it will default to 0.   <strong><em>nAddativePenalty<\/em><\/strong>   <em>number/nil<\/em>   This value is Ap where Vf = [(Vb + Bb - Bp) * (1 + Mb - Mp)] + Ab - Ap and where Vf is the calculated, final value. If set to nil, it will default to 0.   <strong><em>nMinLimit<\/em><\/strong>   <em>number/nil<\/em>   This is the minimum value that the calculated, final value will return. If set to nil, it will be ignored and there will be no minimum value.   <strong><em>nMaxLimit<\/em><\/strong>   <em>number/nil<\/em>   This is the maximum value that the calculated, final value will return. If set to nil, it will be ignored and there will be no maximum value.   <strong><em>fonChange<\/em><\/strong>   <em>function/nil<\/em>   Called with instance, category, old value, new value and cached final value. In manual mode the final value is not refreshed.\n    <br>Note: the callback function must accept the following paramters:\n    <ol>\n        <li>The Protean object. <em>(Protean)<\/em>.<\/li>\n        <li>The value type. <em>(number)<\/em><\/li>\n        <li>The previous value. <em>(number)<\/em><\/li>\n        <li>The changed value. <em>(number)<\/em><\/li>\n        <li>The final value. <em>(number)<\/em><\/li>\n    <\/ol>   <strong><em>bDontAutoCalculate<\/em><\/strong>   <em>boolean|nil<\/em>   Set true to disable automatic recalculation. Initial construction always calculates once.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bc1b94fc-85da-7f66-b90c-e2454f32822e\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>oProtean<\/em><\/strong>   <em>Protean<\/em>   A Protean object.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "adjust": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adjusts a value by the amount input. Adjusting a linked base updates every member of that linker.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Note<\/div><div class=\"section-content\">   If only one parameter is given, it is assumed that the base value is intended to be adjusted using the value input.<\/div><\/div><div class=\"custom-section\"><div id=\"5580c3f4-2111-c223-2dc2-671e3965e272\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>nType<\/em><\/strong>   <em>number<\/em>   The type of value to adjust.   <strong><em>nValue<\/em><\/strong>   <em>number<\/em>   The value by which to adjust the given value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"30679367-c275-2ba2-0ca0-08cbe7a30ab6\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>oProtean<\/em><\/strong>   <em>Protean<\/em>   This Protean object.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "calculateFinalValue": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Calculates the final value of the Protean. This is done on-change by default so that the final value (when requested) is always up-to-date and accurate. There is no need to call this unless auto-calculate has been disabled. In that case, this serves an external utility function to perform the normally-internal operation of calculating and updating the final value.<\/div><\/div><div class=\"custom-section\"><div id=\"5a1a7002-dd37-e7e5-ce03-d7d6f7747767\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>nValue<\/em><\/strong>   <em>number<\/em>   The calculated final value.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "calulateFinalValue": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Compatibility alias for calculateFinalValue(), retaining its original spelling and behavior.<\/div><\/div><div class=\"custom-section\"><div id=\"9100f87d-752f-3d28-6837-3f5a98e3d29b\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Protean<\/em><\/strong>   <em>oProtean<\/em>   This instance, for chaining.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "get": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the value of the given value type. Note: if the type provided is ProteanValue.Final and MIN or MAX limits have been set, the returned value will fall within the confines of those paramter(s).<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Note<\/div><div class=\"section-content\">   If no parameter is given, the final value is returned.<\/div><\/div><div class=\"custom-section\"><div id=\"d3adfb81-8502-8e52-591b-74fbf26d8111\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>nType<\/em><\/strong>   <em>number<\/em>   The type of value to adjust.<br><\/div><\/div><div class=\"custom-section\"><div id=\"95143623-c71d-4bb0-c151-71443620136a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>nValue<\/em><\/strong>   <em>number<\/em>   The value of the given type.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "getLinkerID": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets this Protean's linkerID.<\/div><\/div><div class=\"custom-section\"><div id=\"14b637cc-0e1c-1f7c-41fb-ffd6a25d78e4\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>nID<\/em><\/strong>   <em>number<\/em>   The ID of the linker;<br><\/div><\/div><\/div>`,
                        "subtable": null

                    "isAutoCalculated": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Determines whether or not auto-calculate is active.<\/div><\/div><div class=\"custom-section\"><div id=\"12a97712-fafe-0d0b-bae2-4770b435a6d4\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>bActive<\/em><\/strong>   <em>boolean<\/em>   Whether or not auto-calculate occurs on value change.<br><\/div><\/div><\/div>`,
                        "subtable": null

                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Determines whether or not the callback is called on change.<\/div><\/div><div class=\"custom-section\"><div id=\"abfc00fc-50e6-7270-75a6-8927e774d872\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>bActive<\/em><\/strong>   <em>boolean<\/em>   Whether or not the callback is called on value change.<br><\/div><\/div><\/div>`,

                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Reports whether callback replacement or clearing is locked.<\/div><\/div><div class=\"custom-section\"><div id=\"9c2f6022-398a-eca6-790c-a4a402251784\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bLocked<\/em>   Whether callback changes are locked.<br><\/div><\/div><\/div>`,

                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Restores a validated array state containing length, type, and a dense items list. Null slots and the established type are retained, even when every slot is empty. Normally invoked through the global deserialize function.<\/div><\/div><div class=\"custom-section\"><div id=\"be216580-0879-00b1-8049-e40709de56aa\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tData<\/em>   The serialized array state.<br><\/div><\/div><div class=\"custom-section\"><div id=\"19de4997-c6a7-55cf-5da6-bca046f37d42\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>array<\/em><\/strong>   <em>aRet<\/em>   The restored independent array container.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    }
                    }
                },
                "Methods": {
                    "value": ``,
                    "subtable": {
                    "clear": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Clears every slot to null without changing capacity or the established item type.<\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "sort": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sorts occupied values using Lua's normal ordering or a supplied comparator and moves null slots to the end. Commits only after success; comparator errors leave slot order unchanged. Comparators cannot assign, clear, or recursively sort this array. Sorting is not stable. Mutations inside contained objects are outside the slot transaction.<\/div><\/div><div class=\"custom-section\"><div id=\"92373036-ac60-5e7d-3180-e5127840e06f\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>function|nil<\/em><\/strong>   <em>fSorter<\/em>   Optional comparator returning whether its first value comes before its second.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    }
                    }
                }
                }
            },
            "base64": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Used for encoding/decoding strings to and from <a href=\"https://en.wikipedia.org/wiki/Base64\" target=\"_blank\">base64<\/a>.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Version<\/div><div class=\"section-content\">   1.0<\/div><\/div><div class=\"custom-section\"><div id=\"a765690c-d207-5ab9-179e-fe0e5369fed6\" class=\"section-title\">Author(s)<\/div><div class=\"section-content\">   Centauri Soldier<br><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">License<\/div><div class=\"section-content\">   <a href=\"https://unlicense.org/\" target=\"_blank\">The Unlicense<\/a><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">GitHub<\/div><div class=\"section-content\">   <a href=\"https://github.com/CentauriSoldier/LuaEx\" target=\"_blank\">LuaEx<\/a><\/div><\/div><\/div>`,
                "subtable": {
                "dec": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Encodes a string to Base64.<\/div><\/div><div class=\"custom-section\"><div id=\"2e59bb87-8c53-0ccb-430a-e4a3e76cdac6\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sInput<\/em>   The sting to encode.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f909bec5-3a5f-f867-9b56-f8df429a68d0\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sEncoded<\/em>   The encoded Base64 string.<br><\/div><\/div><div class=\"custom-section\"><div id=\"74e1f4b3-7b8d-b6da-6385-055e938dadec\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local sText     = \"I really like apples but only the glowing, purple ones.\";\n    local sEncoded  = base64.enc(sText);\n    print(sEncoded) --> SSByZWFsbHkgbGlrZSBhcHBsZXMgYnV0IG9ubHkgdGhlIGdsb3dpbmcsIHB1cnBsZSBvbmVzLg==\n    local sDecoded  = base64.dec(sEncoded);\n    print(sDecoded) --> I really like apples but only the glowing, purple ones.\n    print (sText == sDecoded) --> true<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "enc": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Encodes a string to Base64.<\/div><\/div><div class=\"custom-section\"><div id=\"6822d165-f677-07df-db38-8e8860d203cc\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sInput<\/em>   The sting to encode.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ef6532a9-da72-114e-0647-902efe0e19aa\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sEncoded<\/em>   The encoded Base64 string.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7c548aab-cb4e-4a7d-c6f7-a1250ed3250f\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local sText     = \"I really like apples but only the glowing, purple ones.\";\n    local sEncoded  = base64.enc(sText);\n    print(sEncoded) --> SSByZWFsbHkgbGlrZSBhcHBsZXMgYnV0IG9ubHkgdGhlIGdsb3dpbmcsIHB1cnBsZSBvbmVzLg==<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }

            "constant": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates a constant in the LuaEx library. This function validates the constant name and value\n          to ensure that the name is a valid Lua variable and that the value is not nil. It checks for\n          existing variables to prevent overwriting and enforces compliance with naming rules.\n          The binding is protected from ordinary reassignment; table values retain mutable contents.<\/div><\/div><div class=\"custom-section\"><div id=\"25d892d8-37e8-ad1f-112d-e90eecfc83eb\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sName<\/em>   The name of the constant. Must be a non-blank string that complies with Lua\n          variable naming rules.   <strong><em>any<\/em><\/strong>   <em>vVal<\/em>   The value to assign to the constant. Must not be nil.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b0f3f1d6-2168-05b8-4ffa-0a1acbc01da8\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>None.<\/em><\/strong>   <em>The<\/em>   constant is added to the LuaEx library.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e054b4ea-038c-abc6-dd92-6c67b36ca316\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    -- Define a constant for the maximum number of players\n    constant(\"MAX_PLAYERS\", 10)\n\n    -- Use the constant in your code\n    print(\"The maximum number of players allowed is: \" .. tostring(MAX_PLAYERS))<\/code><\/pre><\/div><\/div><\/div>`,
                "subtable": null
            },
            "enum": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Immutable named collections with one-based ordinal lookup, ordered\n    iteration, optional values, and nested enums. Missing values use their ordinal.\n    Public enums register in LuaEx; private enums do not register globally.\n    Entries compare by identity; compare their value fields to compare payloads.\n    Payload objects remain references and are not recursively made immutable.\n    clone retains immutable collection/member/factory identity. Public metadata\n    views and ordinary writes are protected. Nested collections own their wrappers.<\/div><\/div><\/div>`,
                "subtable": {
                "__call": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates enum(name, names, values, private). Names are a nonempty dense\n    list of unique identifiers. Optional values use matching ordinal indices;\n    missing values or ENUM_DEFAULT_VALUE use the ordinal. False remains false.\n    Call a completed enum, or use pairs/ipairs, to iterate members in order.\n    __count and # return its size, __name returns its declared name, and __hasa\n    tests exact parent membership. Dot/string and one-based numeric lookup agree.<\/div><\/div><div class=\"custom-section\"><div id=\"eb3e66b9-c462-7efa-249f-c5bab273e64c\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sName<\/em>   The declared name.   <strong><em>table<\/em><\/strong>   <em>tNames<\/em>   The member-name list.   <strong><em>table<\/em><\/strong>   <em>tValues<\/em>   Optional payloads; defaults to an empty table.   <strong><em>boolean<\/em><\/strong>   <em>bPrivate<\/em>   Optional; defaults to false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"dd42259d-6e02-75c8-6597-ca633935efab\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>enum<\/em><\/strong>   <em>The<\/em>   new enum collection.<br><\/div><\/div><div class=\"custom-section\"><div id=\"6fd770c6-6beb-64ce-c54e-f988fd326515\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local oEnum = enum(\"PrivateExample\", {\"FIRST\", \"SECOND\"}, {false}, true);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "deserialize": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Restores a definition table as a private enum without overwriting global\n    bindings. A symbolic path string resolves an existing enum or member without\n    executing Lua code; unknown paths and malformed definitions raise errors.<\/div><\/div><div class=\"custom-section\"><div id=\"2432629b-147c-5e71-53d5-c7f3578f08e6\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table|string<\/em><\/strong>   <em>vData<\/em>   A snapshot or symbolic path.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b8d05ae9-a429-1cd8-428f-f72beaec8a21\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>enum|enumitem<\/em><\/strong>   <em>The<\/em>   restored or referenced value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"a16f688d-46ba-f31e-972c-257961613e73\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local oTier = enum.deserialize(\"TIER.I\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "deserializeMember": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Compatibility entry on each collection for older packed member saves,\n        such as TIER.deserialize(serializer.unpackData(...)). The unpacked value\n        must already be a member of this exact collection; its identity is retained.\n        New persistence uses the enum factory's registered restoration contract.<\/div><\/div><div class=\"custom-section\"><div id=\"afcf32bc-178f-e12d-c42a-c0e3e0d43083\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>enumitem<\/em><\/strong>   <em>oMember<\/em>   The already resolved member.<br><\/div><\/div><div class=\"custom-section\"><div id=\"31756fc0-939d-0ca6-f4ed-d8c5f4665b8b\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>enumitem<\/em><\/strong>   <em>The<\/em>   same validated member.<br><\/div><\/div><div class=\"custom-section\"><div id=\"a9819054-bdb3-4ce0-bb4a-02cf4042043d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local oMember = TIER.deserialize(TIER.I);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isenum": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Tests an actual enum collection, including one embedded as a parent member.<\/div><\/div><div class=\"custom-section\"><div id=\"129772f6-c03a-8d6e-2019-b6a909f7b5d1\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vValue<\/em>   The value to inspect.<br><\/div><\/div><div class=\"custom-section\"><div id=\"5ecb90fb-5c1a-11b8-585b-2679159cbd9f\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>Whether<\/em>   it is a collection made by this factory.<br><\/div><\/div><div class=\"custom-section\"><div id=\"00963309-610d-53f0-4eda-5dd04de15405\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local bEnum = enum.isenum(TIER);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isitem": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Tests an actual enum member, including an embedded collection with a parent.<\/div><\/div><div class=\"custom-section\"><div id=\"6e759c45-96a8-01c5-117c-f5fed0e368f0\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vValue<\/em>   The value to inspect.<br><\/div><\/div><div class=\"custom-section\"><div id=\"666a6af2-42e0-7979-e8ae-9f11293cf89e\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>Whether<\/em>   it is a member made by this factory.<br><\/div><\/div><div class=\"custom-section\"><div id=\"93b69cf2-99f4-5ea0-b240-58cfcd41029e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local bItem = enum.isitem(TIER.I);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "item": {
                    "value": ``,
                    "subtable": {
                    "Fields": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   id is the one-based ordinal; name is the parent's member key;\n        parent is the exact owning enum; value is the supplied/default payload;\n        valueType is its LuaEx type (the member key for an embedded collection).\n        Embedded collections expose these member fields and their own enum API.<\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "Operators": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Addition, subtraction, multiplication, division, modulo, and power\n        operate on numeric payloads and accept numeric scalar operands too.\n        Ordering compares payloads of siblings from the same parent. Equality\n        uses member identity, including members with equal payloads.<\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "isSibling": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Tests that another entry is distinct and has the same parent enum.<\/div><\/div><div class=\"custom-section\"><div id=\"44cc3e29-9665-e678-31bf-dfd93b3e78a1\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>enumitem<\/em><\/strong>   <em>other<\/em>   The proposed sibling.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c6f07f8f-e822-3218-2908-a63e53d05865\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>Whether<\/em>   the entries are distinct siblings.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f20fca3f-4b38-d98f-583a-0f11203c086e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local bSibling = TIER.I.isSibling(TIER.II);<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "isa": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Tests exact membership in the given parent enum.<\/div><\/div><div class=\"custom-section\"><div id=\"f193c846-9b1c-b8e7-c171-340c59220cb3\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>enum<\/em><\/strong>   <em>oEnum<\/em>   The proposed parent.<br><\/div><\/div><div class=\"custom-section\"><div id=\"48899fbb-e3f2-a910-7d95-bff19a738265\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>Whether<\/em>   this item's parent is oEnum.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f5a275da-cd58-282a-e3bb-03972e790bc3\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local bMember = TIER.I.isa(TIER);<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "next": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the next sibling; nil past the end unless wrapping is requested.<\/div><\/div><div class=\"custom-section\"><div id=\"03ca5d6e-ffc7-1b42-5b04-c753db3570fd\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bWrap<\/em>   Optional; defaults to false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d3ff5328-f8a0-a334-a646-412d76fe2c3e\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>enumitem|nil<\/em><\/strong>   <em>The<\/em>   next sibling.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c9bfb041-17cd-f3c9-1e76-db74e5729770\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local oNext = TIER.I.next();<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "previous": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the previous sibling; nil before the start unless wrapping is requested.<\/div><\/div><div class=\"custom-section\"><div id=\"416f6972-11aa-2c4e-efd8-cb49f88e0b96\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bWrap<\/em>   Optional; defaults to false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c9646f2f-07ec-3a32-e44e-bbc801cf29d6\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>enumitem|nil<\/em><\/strong>   <em>The<\/em>   previous sibling.<br><\/div><\/div><div class=\"custom-section\"><div id=\"13778319-c6e9-0fb3-7419-e9a3584bfae0\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local oPrevious = TIER.I.previous(true);<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "serialize": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns the complete symbolic path, including nested parent keys.\n        This is a reference only when the root is globally accessible. Use global\n        serialize to persist private enum items as well.<\/div><\/div><div class=\"custom-section\"><div id=\"1d754dbe-22a8-30b7-1002-3e3b1170cf6f\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>The<\/em>   symbolic path.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d3af4dbd-be6f-5ac0-edb6-994f6314454b\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local sPath = TIER.I.serialize();<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    }
                    }
                },
                "prep": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Builds a definition in assignment order. Assign named values, including\n    false or ENUM_DEFAULT_VALUE, then call the builder to create the enum. Reassigning\n    a name updates its value while retaining its position; nil assignments reject.\n    Nested builders are resolved as private enums when their parent is built.<\/div><\/div><div class=\"custom-section\"><div id=\"ed9250c3-d502-2957-87b1-99797f245658\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sName<\/em>   The enum's name.   <strong><em>boolean<\/em><\/strong>   <em>bPrivate<\/em>   Optional; defaults to false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"39ea9005-f5ae-e1ac-b403-53128db3a931\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>A<\/em>   callable mutable definition builder.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8bbd282c-dd98-5c08-fccf-d0bd21015804\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local Builder = enum.prep(\"PreparedExample\", true); Builder.FIRST = ENUM_DEFAULT_VALUE; local oEnum = Builder();<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "random": {

                "restore": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Codec restoration step. Adopts freshly decoded private child collections\n    to preserve references to nested members. Children must be unparented and\n    privately owned by the same decoding token. Member state {parent, name}\n    resolves a member of its restored parent. Use deserialize for snapshots of live enums,\n    which instead creates independent child wrappers.<\/div><\/div><div class=\"custom-section\"><div id=\"42b39eaa-6814-5fc5-b6c6-745bad5b0290\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tData<\/em>   An owned decoded definition {name, names, values}.   <strong><em>table<\/em><\/strong>   <em>tOwner<\/em>   The codec's opaque ownership token.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b2e4f0fb-2f55-8bb7-5d92-bae88cb03295\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>enum<\/em><\/strong>   <em>A<\/em>   restored private enum.<br><\/div><\/div><div class=\"custom-section\"><div id=\"6e8c0a27-ad80-400b-6011-4ca19489d497\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local oDecoded = enum.restore({name = \"DecodedExample\", names = {\"FIRST\"}, values = {false}}, {});<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "snapshot": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns a fresh definition table for an enum, including private/nested\n    enums. Payload objects are retained; member names and value lists are copied.<\/div><\/div><div class=\"custom-section\"><div id=\"a272118a-82f0-2c22-858c-4497710730e7\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>enum<\/em><\/strong>   <em>oEnum<\/em>   The enum to describe.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f10eba23-40fc-fd23-9c6c-1e5026798af4\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>The<\/em>   definition {name, names, values}.<br><\/div><\/div><div class=\"custom-section\"><div id=\"091a2cf0-9d20-40bb-19a7-8ef19c483a7a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local tDefinition = enum.snapshot(TIER);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "totable": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns a new table keyed by member objects. Values are each member's\n        payload unless an override is supplied; false is a valid override.<\/div><\/div><div class=\"custom-section\"><div id=\"2cd93042-fc93-a0da-4020-cc2fb68796d5\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vOverride<\/em>   Optional value for every member key.<br><\/div><\/div><div class=\"custom-section\"><div id=\"33c91343-3169-3be4-1fe6-4cbc9b49749e\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>The<\/em>   new mapping.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4ed42cc7-dd71-ae2d-cc43-80d5eff59e05\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local tEnabled = TIER.totable(false);<\/code><\/pre><\/div><\/div><\/div>`,
