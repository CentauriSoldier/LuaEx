            "schema": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   A simple package to check LUA-data against schemata. The package is written entirely in Lua (5.2) and has no further dependencies. It is designed to be easily extensible.\n    <br><br>\n    The problem tackled by this package is the following: Suppose your program is reading data via Lua. Verifying that the data fulfills the requirements of your program is tedious; Lua's lack of types requires you to write repetitive code to verify the input data.\n    <br><br>\n    The solution proposed by this package are schemata: You specify a schema for the data and the program automatically verifies the data for you.<\/div><\/div><div class=\"custom-section\"><div id=\"38be40a6-8a9a-af1b-1a18-c0b2e3c9afec\" class=\"section-title\">Author(s)<\/div><div class=\"section-content\">   Sebastian Schoener<br><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">License<\/div><div class=\"section-content\">   <a href=\"https://mit-license.org/\" target=\"_blank\">The MIT License (MIT)<\/a>\n    <br>\n    <p>Permission is hereby granted, free of charge, to any person obtaining a copy\n    of this software and associated documentation files (the \"Software\"), to deal\n    in the Software without restriction, including without limitation the rights\n    to use, copy, modify, merge, publish, distribute, sublicense, and/or sell\n    copies of the Software, and to permit persons to whom the Software is\n    furnished to do so, subject to the following conditions:\n\n    The above copyright notice and this permission notice shall be included in all\n    copies or substantial portions of the Software.\n\n    THE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\n    IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\n    FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\n    AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\n    LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\n    OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\n    SOFTWARE.<\/p><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">GitHub<\/div><div class=\"section-content\">   <a href=\"https://github.com/sschoener/lua-schema\" target=\"_blank\">lua-schema<\/a><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Copyright<\/div><div class=\"section-content\">   Copyright (c) 2014 Sebastian Schoener<\/div><\/div><\/div>`,
                "subtable": null
            }
            }
        },
        "Lua%20Hooks": {
            "value": ``,
            "subtable": {
            "io": {
                "value": ``,
                "subtable": {
                "chmod": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Modifies filesystem permissions for a file or directory using the native OS command.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Requires <code>sPermission<\/code> to be a non-empty string.\n    <br>- Requires <code>sPath<\/code> to be a non-empty string.\n    <br>- Rejects permission or path values containing double quotes or CR/LF characters.\n    <br>- On Windows, executes <code>icacls<\/code> with <code>/grant:r<\/code>.\n    <br>- On Unix-like systems, executes <code>chmod<\/code>.\n    <br>- Does not translate or normalize permission formats between operating systems.\n    <br>- Returns the result of <code>os.execute<\/code>.<\/div><\/div><div class=\"custom-section\"><div id=\"17d6e070-81b4-5bba-f6e5-4b4c2971964f\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sPermission<\/em>   The permission string passed directly to the underlying OS command.   <strong><em>string<\/em><\/strong>   <em>sPath<\/em>   The filesystem path whose permissions are modified.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f2ca5a03-9a95-e3a7-2d57-776505edd6b1\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vResult<\/em>   The return value of <code>os.execute<\/code> for the executed command.<br><\/div><\/div><div class=\"custom-section\"><div id=\"17af0091-f447-de99-b7b1-9d16b3894a3d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    io.chmod(\"755\", \"/usr/local/bin/tool\");\n    io.chmod(\"Users:(RX)\", \"C:\\\\Program Files\\\\MyApp\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "copy": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Copies a file from a source path to a destination path using the native system command.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Requires <code>sSource<\/code> to be a non-empty string.\n    <br>- Requires <code>sDestination<\/code> to be a non-empty string.\n    <br>- Rejects source or destination paths containing double quotes or CR/LF characters.\n    <br>- Executes the Windows <code>copy<\/code> command directly.\n    <br>- This function is supported on Windows systems only.\n    <br>- Does not verify file existence, overwrite behavior, or destination accessibility.\n    <br>- Does not recurse directories.\n    <br>- Returns the result of <code>os.execute<\/code>.<\/div><\/div><div class=\"custom-section\"><div id=\"adb64e59-6851-06a3-8032-6bd7956aa242\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sSource<\/em>   The source file path.   <strong><em>string<\/em><\/strong>   <em>sDestination<\/em>   The destination file path.<br><\/div><\/div><div class=\"custom-section\"><div id=\"fd69db09-04ba-0599-8abf-46aec83d033e\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vResult<\/em>   The return value of <code>os.execute<\/code> for the executed command.<br><\/div><\/div><div class=\"custom-section\"><div id=\"102089b9-f8bb-372a-6d80-def71f7d1ba7\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    io.copy(\"input.txt\", \"backup\\\\input.txt\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "delete": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Deletes a file using the native system command.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Requires <code>sPath<\/code> to be a non-empty string.\n    <br>- Rejects path values containing double quotes or CR/LF characters.\n    <br>- Executes the Windows <code>del<\/code> command with <code>/f<\/code> and <code>/q<\/code>.\n    <br>- Supported on Windows systems only.\n    <br>- Does not delete directories or perform recursive removal.\n    <br>- Does not verify file existence or permissions before execution.\n    <br>- Returns the result of <code>os.execute<\/code>.<\/div><\/div><div class=\"custom-section\"><div id=\"3da1590d-cebb-ac50-2049-478eda6b0d48\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sPath<\/em>   The file path to delete.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2635c03e-d60a-8c03-20be-424cdc1ed9c1\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vResult<\/em>   The return value of <code>os.execute<\/code> for the executed command.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8c34f778-91ed-e409-1a11-ad5cb5964f7c\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    io.delete(\"temp\\\\old_file.tmp\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "exists": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns true if the given path exists (file or directory), otherwise false.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Requires <code>sPath<\/code> to be a non-empty string.\n    <br>- Rejects <code>sPath<\/code> containing double quotes or CR/LF characters.\n    <br>- Uses <code>os.rename<\/code> as a fast existence probe.\n    <br>- Treats \"permission denied\" as existing.<\/div><\/div><div class=\"custom-section\"><div id=\"3e9c4ed7-3194-887e-83ac-798696e10306\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sPath<\/em>   The filesystem path to test.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c24b9cdb-1ea1-7a7c-6455-d814ab3a9a02\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bExists<\/em>   True if the path exists (file or directory).<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "findfile": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Searches the filesystem for a file by name and returns its location.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Requires <code>sFilename<\/code> to be a non-empty string.\n    <br>- Rejects filenames containing double quotes or CR/LF characters.\n    <br>- Searches the filesystem recursively for a regular file with an exact name match.\n    <br>- On Windows, uses <code>dir /s /b /a-d<\/code> starting from the current drive root.\n    <br>- On Unix, uses <code>find / -type f -name<\/code> starting from the filesystem root.\n    <br>- Stops searching after the first match is found.\n    <br>- Does not query file metadata or verify accessibility beyond what the underlying command returns.<\/div><\/div><div class=\"custom-section\"><div id=\"9199849e-9e51-69f5-0fb0-ac303ff62524\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sFilename<\/em>   The exact filename to search for.<br><\/div><\/div><div class=\"custom-section\"><div id=\"87727914-8896-b0cc-6c7b-f9d64a9b7452\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string|nil<\/em><\/strong>   <em>pPath<\/em>   The full path to the first matching file, or <code>nil<\/code> if no match is found.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b1733677-5c52-df25-7717-4e39d7b4ea0a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local p = io.findfile(\"notepad.exe\");\n    if (p) then\n        print(\"Found at:\", p);\n    end<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "findstr": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Executes the native <code>findstr<\/code> command with validated arguments.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Requires <code>sText<\/code> to be a non-empty string; otherwise throws an error.\n    <br>- Rejects <code>sText<\/code> containing double quotes or CR/LF characters.\n    <br>- If <code>sPath<\/code> is <code>nil<\/code>, executes <code>findstr \"&lt;sText&gt;\"<\/code>.\n    <br>- If <code>sPath<\/code> is provided, it must be a non-empty string.\n    <br>- Rejects <code>sPath<\/code> containing double quotes or CR/LF characters.\n    <br>- Executes the constructed command via <code>os.execute<\/code>.\n    <br>- Returns the result of <code>os.execute<\/code>.<\/div><\/div><div class=\"custom-section\"><div id=\"87ec3e6d-3c5a-3598-dc62-f2b70614e273\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sText<\/em>   The text string passed directly to <code>findstr<\/code>.   <strong><em>string|nil<\/em><\/strong>   <em>sPath<\/em>   Optional path argument passed directly to <code>findstr<\/code>.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e656d6fb-df0e-acfa-9c13-ffd33d35b363\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vResult<\/em>   The return value of <code>os.execute<\/code> for the executed command.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b5f9b05b-da19-e041-6617-b545d09c0aaa\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    io.findstr(\"ERROR\", \"C:\\\\Logs\\\\app.log\");\n    io.findstr(\"TODO\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getenddir": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns the final directory name in a filesystem path.\n    <br>This works consistently across Windows and Unix-style paths.\n    <br>If the path points to a file, the parent directory’s final segment is returned.\n    <br>If the path points to a directory, that directory’s name is returned.<\/div><\/div><div class=\"custom-section\"><div id=\"6841776d-1fea-ecd6-c80f-5e775345191d\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>pPath<\/em>   The filesystem path to inspect.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7cfcfb12-e01b-63d9-8190-7c92f629bcb9\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sEndDir<\/em>   The name of the last directory in the path, or an empty string if none exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"41d163cd-ea6b-f721-427b-7c9879866365\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    io.getenddir(\"C:\\\\Windows\\\\System32\\\\notepad.exe\");\n    --[[ Output->\n    System32\n    ]]\n\n    io.getenddir(\"/usr/local/bin/\");\n    --[[ Output->\n    bin\n    ]]\n\n    io.getenddir(\"C:\\\\\");\n    --[[ Output->\n    \"\"\n    ]]<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getuserdir": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns the current user’s home directory as defined by environment variables.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Attempts to read the <code>HOME<\/code> environment variable.\n    <br>- If <code>HOME<\/code> is not set or empty, attempts to read <code>USERPROFILE<\/code>.\n    <br>- If neither variable is present or valid, throws an error.\n    <br>- Does not query the filesystem or validate path existence.\n    <br>- Returns a single string value or fails explicitly.<\/div><\/div><div class=\"custom-section\"><div id=\"6eb2c6a5-accb-eefc-cf50-b58ac5c5a428\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sUserDir<\/em>   The resolved user home directory path.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7d07ff89-1bdb-4f77-c299-b478674b7fa8\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local pHome = io.getuserdir();\n    print(pHome);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "grep": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Executes the native <code>grep<\/code> command with the provided arguments.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Validates that <code>sPattern<\/code> is of type string; otherwise throws an error.\n    <br>- If <code>sPath<\/code> is a string, executes <code>grep \"&lt;sPattern&gt;\" \"&lt;sPath&gt;\"<\/code>.\n    <br>- If <code>sPath<\/code> is not a string, executes <code>grep \"&lt;sPattern&gt;\"<\/code>.\n    <br>- Does not perform escaping or sanitization of arguments.\n    <br>- Does not add any command-line flags.\n    <br>- Returns the result of <code>os.execute<\/code> when <code>sPath<\/code> is not a string.\n    <br>- When <code>sPath<\/code> <em>is<\/em> a string, the command result is assigned to a local\n    <br>variable but not explicitly returned (implicit <code>nil<\/code> return).<\/div><\/div><div class=\"custom-section\"><div id=\"d3d4cfb7-e89d-f623-5ba7-ce38e96c2c2b\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sPattern<\/em>   The pattern passed directly to <code>grep<\/code>.   <strong><em>string|any<\/em><\/strong>   <em>sPath<\/em>   Optional path argument passed directly to <code>grep<\/code>.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b0fdb367-7a1f-1421-2c34-fa5ca8ce5689\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vResult<\/em>   The return value of <code>os.execute<\/code>, or <code>nil<\/code> depending on control flow.<br><\/div><\/div><div class=\"custom-section\"><div id=\"a30302fc-08ab-8721-ec75-d0ecc45fc98a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    io.grep(\"TODO\", \"/var/log/syslog\");\n    io.grep(\"error\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isdir": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns true if the given path exists and is a directory.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Requires <code>sPath<\/code> to be a non-empty string.\n    <br>- Rejects <code>sPath<\/code> containing double quotes or CR/LF characters.\n    <br>- Uses OS-native checks:\n    <br>  - Windows: <code>if exist \"path\\NUL\"<\/code>\n    <br>  - Unix: <code>test -d \"path\"<\/code><\/div><\/div><div class=\"custom-section\"><div id=\"e5bfa302-022f-582d-7edf-57f20a527c08\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sPath<\/em>   The filesystem path to test.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e42c63fe-862b-8a3f-66d7-e74062f4aa56\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bIsDir<\/em>   True if the path is a directory.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isdirectchild": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Determines whether one path is a <em>direct child<\/em> of another path.\n    <br>\n    <br>This function performs a strict, structural comparison:\n    <br>- <code>pChild<\/code> must be exactly one directory level below <code>pParent<\/code>.\n    <br>- The parent portion of <code>pChild<\/code> must match <code>pParent<\/code> exactly after normalization.\n    <br>- Deeper descendants are rejected.\n    <br>- Partial or substring matches are rejected.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Requires both paths to be non-empty strings.\n    <br>- Normalizes both paths before comparison.\n    <br>- Trailing path separators are ignored.\n    <br>- Does not query the filesystem; this is a pure path-structure check.\n    <br>- Works consistently across Windows and Unix-style paths.<\/div><\/div><div class=\"custom-section\"><div id=\"98481174-4f18-b239-64cf-29ab6f2a5af7\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>pParent<\/em>   The parent directory path.   <strong><em>string<\/em><\/strong>   <em>pChild<\/em>   The path being tested as a direct child.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e43b1ce5-c234-7b39-97aa-9cf93d0742a9\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bIsDirectChild<\/em>   <code>true<\/code> if <code>pChild<\/code> is directly inside <code>pParent<\/code>; otherwise <code>false<\/code>.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7181f021-e3a6-41b1-7414-b71123458355\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    io.isdirectchild(\"C:\\\\Games\", \"C:\\\\Games\\\\MyGame\");\n    -- true\n\n    io.isdirectchild(\"C:\\\\Games\", \"C:\\\\Games\\\\MyGame\\\\bin\");\n    -- false\n\n    io.isdirectchild(\"/opt/games\", \"/opt/games/game1\");\n    -- true<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isfile": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns true if the given path exists and is a regular file.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Requires <code>sPath<\/code> to be a non-empty string.\n    <br>- Rejects <code>sPath<\/code> containing double quotes or CR/LF characters.\n    <br>- Uses OS-native checks:\n    <br>  - Windows: exists AND NOT a directory via <code>path\\NUL<\/code> test.\n    <br>  - Unix: <code>test -f \"path\"<\/code><\/div><\/div><div class=\"custom-section\"><div id=\"93554048-354f-3e47-bb03-ec43c95a35e4\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sPath<\/em>   The filesystem path to test.<br><\/div><\/div><div class=\"custom-section\"><div id=\"54143356-5ae0-cd89-4ec9-a0942e6bfac5\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bIsFile<\/em>   True if the path is a regular file.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "list": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Lists all files and directories in a given path (optionally recursively).<\/div><\/div><div class=\"custom-section\"><div id=\"08883cf1-15c7-bdcd-8b23-8994f4770da5\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sPath<\/em>   The path which to search for files and directories.   <strong><em>boolean|nil<\/em><\/strong>   <em>bRecursive<\/em>   Whether to recurse through subdirectories.   <strong><em>function|nil<\/em><\/strong>   <em>fCallback<\/em>   The function to call when a file or directory is found.\n    <br>This function must accept a string as its first argument which will be the full path to the item found.\n    <br>This function must accept a boolean as its second argument which indicates whether the item found is a file (true if a file) or a directory (false if a directory).<br><\/div><\/div><div class=\"custom-section\"><div id=\"a71c71f7-7938-7aa1-c9c6-e6b1e820f229\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tItems<\/em>   A table whose keys are strings (directories, files) whose values are numerically-indexed table whose values are full paths of the found files and directories.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f161f382-2623-a567-7675-3ae60bfaaf39\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local function printitem(pFile, bIsFile)\n        print(\"Is File: \"..tostring(bIsFile), pFile);\n    end\n\n    local tItems = io.list(\"C:\\\\Windows\\\\System32\", true, printitem, \"exe\");\n    --[[ Output->\n    Is File: false\tC:\\Windows\\System32\\0409\n    Is File: false\tC:\\Windows\\System32\\AdvancedInstallers\n    Is File: false\tC:\\Windows\\System32\\am-et\n    Is File: false\tC:\\Windows\\System32\\AppLocker\n    ...\n    Is File: true\tC:\\Windows\\System32\\agentactivationruntimestarter.exe\n    Is File: true\tC:\\Windows\\System32\\AgentService.exe\n    Is File: true\tC:\\Windows\\System32\\AggregatorHost.exe\n    Is File: true\tC:\\Windows\\System32\\aitstatic.exe\n    ...\n    ]]<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "listdirs": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Lists all directories in a given path (optionally recursively).<\/div><\/div><div class=\"custom-section\"><div id=\"f2fb3d21-8a55-24d8-9924-9c6011299e8f\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sPath<\/em>   The path which to search for directories.   <strong><em>boolean|nil<\/em><\/strong>   <em>bRecursive<\/em>   Whether to recurse through subdirectories.   <strong><em>function|nil<\/em><\/strong>   <em>fCallback<\/em>   The function to call when a directory is found.\n    <br>This function must accept a string as its first argument which will be the full path to the directory found.<br><\/div><\/div><div class=\"custom-section\"><div id=\"5aa890de-4e5d-e8da-2946-135fdf1c9a83\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tDirectories<\/em>   A numerically-indexed table whose values are full paths of the found directories.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7f8fe67a-f418-2559-004b-af53de203bd3\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local function printdir(pDir)\n        print(pDir);\n    end\n\n    local tDirectories = io.listdirs(\"C:\\\\Windows\\\\System32\\\\Speech\", true, printdir);\n\n    --[[ Output->\n    C:\\Windows\\System32\\Speech\\Common\n    C:\\Windows\\System32\\Speech\\Engines\n    C:\\Windows\\System32\\Speech\\SpeechUX\n    C:\\Windows\\System32\\Speech\\Common\\en-US\n    C:\\Windows\\System32\\Speech\\Engines\\SR\n    C:\\Windows\\System32\\Speech\\Engines\\TTS\n    C:\\Windows\\System32\\Speech\\Engines\\SR\\en-US\n    C:\\Windows\\System32\\Speech\\SpeechUX\\en-US\n    ]]<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "listfiles": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Lists all files in a given path (optionally recursively).\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Requires <code>sPath<\/code> to be a non-empty string.\n    <br>- If <code>bRecursive<\/code> is provided, it must be a boolean.\n    <br>- If <code>fCallback<\/code> is provided, it must be a function.\n    <br>- Rejects <code>sPath<\/code> containing double quotes or CR/LF characters.\n    <br>- Optional filetype filters may be provided as additional string arguments (extensions without dots).\n    <br>- When filters are provided, only files whose extension matches (case-insensitive) are returned.\n    <br>- On Windows, executes <code>dir /b /a-d<\/code> with optional <code>/s<\/code>.\n    <br>- On Unix-like systems, executes <code>find<\/code> with <code>-type f<\/code> and optional <code>-maxdepth 1<\/code>.\n    <br>- When not recursive on Windows, results are prefixed with <code>sPath<\/code>.\n    <br>- If a callback is provided, it is invoked as <code>fCallback(pFile, true)<\/code> for each included file.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Note<\/div><div class=\"section-content\">   <strong>On Windows<\/strong>: if your host process is 32-bit, Windows <em>may<\/em> redirect System32 → SysWOW64, so total file count can differ from Explorer's count. Use 'Sysnative' instead of 'System32' in your path if you need the real 64-bit System32.<\/div><\/div><div class=\"custom-section\"><div id=\"a248c717-5404-20ac-6be6-17eac01785c4\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sPath<\/em>   The path which to search for files.   <strong><em>boolean|nil<\/em><\/strong>   <em>bRecursive<\/em>   Whether to recurse through subdirectories.   <strong><em>function|nil<\/em><\/strong>   <em>fCallback<\/em>   Optional callback invoked per included file.   <strong><em>string<\/em><\/strong>   <em>...<\/em>   Optional file extension filters (without dots), e.g. <code>\"exe\"<\/code>, <code>\"png\"<\/code>.<br><\/div><\/div><div class=\"custom-section\"><div id=\"0e19fa84-c8e0-14f3-02ea-9fabec7ceb0c\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tFiles<\/em>   A numerically-indexed table of full file paths.<br><\/div><\/div><div class=\"custom-section\"><div id=\"85218502-dd89-3f10-8cdd-94a1b9cd12b4\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local function printfile(pFile)\n        print(pFile);\n    end\n\n    local tFiles = io.listfiles(\"C:\\\\Windows\\\\System32\", false, printfile, \"exe\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "mkdir": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates a directory at the specified path using the native system command.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Requires <code>sPath<\/code> to be a non-empty string.\n    <br>- Rejects path values containing double quotes or CR/LF characters.\n    <br>- On Windows, executes the <code>mkdir<\/code> command.\n    <br>- On Unix-like systems, executes <code>mkdir -p<\/code>.\n    <br>- Parent directories are created as needed.\n    <br>- Does not verify path existence or permissions before execution.\n    <br>- Returns the result of <code>os.execute<\/code>.<\/div><\/div><div class=\"custom-section\"><div id=\"ba667b1c-abab-79d9-883f-75f45a2ab05c\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sPath<\/em>   The directory path to create.<br><\/div><\/div><div class=\"custom-section\"><div id=\"33d7d579-d77d-4e1d-21d6-49cd90274bcf\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vResult<\/em>   The return value of <code>os.execute<\/code> for the executed command.<br><\/div><\/div><div class=\"custom-section\"><div id=\"594764c7-d0a9-5d09-3c78-9c4d1a389b04\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    io.mkdir(\"output\\\\logs\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "move": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Moves or renames a file using the native system command.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Requires <code>sSource<\/code> to be a non-empty string.\n    <br>- Requires <code>sDestination<\/code> to be a non-empty string.\n    <br>- Rejects source or destination paths containing double quotes or CR/LF characters.\n    <br>- Executes the Windows <code>move<\/code> command directly.\n    <br>- Supported on Windows systems only.\n    <br>- Does not verify file existence, overwrite behavior, or destination accessibility.\n    <br>- Does not perform recursive directory moves.\n    <br>- Returns the result of <code>os.execute<\/code>.<\/div><\/div><div class=\"custom-section\"><div id=\"0f1b72bd-8fae-206b-9959-375d628f7fd0\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sSource<\/em>   The source file path.   <strong><em>string<\/em><\/strong>   <em>sDestination<\/em>   The destination file path.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9fb4580f-255d-2ea1-1d96-f616a6418849\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vResult<\/em>   The return value of <code>os.execute<\/code> for the executed command.<br><\/div><\/div><div class=\"custom-section\"><div id=\"24f50dd2-5604-6348-3785-3bb08fbd779d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    io.move(\"temp\\\\file.txt\", \"archive\\\\file.txt\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "normalizepath": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Normalizes a path string by removing \".\" segments, resolving \"..\" segments,\n    <br>and rebuilding the path using the current OS separator.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Treats both \"/\" and \"\\\" as separators when splitting.\n    <br>- Removes \".\" segments.\n    <br>- Resolves \"..\" by removing the previous segment when possible.\n    <br>- On Windows, preserves a leading drive letter segment (e.g. \"C:\") if present.\n    <br>- On Unix, preserves a leading \"/\" only if the input path started with \"/\".\n    <br>- On Windows, if no drive letter is present, the result is forced to begin with \"\\\".\n    <br>- Does not query the filesystem; this is purely string-based normalization.<\/div><\/div><div class=\"custom-section\"><div id=\"82db5159-0a35-b90b-18b8-4d0a637a7d28\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>path<\/em>   The path string to normalize.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2cdf3146-9a67-5295-ddb7-1a0f67a22cb0\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>pNormalized<\/em>   The normalized path string.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8369d91c-898d-9e0c-bd55-36e445ba6957\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    io.normalizepath(\"C:\\\\Windows\\\\System32\\\\..\\\\notepad.exe\");\n    --[[ Output->\n    C:\\Windows\\notepad.exe\n    ]]\n\n    io.normalizepath(\"/usr/local/../bin/\");\n    --[[ Output->\n    /usr/bin\n    ]]\n\n    io.normalizepath(\"foo/./bar/../baz\");\n    --[[ Output->\n    \\foo\\baz\n    ]]<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "rmdir": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Removes a directory and its contents using the native system command.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Requires <code>sPath<\/code> to be a non-empty string.\n    <br>- Rejects path values containing double quotes or CR/LF characters.\n    <br>- Removes the target directory recursively.\n    <br>- On Windows, executes <code>rmdir /s /q<\/code>.\n    <br>- On Unix-like systems, executes <code>rm -rf<\/code>.\n    <br>- Does not verify path existence or prompt for confirmation.\n    <br>- Returns the result of <code>os.execute<\/code>.<\/div><\/div><div class=\"custom-section\"><div id=\"387ee571-56bd-7614-c61c-bcc54bce21cb\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sPath<\/em>   The directory path to remove.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ed04643b-1bc6-7b3c-75d8-a5a2b04a4056\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vResult<\/em>   The return value of <code>os.execute<\/code> for the executed command.<br><\/div><\/div><div class=\"custom-section\"><div id=\"68e3f6c6-fbbf-81ad-6ed8-cf7e569b06e9\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    io.rmdir(\"build\\\\temp\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "splitpath": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Splits a filesystem path into its constituent components.\n    <br>Supports Windows and Unix-style paths.\n    <br>Extensions are returned without the dot.\n    <br>Dotfiles (e.g. \".gitignore\") return an empty filename and a populated extension.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Requires <code>sPath<\/code> to be a non-empty string.\n    <br>- Trims trailing path separators (both \"/\" and \"\\\").\n    <br>- On Windows, captures a drive prefix (e.g. \"C:\") when present.\n    <br>- The returned <code>directory<\/code> is the parent path portion (without the trailing separator).\n    <br>- The returned <code>filename<\/code> is the leaf name without extension.\n    <br>- The returned <code>extension<\/code> is the leaf extension without dot, only when a non-empty stem exists.<\/div><\/div><div class=\"custom-section\"><div id=\"3a81f277-49c8-2098-17f3-a1100eb051cf\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sPath<\/em>   The filesystem path to split.<br><\/div><\/div><div class=\"custom-section\"><div id=\"0758a46e-7f54-2994-365c-3ae6ea71aa5d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tParts<\/em>   A table containing the split path components.\n    <br><strong>Fields:<\/strong>\n    <br><code>directory<\/code> – Parent directory path (without trailing separator)\n    <br><code>drive<\/code> – Drive prefix (Windows only, otherwise empty)\n    <br><code>filename<\/code> – Leaf name without extension\n    <br><code>extension<\/code> – Leaf extension without dot<br><\/div><\/div><div class=\"custom-section\"><div id=\"9f92b01a-0dec-1742-1b72-822ed6a65e89\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local t = io.splitpath(\"C:\\\\Windows\\\\System32\\\\notepad.exe\");\n\n    --[[ Output->\n    {\n        drive     = \"C:\",\n        directory = \"C:\\\\Windows\\\\System32\",\n        filename  = \"notepad\",\n        extension = \"exe\"\n    }\n    ]];\n\n    t = io.splitpath(\".gitignore\");\n\n    --[[ Output->\n    {\n        drive     = \"\",\n        directory = \"\",\n        filename  = \"\",\n        extension = \"gitignore\"\n    }\n    ]];<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "unzip": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Extracts the contents of a ZIP archive to a destination directory using the native system command.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Requires <code>sArchive<\/code> to be a non-empty string.\n    <br>- Requires <code>sDestination<\/code> to be a non-empty string.\n    <br>- Rejects archive or destination paths containing double quotes or CR/LF characters.\n    <br>- Executes the <code>unzip<\/code> command directly; availability depends on the system environment.\n    <br>- Does not verify archive existence, format validity, or destination permissions.\n    <br>- Does not perform cleanup or conflict resolution.\n    <br>- Returns the result of <code>os.execute<\/code>.<\/div><\/div><div class=\"custom-section\"><div id=\"2afcdc1e-ba72-9cca-fad7-79b226329e56\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sArchive<\/em>   The ZIP archive file path.   <strong><em>string<\/em><\/strong>   <em>sDestination<\/em>   The directory path to extract files into.<br><\/div><\/div><div class=\"custom-section\"><div id=\"144872d1-4b89-00d5-1eae-fb0445f995b3\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vResult<\/em>   The return value of <code>os.execute<\/code> for the executed command.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7202b62b-8c1c-9834-ef71-2c7e526a4779\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    io.unzip(\"archive.zip\", \"output_dir\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "zip": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates a ZIP archive containing the specified files using the native system command.\n    <br>\n    <br><strong>Behavior notes (as implemented):<\/strong>\n    <br>- Requires <code>tFiles<\/code> to be a non-empty table of file path strings.\n    <br>- Requires <code>sDestination<\/code> to be a non-empty string.\n    <br>- Rejects file paths or destination paths containing double quotes or CR/LF characters.\n    <br>- Does not verify file existence or accessibility before invoking the command.\n    <br>- Executes the <code>zip<\/code> command directly; availability depends on the system environment.\n    <br>- Does not recurse directories or expand wildcards.\n    <br>- Returns the result of <code>os.execute<\/code>.<\/div><\/div><div class=\"custom-section\"><div id=\"7874af64-92ec-5c64-4e8b-96a2e5d0736b\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tFiles<\/em>   A numerically-indexed table of file paths to include in the archive.   <strong><em>string<\/em><\/strong>   <em>sDestination<\/em>   The output ZIP file path.<br><\/div><\/div><div class=\"custom-section\"><div id=\"fc43439f-e5ea-95ed-e26d-11ab377e533c\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vResult<\/em>   The return value of <code>os.execute<\/code> for the executed command.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f1b50b8e-64d4-d5ce-40df-75e2cadc21d2\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    io.zip({ \"file1.txt\", \"file2.txt\" }, \"archive.zip\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }

                    "subtable": {
                    "clamp": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Clamps a native number to inclusive ordered bounds. Infinity is supported; NaN and reversed bounds are rejected.<\/div><\/div><div class=\"custom-section\"><div id=\"3d964cb9-44b7-d1dc-eb40-d36fe17b966d\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nValue<\/em>   The value.   <strong><em>number<\/em><\/strong>   <em>nMinValue<\/em>   Minimum bound.   <strong><em>number<\/em><\/strong>   <em>nMaxValue<\/em>   Maximum bound.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7c628d84-6f86-8764-9464-ad8a00a9a3f8\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nRet<\/em>   The clamped value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2a416c30-d80e-b660-617d-9a26b667fd36\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.clamp(12, 0, 10)); -- 10<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "convertbase": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Converts a signed integer string between bases 2 through 36, using uppercase output digits. Numeric input is accepted only for base 10. Values must lie in the exact integer range -9007199254740991 through 9007199254740991; invalid digits and overflow are rejected.<\/div><\/div><div class=\"custom-section\"><div id=\"543da93d-b4c7-ba66-7390-606572d64c9b\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string|number<\/em><\/strong>   <em>vInput<\/em>   The input integer.   <strong><em>number<\/em><\/strong>   <em>nFromBase<\/em>   Input base.   <strong><em>number<\/em><\/strong>   <em>nToBase<\/em>   Output base.<br><\/div><\/div><div class=\"custom-section\"><div id=\"576e0d29-9f63-bfd3-809e-35d334deeb09\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sRet<\/em>   The converted integer.<br><\/div><\/div><div class=\"custom-section\"><div id=\"727931fe-b27f-c35b-6093-b625d889dc23\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.convertbase(\"FF\", 16, 2)); -- 11111111<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "counting": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Converts a finite number's magnitude to a counting number (at least one). Floors by default, or rounds upward when requested.<\/div><\/div><div class=\"custom-section\"><div id=\"d2b6f95a-3d37-29ac-d701-9a3397fb2149\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nValue<\/em>   The input.   <strong><em>boolean|nil<\/em><\/strong>   <em>bRaise<\/em>   Round upward; defaults to false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4624b7a9-6923-e506-1f15-8cfe571da9fa\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nRet<\/em>   The counting number.<br><\/div><\/div><div class=\"custom-section\"><div id=\"78529d9d-b8cc-2d2e-3350-ca204a8c9c25\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.counting(-2.7)); -- 2<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "drift": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adds a uniformly selected integer offset in the inclusive range [-nDrift, nDrift] to a finite value.<\/div><\/div><div class=\"custom-section\"><div id=\"fcd75a6f-205c-bcdc-b323-49e8d6507297\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nValue<\/em>   The base value.   <strong><em>number<\/em><\/strong>   <em>nDrift<\/em>   Nonnegative exact integer offset limit.<br><\/div><\/div><div class=\"custom-section\"><div id=\"5edaaedf-f4c2-3c14-d494-31778def57fb\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nRet<\/em>   The shifted value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8a5f6e43-6e95-a152-40ec-12b2fafb0703\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.drift(10, 0)); -- 10<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "driftf": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Applies a random proportional drift using randomf's four-decimal grid. A drift of 0.1 permits offsets up to ten percent of the value in either direction.<\/div><\/div><div class=\"custom-section\"><div id=\"b58facd0-a1f9-1805-662c-49293fa8c629\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nValue<\/em>   The finite base value.   <strong><em>number<\/em><\/strong>   <em>nDrift<\/em>   Nonnegative finite proportional limit.<br><\/div><\/div><div class=\"custom-section\"><div id=\"da157d6a-a99d-e92b-68d0-6f8aa17a8014\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nRet<\/em>   The shifted value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7fda1dd9-7b0d-712f-7c7d-eff6424d05df\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.driftf(10, 0)); -- 10<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "factorial": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Calculates the factorial of a nonnegative integer, including 0! = 1. Returns a floating-point number; larger results may be rounded. Values above 170 are rejected to prevent infinity.<\/div><\/div><div class=\"custom-section\"><div id=\"f356801e-6f27-d9e6-be96-5ead5ae9a8ce\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nValue<\/em>   Integer from 0 through 170.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b4125ed0-7502-6c37-81cf-1d19292305c9\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nRet<\/em>   The factorial.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9d178f34-5152-72fe-0a91-e6f3c9bee331\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.factorial(5)); -- 120<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "gcf": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the nonnegative greatest common factor of two exact integers. Signs are ignored; gcf(0, n) is abs(n), and gcf(0, 0) is zero.<\/div><\/div><div class=\"custom-section\"><div id=\"4674e0e0-d37b-74c6-eaff-11196430264d\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nLeft<\/em>   First integer.   <strong><em>number<\/em><\/strong>   <em>nRight<\/em>   Second integer.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1786283b-9c95-e4c6-5e0e-f9cd0b0f90d7\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nRet<\/em>   The greatest common factor.<br><\/div><\/div><div class=\"custom-section\"><div id=\"10c68668-f0d4-19ff-5b4f-149bc3331ff2\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.gcf(12, 18)); -- 6<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "inttorgb": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Unpacks a 24-bit color matching rgbtoint: red is the low byte, green the middle byte, and blue the high byte.<\/div><\/div><div class=\"custom-section\"><div id=\"ae680a36-10fa-6e73-2b58-1386c49e629d\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nColor<\/em>   Integer from 0 through 16777215.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e29d5073-f5c4-9723-ad0c-ab9183381d16\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nR<\/em>   The red channel.   <strong><em>number<\/em><\/strong>   <em>nG<\/em>   The green channel.   <strong><em>number<\/em><\/strong>   <em>nB<\/em>   The blue channel.<br><\/div><\/div><div class=\"custom-section\"><div id=\"557f2e62-e9bb-7b54-2593-27dfd6efa7f2\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.inttorgb(math.rgbtoint(10, 20, 30))); -- 10 20 30<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "isabstract": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether a value is a native nonfinite number: NaN, positive infinity, or negative infinity. Returns false for finite numbers and non-numbers. Retained for compatibility; prefer math.isnan or math.isinf when checking a specific condition.<\/div><\/div><div class=\"custom-section\"><div id=\"89c9c4ff-276f-663b-e3a0-0b6e24c4990a\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vInput<\/em>   The value to check.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ef54975b-204e-f3b9-76f2-477a2481a9a2\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bIsAbstract<\/em>   Whether the value is a native nonfinite number.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f0da0910-931a-dadb-2a47-d42dcfe32dee\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.isabstract(math.inf)); -- true<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "iseven": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether a value is a finite integer divisible by two. Returns false for fractions and non-numbers.<\/div><\/div><div class=\"custom-section\"><div id=\"bd387819-e8b4-07c2-051a-84921497ffe6\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vInput<\/em>   The value to check.<br><\/div><\/div><div class=\"custom-section\"><div id=\"581b42f3-90b3-a4f1-c8cf-3d3a10e3cc9b\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bIsEven<\/em>   Whether the value is even.<br><\/div><\/div><div class=\"custom-section\"><div id=\"fe7f4812-421c-b49c-a59b-9f19db008d90\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.iseven(4)); -- true<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "isfinite": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether a value is a native finite number, excluding NaN and either infinity. Returns false for non-numbers, including objects presenting a custom number type.<\/div><\/div><div class=\"custom-section\"><div id=\"7f304a23-a686-d6bf-78d2-59ad45ed9d9a\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vInput<\/em>   The value to check.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b3bd5890-5155-5128-2bc2-9818d0535565\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bIsFinite<\/em>   Whether the value is finite.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1b7bab39-7fec-d5bb-857a-a560830f670a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.isfinite(42)); -- true<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "isinf": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether a value is native positive or negative infinity. Returns false for non-numbers.<\/div><\/div><div class=\"custom-section\"><div id=\"457b220a-4967-6b7e-ec73-c318187adab6\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vInput<\/em>   The value to check.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2b57da8a-465c-9554-37de-12af0fa512ac\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bIsInfinity<\/em>   Whether the value is infinite.<br><\/div><\/div><div class=\"custom-section\"><div id=\"5d5306b2-d609-0dfe-b04c-36aa537f0f70\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.isinf(math.inf)); -- true<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "isinteger": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether a value is a native finite number with no fractional part. Returns false for non-numbers, NaN, and infinity.<\/div><\/div><div class=\"custom-section\"><div id=\"c27e86c5-2959-5df0-c679-9f254b2b85ea\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vInput<\/em>   The value to check.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7f945378-238c-8865-edb5-f1021ef3af6a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bIsInteger<\/em>   Whether the value is an integer.<br><\/div><\/div><div class=\"custom-section\"><div id=\"77217041-d4ac-e153-1ac5-4dde82034eb9\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.isinteger(2.5)); -- false<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "isnan": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether a value is native NaN. NaN is unequal to itself; equality with math.nan cannot identify it. Returns false for non-numbers.<\/div><\/div><div class=\"custom-section\"><div id=\"5f6ec45e-3c47-41fe-9402-bae985a05c45\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vInput<\/em>   The value to check.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9329c910-b033-64e2-9bed-72d5d61d8af1\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bIsNaN<\/em>   Whether the value is NaN.<br><\/div><\/div><div class=\"custom-section\"><div id=\"a6e753ea-1029-b21c-a1d0-0d9073dd29d0\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.isnan(math.nan)); -- true<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "isodd": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether a value is a finite integer not divisible by two. Returns false for fractions and non-numbers.<\/div><\/div><div class=\"custom-section\"><div id=\"9632e447-0ddf-1820-62d4-749e41a1e14a\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vInput<\/em>   The value to check.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ac5d6abb-a03b-e1c1-ab6d-deb172efafcb\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bIsOdd<\/em>   Whether the value is odd.<br><\/div><\/div><div class=\"custom-section\"><div id=\"94607519-dafc-6486-018a-63bb688827f7\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.isodd(-3)); -- true<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "randomf": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Generates a uniform random float on a four-decimal grid within inclusive finite bounds. Reversed bounds are accepted. Rejects intervals containing no grid value and scaled bounds outside the exact integer range. Uses the shared math.random stream.<\/div><\/div><div class=\"custom-section\"><div id=\"7670e5d4-c556-81a2-88e9-c2d883ec59d6\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nMinRaw<\/em>   One interval endpoint.   <strong><em>number<\/em><\/strong>   <em>nMaxRaw<\/em>   The other endpoint.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9b6a3057-7542-e26e-ed7a-c823515d9a36\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nResult<\/em>   The result.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bad2debf-fb52-d485-fa4f-14753146ac2a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.randomf(1, 1)); -- 1<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "ratio": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Reduces an integer ratio by its greatest common factor, preserving each input sign. A single zero is supported; the ratio 0:0 is undefined and rejected.<\/div><\/div><div class=\"custom-section\"><div id=\"79d73c3f-5298-7118-3233-7b11003c775a\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nLeft<\/em>   Left integer.   <strong><em>number<\/em><\/strong>   <em>nRight<\/em>   Right integer.<br><\/div><\/div><div class=\"custom-section\"><div id=\"aa467c7e-0546-2982-7e19-1af932e1323b\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tRatio<\/em>   The reduced left and right values.<br><\/div><\/div><div class=\"custom-section\"><div id=\"a1c78037-6bd8-b131-1398-00af1f6eedf8\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local tRatio = math.ratio(12, 18); print(tRatio.left, tRatio.right); -- 2 3<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "rgbtohex": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Converts RGB channels to an uppercase 0xRRGGBB string. Finite integer channels are clamped to the range 0 through 255.<\/div><\/div><div class=\"custom-section\"><div id=\"fb96a103-5354-6459-d687-bc505f5af450\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nR<\/em>   Red channel.   <strong><em>number<\/em><\/strong>   <em>nG<\/em>   Green channel.   <strong><em>number<\/em><\/strong>   <em>nB<\/em>   Blue channel.<br><\/div><\/div><div class=\"custom-section\"><div id=\"56912200-68cc-e733-5c7f-424795b87529\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sHex<\/em>   The hexadecimal color.<br><\/div><\/div><div class=\"custom-section\"><div id=\"0c260faa-b4e1-d39f-6238-92d62729434e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.rgbtohex(255, 0, 16)); -- 0xFF0010<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "rgbtoint": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Packs RGB integer channels in the range 0 through 255 into a 24-bit value. Retains the existing byte order: R + G * 256 + B * 65536. This byte order differs from the displayed 0xRRGGBB string.<\/div><\/div><div class=\"custom-section\"><div id=\"63127638-b349-2949-bca4-38688a74420f\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nR<\/em>   Red channel.   <strong><em>number<\/em><\/strong>   <em>nG<\/em>   Green channel.   <strong><em>number<\/em><\/strong>   <em>nB<\/em>   Blue channel.<br><\/div><\/div><div class=\"custom-section\"><div id=\"230ad75a-3be9-a11f-d22f-2834177c1dd5\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nColor<\/em>   The packed color.<br><\/div><\/div><div class=\"custom-section\"><div id=\"cff312e4-39b1-e501-0e12-396dbfe68fef\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.rgbtoint(1, 2, 3)); -- 197121<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "sum": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adds all supplied finite numbers in argument order. No arguments returns zero; nil holes, non-numbers, and nonfinite results are rejected.<\/div><\/div><div class=\"custom-section\"><div id=\"b742352f-e430-566f-7823-1d39dabf4057\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>...<\/em>   Values to add.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b46dcacd-0fd1-6ef8-a347-d5d5f0641c05\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nRet<\/em>   The sum.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d876fa6a-0383-9706-d866-789fe7e7cd2a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.sum(1, 2, 3)); -- 6<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "whole": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Converts a finite number's magnitude to a whole number, including zero. Floors by default, or rounds upward when requested.<\/div><\/div><div class=\"custom-section\"><div id=\"ea22ffbd-101e-9bb4-92ef-40eb86a18464\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nValue<\/em>   The input.   <strong><em>boolean|nil<\/em><\/strong>   <em>bRaise<\/em>   Round upward; defaults to false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"3a8be1b2-215c-fa4e-3299-74495fd69a72\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nRet<\/em>   The whole number.<br><\/div><\/div><div class=\"custom-section\"><div id=\"81ee1362-fe9e-3072-aa0d-120d6ec0bccd\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.whole(-0.7)); -- 0<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    }
                    }
                },
                "geometry": {
                    "value": ``,
                    "subtable": {
                    "Functions": {
                        "value": ``,
                        "subtable": {
                        "fitrect": {
                            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Fits an inner rectangle's aspect ratio to the largest size inside an outer rectangle, allowing enlargement. Returns a new rectangle at the outer origin or centered when requested; inputs remain unchanged. Inner width/height must be positive or the result is nil; a zero-size outer dimension produces a zero-size result. Coordinates and dimensions must be finite, and dimensions nonnegative.<\/div><\/div><div class=\"custom-section\"><div id=\"b7d7466a-c855-8db0-e123-094881cfbb13\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tOuter<\/em>   Outer rectangle with x, y, width, and height.   <strong><em>table<\/em><\/strong>   <em>tInner<\/em>   Inner rectangle with width and height.   <strong><em>boolean|nil<\/em><\/strong>   <em>bCenter<\/em>   Center the result; defaults to false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"5054f899-f24f-82fa-c501-d8f8f7567c63\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table|nil<\/em><\/strong>   <em>tRet<\/em>   The fitted rectangle, or nil for a degenerate inner rectangle.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f034111c-6ff1-3a33-9cce-594e28408924\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local tFit = math.geometry.fitrect({x=0, y=0, width=100, height=50}, {width=10, height=10}, true);\n        print(tFit.x, tFit.width); -- 25 50<\/code><\/pre><\/div><\/div><\/div>`,
                            "subtable": null
                        },
                        "rectcontains": {
                            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether two rectangles overlap with positive area. Edge/corner contact and zero-area rectangles return false. This legacy name means overlap, not full containment; use rectcontainsfully for containment.<\/div><\/div><div class=\"custom-section\"><div id=\"b58df5e5-a841-bc7f-c18f-efd04c346c1f\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tMe<\/em>   First rectangle with x, y, width, and height.   <strong><em>table<\/em><\/strong>   <em>tOther<\/em>   Second rectangle with x, y, width, and height.<br><\/div><\/div><div class=\"custom-section\"><div id=\"6a6e8cda-e5b4-9a4b-88dc-a36c6fea4836\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bRet<\/em>   Whether there is positive-area overlap.<br><\/div><\/div><div class=\"custom-section\"><div id=\"644c93d3-d3ab-d748-e58e-35eca91c45ad\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">print(math.geometry.rectcontains({x=0,y=0,width=10,height=10}, {x=5,y=5,width=10,height=10})); -- true<\/code><\/pre><\/div><\/div><\/div>`,
                            "subtable": null

                        "rectcontainsfully": {
