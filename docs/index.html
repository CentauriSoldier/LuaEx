<html lang="en">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
            :root {
        --base-font-size: 16px;
        --page: #101824;
        --surface: #182435;
        --surface-raised: #203047;
        --border: #30445f;
        --text: #e4edf7;
        --muted: #9cabc1;
        --accent: #79baff;
        --accent-soft: #223e5d;
        --navbackground: #182435;
        --navlink: #bcd9fa;
        --navlinkhover: #ffffff;
        --sectiontitle: #dcecff;
        --sectiontitlebg: #203047;
        --sectioncontent: #e4edf7;
        --breadcrumb-background: #141f2e;
        --button-background: #2b4562;
        --button-border: #4b6c90;
        --button-hover: #365c85;
        --button-text: #edf6ff;
        --header-end: #1c2435;
        --header-start: #172b44;
        --link-hover: #b9ddff;
        --selected-border: #5487b6;
        --selected-text: #ffffff;
    }

    /* Page shell and compact project identity. */
    * { box-sizing: border-box; }
    html { font-size: var(--base-font-size); }
    body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        line-height: 1.65;
    }
    a { color: var(--accent); }
    a:hover { color: var(--link-hover); }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    #titlebg {
        padding: 24px 36px 22px;
        background: linear-gradient(120deg, var(--header-start), var(--header-end));
        border-bottom: 1px solid var(--border);
    }
    .dox-brand { color: var(--accent); font-weight: 800; letter-spacing: .14em; font-size: .85rem; }
    .dox-brand span { margin-left: 12px; color: var(--muted); font-size: .7rem; font-weight: 600; }
    #title { font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 700; margin: 8px 0 0; letter-spacing: -.025em; }
    .dox-subtitle { margin: 3px 0 0; color: var(--muted); font-size: .85rem; }

    /* Breadcrumbs and selected items show the current location without relying on color alone. */
    #DOX_breadcrumb-wrapper { padding: 13px 36px; background: var(--breadcrumb-background); border-bottom: 1px solid var(--border); }
    #DOX_breadcrumb { margin: 0; display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; font-size: .9rem; }
    .breadcrumb-item + .breadcrumb-item::before { content: "/"; color: var(--muted); padding-right: 8px; float: none; }
    .breadcrumb-item.active { color: var(--text); font-weight: 700; }
    .breadcrumb a { text-decoration: none; }
    .dox-workspace { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 185px); }
    #DOX_navmenu_wrapper { background: var(--surface); padding: 26px 18px; border-right: 1px solid var(--border); }
    #DOX_navheading { font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 0 12px; margin: 0 0 14px; overflow-wrap: anywhere; }
    #DOX_navmenu { margin: 0; padding: 0; list-style: none; gap: 5px; }
    #DOX_navmenu .nav-link { display: block; color: var(--navlink); padding: 11px 14px; border: 1px solid transparent; border-radius: 8px; text-decoration: none; overflow-wrap: anywhere; }
    #DOX_navmenu .nav-link:hover { background: var(--surface-raised); color: var(--navlinkhover); border-color: var(--border); }
    #DOX_navmenu .nav-link.active { background: var(--accent-soft); border-color: var(--selected-border); color: var(--selected-text); font-weight: 700; box-shadow: inset 3px 0 var(--accent); }
    #DOX_navmenu .dox-up { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }

    /* Content cards separate documentation sections while keeping examples readable. */
    #DOX_content_wrapper { padding: 28px 36px 60px; min-width: 0; }
    .dox-topic-header { margin: 0 auto 24px; max-width: 1050px; }
    #DOX_location { color: var(--muted); font-size: .8rem; margin: 0 0 4px; overflow-wrap: anywhere; }
    #DOX_topic { font-size: 1.75rem; letter-spacing: -.025em; margin: 0; overflow-wrap: anywhere; }
    #DOX_content { max-width: 1050px; margin: 0 auto; }
    #DOX_content > .container-fluid { padding: 0; }
    .custom-section { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 18px; background: var(--surface); overflow: hidden; box-shadow: 0 5px 18px #0002; }
    .section-title { padding: 12px 20px; background: var(--sectiontitlebg); color: var(--sectiontitle); font-size: .85rem; font-weight: 700; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .section-content { color: var(--sectioncontent); padding: 20px; overflow-wrap: anywhere; }
    .section-content > :last-child { margin-bottom: 0; }
    .dox-empty { padding: 28px; border: 1px dashed var(--border); border-radius: 12px; color: var(--muted); }
    .DOX_intro { color: var(--text); }
    .DOX_intro .p-5 { padding: 28px !important; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
    .DOX_intro h1 { font-size: 1.6rem; }
    .DOX_intro .lead { font-size: 1rem; color: var(--muted); }
    pre { white-space: pre-wrap !important; overflow-wrap: anywhere; border-radius: 8px; font-size: .9rem; }
    .copy-to-clipboard-button { background: var(--button-background); color: var(--button-text); border: 1px solid var(--button-border); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: .8rem; }
    .copy-to-clipboard-button:hover { background: var(--button-hover); }
    .section-content table { color: var(--text); --bs-table-bg: transparent; --bs-table-color: var(--text); --bs-table-border-color: var(--border); --bs-table-striped-color: var(--text); }

    /* Narrow screens retain both navigation and content without horizontal page overflow. */
    @media (max-width: 760px) {
        #titlebg, #DOX_breadcrumb-wrapper { padding-left: 20px; padding-right: 20px; }
        .dox-workspace { grid-template-columns: 1fr; }
        #DOX_navmenu_wrapper { border-right: 0; border-bottom: 1px solid var(--border); padding: 18px; }
        #DOX_navmenu { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
        #DOX_content_wrapper { padding: 24px 18px 40px; }
        .section-content { padding: 16px; }
    }

    <script>
        const userData = {
    "CoG": {
        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <pre>\n  <h1 class=\"text-center m-0 p-0\">\n    <span style=\"color: #FF6F61;\"> ██████╗  ██████╗   ██████╗<\/span>\n    <span style=\"color: #FFAB00;\">██╔════╝ ██╔═══██╗ ██╔════╝<\/span>\n    <span style=\"color: #00C6FF;\"> ██║      ██║   ██║ ██║  ███╗<\/span>\n    <span style=\"color: #FF6F61;\"> ██║      ██║   ██║ ██║   ██║<\/span>\n    <span style=\"color: #FFAB00;\"> ╚██████╗ ╚██████╔╝ ╚██████╔╝<\/span>\n    <span style=\"color: #00C6FF;\"> ╚═════╝  ╚═════╝   ╚═════╝<\/span>\n    <span style=\"color: #FF885B;\">( () |) [-   () /=   (_, /\\ |\\/| | |\\| (_, <\/span>\n  <\/h1>\n<\/pre>\n<p><strong>CoG (Code of Gaming)<\/strong> is a versatile development framework designed to streamline and enhance the game development process. Built on top of LuaEx, CoG leverages its powerful features to offer a comprehensive suite of components tailored for game creation. This framework includes:<\/p>\n<ul>\n    <li><strong>RNG<\/strong>: A robust pseudo random number generator system that can roll dice and percentages, and, obvioulsy, generate random numbers.<\/li>\n    <li><strong>TagSystem<\/strong>: A flexible system for managing string tags on objects, allowing for easy categorization and retrieval.<\/li>\n    <li><strong>Pool<\/strong>: A dynamic system for tracking various attributes such as magic, stamina, and other vital statistics. It includes features such as auto-calulations and optional reservation.<\/li>\n    <li><strong>Experience Tracking System<\/strong>: A customizable solution for tracking actor progression and performing complex calculations related to leveling and experience.<\/li>\n    <li><strong>Item System<\/strong>: A modular system for managing items, including components such as BaseItem, ItemSlot, Inventory, and ItemStash. This system facilitates item creation, container and equipment management, allowing for flexible item handling and organization.<\/li>\n    <li><strong>Affix System<\/strong>: A distinct system, taking advantage of LuaEx's event system, designed for applying prefixes and suffixes to items, monsters, and other game elements, enabling customization and enhancement through various affix combinations.<\/li>\n    <li><strong>Weighted A-Star Pathfinding<\/strong>: An advanced pathfinding algorithm that considers both actor and terrain factors for efficient and realistic navigation.<\/li>\n    <li><strong>Config File<\/strong>: A built-in configuration file that can be tailored per project to meet specific needs and adjust class behaviors.<\/li>\n    <li><strong>Graphics Scaling Tool<\/strong>: A utility for scaling UI objects to fit the maximum screen size while maintaining their geometric proportions and relative positions.<\/li>\n    <li><strong>Mod System<\/strong>: Permits safe, external code loading for use in incorporating user-created mods into your game.<\/li>\n    <tr>\n    <li><strong>Blueprint System<\/strong>: Facilitates the creation of items using facory methods. Used for loading and incorporating mod data.<\/li>\n    <tr>\n    <li><strong>And much more...<\/strong><\/li>    \n<\/ul>\n\n<p>CoG is designed to be a flexible and powerful framework, offering essential tools and systems that cater to various aspects of game development.<\/p><\/div><\/div><\/div>`,
        "subtable": {
        "AStar": {
            "value": ``,
            "subtable": {
            "AStar": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Owns the available aspect names and named maps. Exposes LayerConfig and Path factories for configuring layers and planning group movement.<\/div><\/div><\/div>`,
                "subtable": {
                "AStar": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates a system with zero or more unique aspect names. Names must be Lua identifiers and are stored in uppercase and sorted alphabetically. Duplicates are rejected without regard to case.<\/div><\/div><div class=\"custom-section\"><div id=\"8a3ddac3-054c-d43a-0bd9-d47e5170889e\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>...<\/em>   The available aspect names.<br><\/div><\/div><div class=\"custom-section\"><div id=\"300261f9-04d3-1995-3264-6402143cb28b\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStar<\/em><\/strong>   <em>oSystem<\/em>   The new system.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9b8de8df-60f0-3083-ba17-d2f00a0932e4\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\", \"rock\");\n    assert(oSystem.aspectNames.MUD == \"MUD\" and #oSystem.aspectNames == 2);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "Constants": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Read-only static geometry and entry-cost constants. MAP_TYPE_HEX_FLAT, MAP_TYPE_HEX_POINTED, MAP_TYPE_SQUARE, MAP_TYPE_TRIANGLE_FLAT and MAP_TYPE_TRIANGLE_POINTED select geometry. NODE_ENTRY_COST_BASE is 10, MIN is 1, MAX_RATE is 12 and MAX is 120. Existing ASTAR_ global names retain identical values. Costs may be fractional.<\/div><\/div><div class=\"custom-section\"><div id=\"10c6037b-49a8-d166-17ba-229dbbe0c321\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    assert(AStar.MAP_TYPE_SQUARE == ASTAR_MAP_TYPE_SQUARE);\n    assert(AStar.NODE_ENTRY_COST_MAX == 120);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "aspectNames": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   A read-only, case-insensitive lookup of this system's uppercase aspect names. Length gives the aspect count; pairs visits the names in alphabetically sorted numeric order. No aspects may be added after construction.<\/div><\/div><div class=\"custom-section\"><div id=\"abdf6cbb-a612-9c16-8fa0-b5bc0d1910b5\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tNames<\/em>   The aspect-name view.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7b3716bf-a496-1e2f-db8e-3eb68596b45e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"rock\", \"mud\");\n    assert(oSystem.aspectNames.mud == \"MUD\" and #oSystem.aspectNames == 2);\n    local tNames = {};\n    for nIndex, sName in pairs(oSystem.aspectNames) do\n        tNames[nIndex] = sName;\n    end\n    assert(tNames[1] == \"MUD\" and tNames[2] == \"ROCK\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getMap": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a map by its exact, case-sensitive name.<\/div><\/div><div class=\"custom-section\"><div id=\"4ff89c4c-238b-9ca4-8db0-5f447b97c555\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sName<\/em>   A nonblank map name.<br><\/div><\/div><div class=\"custom-section\"><div id=\"29d3a3bc-0292-c8e6-2790-f8d32f6ff054\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarMap|nil<\/em><\/strong>   <em>oMap<\/em>   The map, or nil when absent.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bcc679fb-2b54-8646-f9d8-4a26e12b249d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    assert(oSystem.getMap(\"world\") == oMap and oSystem.getMap(\"WORLD\") == nil);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getMaps": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a read-only view of maps indexed by their exact names.<\/div><\/div><div class=\"custom-section\"><div id=\"c7f008c2-91ec-8583-a443-eb733916c69a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tMaps<\/em>   The map view.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b61e1144-8028-dc1d-b347-3e7e04aa8841\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    assert(oSystem.getMaps().world == oMap);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getNode": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a node by exact map name, case-insensitive layer name and native coordinates.<\/div><\/div><div class=\"custom-section\"><div id=\"74b73ca0-4c60-300f-4dc7-5387065e8903\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sMap<\/em>   A nonblank map name.   <strong><em>string<\/em><\/strong>   <em>sLayer<\/em>   A nonblank layer name.   <strong><em>number<\/em><\/strong>   <em>nX<\/em>   The integer x coordinate.   <strong><em>number<\/em><\/strong>   <em>nY<\/em>   The integer y coordinate.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e274cd31-017c-33f6-974b-b0a57780a7b0\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode|nil<\/em><\/strong>   <em>oNode<\/em>   The node, or nil when the map, layer or position is absent.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1c1a7213-efe2-b80e-e96e-c6abe7fe140e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    assert(oSystem.getNode(\"world\", \"GROUND\", 1, 1) == oMap.getNode(\"ground\", 1, 1));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "newMap": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates and registers a named map. Existing exact names return nil without replacing the map. Layer configurations must be nonempty, ordered, uniquely named and use this system's aspects. Native origins default to 1. Hex maps require explicit staggerAxis and staggerIndex settings for neighbor generation, corresponding to Tiled's staggeraxis and staggerindex values. This method does not parse Tiled files.<\/div><\/div><div class=\"custom-section\"><div id=\"a46c7f97-a7b0-637b-4cf6-b53ab333dcaa\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sName<\/em>   A nonblank, case-sensitive map name.   <strong><em>number<\/em><\/strong>   <em>nType<\/em>   A supported map geometry constant.   <strong><em>table<\/em><\/strong>   <em>tLayers<\/em>   An ordered list of AStar.LayerConfig objects.   <strong><em>number<\/em><\/strong>   <em>nWidth<\/em>   The positive integer grid width.   <strong><em>number<\/em><\/strong>   <em>nHeight<\/em>   The positive integer grid height.   <strong><em>table|nil<\/em><\/strong>   <em>tLayout<\/em>   Optional originX, originY, staggerAxis and staggerIndex.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c4cb2aa7-a62b-1dd2-f1d7-a46f99cbda67\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarMap|nil<\/em><\/strong>   <em>oMap<\/em>   The new map, or nil when its name already exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"995e45d9-7e4d-e686-d322-8803028acefe\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    assert(oMap.getWidth() == 3 and oMap.getHeight() == 2);\n    assert(oSystem.newMap(\"world\") == nil); --existing exact name is preserved<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            },
            "AStarAspect": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   A named aspect belonging to a node. Its Protean impactor represents the aspect's intensity from 0 to 1 and automatically recalculates when its values change.<\/div><\/div><\/div>`,
                "subtable": {
                "AStarAspect": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates an aspect with an automatically calculated impactor. The default intensity is 1 (100%), bounded from 0 to 1.<\/div><\/div><div class=\"custom-section\"><div id=\"70044955-17ef-5593-7eb4-5c16a4fe4ae9\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sName<\/em>   The aspect name; must contain a non-whitespace character.   <strong><em>AStarNode<\/em><\/strong>   <em>oAStarNode<\/em>   The node that owns this aspect.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f2c58dcb-04c9-25c0-fa20-e93a2ae8e317\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarAspect<\/em><\/strong>   <em>oAspect<\/em>   The new aspect.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e56d2537-774e-1fb2-3c51-d1bdec5088c6\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oAspect = oNode.getAspect(\"mud\");\n    assert(type(oAspect) == \"AStarAspect\"); --created by the node from its layer configuration<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getImpactor": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the aspect's impactor. Its final value is bounded from 0 to 1; the returned Protean can be modified.<\/div><\/div><div class=\"custom-section\"><div id=\"d3435b45-195e-f2ff-3568-c0fa8cca2363\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Protean<\/em><\/strong>   <em>oImpactor<\/em>   The aspect's impactor.<br><\/div><\/div><div class=\"custom-section\"><div id=\"321cd673-92b7-e62e-e10c-5c27bd00a70f\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oAspect = oNode.getAspect(\"mud\");\n    local oImpactor = oAspect.getImpactor();\n    oImpactor.setValue(0.5);\n    assert(oNode.getAspectImpact(\"mud\") == 0.5);<\/code><\/pre><\/div><\/div><\/div>`,

                },

                },
                "addPort": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adds an outgoing port connection. By default, also updates the reverse connection. A one-way operation leaves any existing reverse connection unchanged.<\/div><\/div><div class=\"custom-section\"><div id=\"2ee9dfbf-31f2-e625-2ff8-98f61a739ba5\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The connected node.   <strong><em>boolean|nil<\/em><\/strong>   <em>bTwoWay<\/em>   Whether to update both directions; defaults to true. False updates only this node's outgoing connection.   <strong><em>function|nil<\/em><\/strong>   <em>fPassageRule<\/em>   An optional predicate (rover, sourceNode, destinationNode) returning boolean. Applied to each direction added; omitted rules preserve existing rules. Keep predicates side-effect-free for route planning.<br><\/div><\/div><div class=\"custom-section\"><div id=\"60d5f3b4-ed58-7af8-d5f1-9c5210d0909a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   This node, for chaining.<br><\/div><\/div><div class=\"custom-section\"><div id=\"818d5c83-ed84-375c-fcb5-9a5b93990144\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oExit = oMap.getNode(\"ground\", 3, 2);\n    oNode.addPort(oExit, false);\n    assert(oNode.hasPort(oExit) and not oExit.hasPort(oNode));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "canTraverseTo": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether a physical edge or an allowed outgoing port connects this node to the destination for every supplied rover. A physical edge permits traversal independently of any parallel port restriction. Destination passability and movement budgets are checked separately by planning and movement.<\/div><\/div><div class=\"custom-section\"><div id=\"bdeb7405-ad62-9164-3558-1c84204ab1f3\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The destination.   <strong><em>AStarRover|table<\/em><\/strong>   <em>...<\/em>   One or more rovers, individually or in an ordered table.<br><\/div><\/div><div class=\"custom-section\"><div id=\"800a109e-c609-9923-c439-c5738ed7dad1\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bConnected<\/em>   Whether a permitted connection exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b090ea60-479f-618f-63f1-1bba3aa8ed8b\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    assert(oNode.canTraverseTo(oMap.getNode(\"ground\", 2, 1), oRover));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "canUsePort": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks outgoing port existence and passage permission for every supplied rover, independently of node passability, occupancy, movement points and the rovers' current positions. A missing port returns false; a port without a rule allows passage.<\/div><\/div><div class=\"custom-section\"><div id=\"f92f9c18-3f5d-439a-9753-03d565435f2d\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The destination.   <strong><em>AStarRover|table<\/em><\/strong>   <em>...<\/em>   One or more rovers, individually or in an ordered table.<br><\/div><\/div><div class=\"custom-section\"><div id=\"88fa0e82-e174-271b-147d-4c7114ef7d63\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bAllowed<\/em>   Whether every rover may use this port.<br><\/div><\/div><div class=\"custom-section\"><div id=\"df5ec742-f5e1-f458-e7eb-76a05116e20a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oExit = oMap.getNode(\"ground\", 3, 2);\n    oNode.addPort(oExit, false);\n    assert(oNode.canUsePort(oExit, oNode.createRover()));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "containsRover": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether the supplied rover occupies this node.<\/div><\/div><div class=\"custom-section\"><div id=\"ec70e610-98eb-86a8-1c24-ed7471f595ef\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>oRover<\/em>   The rover to check.<br><\/div><\/div><div class=\"custom-section\"><div id=\"3f613d53-20f3-4b3c-585f-d5f524bb05c0\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bContains<\/em>   Whether the rover is registered on this node.<br><\/div><\/div><div class=\"custom-section\"><div id=\"af5f358c-d4bc-b96a-5bd1-7f7e364b15d8\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    assert(oNode.containsRover(oRover));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "createRover": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates a rover on this node and registers it as an occupant.<\/div><\/div><div class=\"custom-section\"><div id=\"8b347431-74e9-7f0c-be55-59878ec39528\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>boolean|nil<\/em><\/strong>   <em>bRetainsPointsOverCycle<\/em>   Whether unused points carry into the next cycle; defaults to true.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1505b207-092d-2ca6-b3e8-f969dd1d8f8a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>oRover<\/em>   The new rover.<br><\/div><\/div><div class=\"custom-section\"><div id=\"11a1d043-50eb-97d9-c041-6e0c022652e2\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover(false);\n    assert(oRover.getOwner() == oNode and not oRover.getRetainsPointsOverCycle());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getAspect": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets an aspect using a case-insensitive name lookup.<\/div><\/div><div class=\"custom-section\"><div id=\"a89b842e-a090-5bb0-213e-42a7a755b721\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sAspect<\/em>   A nonblank aspect name.<br><\/div><\/div><div class=\"custom-section\"><div id=\"971acca6-6ea1-b586-7c61-d40aa5442bcf\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarAspect|nil<\/em><\/strong>   <em>oAspect<\/em>   The aspect, or nil when absent.<br><\/div><\/div><div class=\"custom-section\"><div id=\"0dbfd876-0f1e-f9f9-9440-a38628e1619e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    assert(oNode.getAspect(\"mud\").getName() == \"MUD\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getAspectImpact": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets an aspect's calculated intensity using a case-insensitive name lookup.<\/div><\/div><div class=\"custom-section\"><div id=\"9e1bc4b9-134c-909c-9f96-70b6e841f987\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sAspect<\/em>   A nonblank aspect name.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2c955d32-08d9-9307-e9b5-7eca03216810\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nImpact<\/em>   The final intensity from 0 to 1, or nil when the aspect is absent.<br><\/div><\/div><div class=\"custom-section\"><div id=\"20421f80-5fc6-bafc-196d-9ab0fad24dbc\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    assert(oNode.getAspectImpact(\"mud\") == 1);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getAspects": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a read-only view of the node's ordered aspects. The aspect objects and their Protean impactors remain modifiable through their methods.<\/div><\/div><div class=\"custom-section\"><div id=\"0b4251eb-9c0c-3b1f-a43d-f13ba52a357d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tAspects<\/em>   The ordered aspect objects.<br><\/div><\/div><div class=\"custom-section\"><div id=\"65ad1de5-71e7-1e18-c38a-db833918f684\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    assert(#oNode.getAspects() == 1);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getEntryCost": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Calculates the entry cost for one rover. Each active aspect contributes base cost times its own intensity times the difference between rover aversion and affinity. Contributions are added to the base cost and the result is clamped to the configured cost bounds. Aspects do not compound on each other. This calculation does not check passability or spend movement points.<\/div><\/div><div class=\"custom-section\"><div id=\"26b11859-f682-fe04-841d-c17169070510\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>oRover<\/em>   The rover whose affinities and aversions determine the cost.<br><\/div><\/div><div class=\"custom-section\"><div id=\"144fd551-7776-33ba-f95b-c57b2422463a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nCost<\/em>   The bounded entry cost for this rover.<br><\/div><\/div><div class=\"custom-section\"><div id=\"60015802-4c4f-e63f-27b9-2d2ac8bc6f75\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    assert(oNode.getEntryCost(oRover) == 10);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getEntryCosts": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Calculates a separate entry cost for each supplied rover. Costs are indexed by rover and are not summed together. Does not check passability or spend movement points. No rovers produces an empty table.<\/div><\/div><div class=\"custom-section\"><div id=\"50fee670-1670-20df-1009-4ab9117bb51e\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover|table<\/em><\/strong>   <em>...<\/em>   Individual rovers, or one ordered table of rovers.<br><\/div><\/div><div class=\"custom-section\"><div id=\"a0b37508-dcf5-9c83-155c-ea7a98a8b406\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tCosts<\/em>   The entry costs indexed by rover object.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e6b79c19-8600-f188-463c-1ed7d803a996\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oFirst = oNode.createRover();\n    local oSecond = oNode.createRover();\n    local tCosts = oNode.getEntryCosts({oFirst, oSecond});\n    assert(tCosts[oFirst] == 10 and tCosts[oSecond] == 10);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getNeighbors": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gathers edge-sharing neighbors and destinations of outgoing ports without duplicates or this node itself. Does not filter by passability or movement points. Hex maps require explicit staggerAxis and staggerIndex settings. Square maps use four edge-sharing neighbors. Triangular maps use three edge-sharing neighbors: even native x+y points up for flat triangles or left for pointed triangles; odd parity reverses the direction.<\/div><\/div><div class=\"custom-section\"><div id=\"0e37b677-dcfb-a6e6-4634-a2e50b8d5bc4\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>boolean|nil<\/em><\/strong>   <em>bPhysicalOnly<\/em>   True excludes outgoing ports; defaults to false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7e1e5201-675c-4770-f9dd-9ba85e805d3d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tNeighbors<\/em>   A new ordered list of neighboring nodes. Physical neighbors precede ports; port order is unspecified.<br><\/div><\/div><div class=\"custom-section\"><div id=\"093efec4-2bd8-b230-6d3f-742a661736b6\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    oNode.addPort(oMap.getNode(\"ground\", 3, 2), false);\n    assert(#oNode.getNeighbors() == 3 and #oNode.getNeighbors(true) == 2);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getOwner": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the layer that owns this node.<\/div><\/div><div class=\"custom-section\"><div id=\"ea1443a6-c1a8-d2b2-d3e7-9f1f1bd1f074\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarLayer<\/em><\/strong>   <em>oLayer<\/em>   The owning layer.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f5a71d56-40a5-9fcb-7179-143f2626da36\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    assert(oNode.getOwner() == oMap.getLayer(\"ground\"));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getPassable": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the node's general passability flag without checking any rover's restrictions.<\/div><\/div><div class=\"custom-section\"><div id=\"eb2381b6-b7e4-eaa9-0ec0-d0c9d51a53bc\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bPassable<\/em>   The general passability flag.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ff76e18e-ab52-16f8-65d9-95933455c89b\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    oNode.setPassable(false);\n    assert(not oNode.getPassable());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getPortPassageRule": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the rule for this node's outgoing port. Node occupancy is independent of port passage.<\/div><\/div><div class=\"custom-section\"><div id=\"4cea0f04-64dd-2063-a90d-f03ac59b7532\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The port destination.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b7658a92-438a-de90-9fcc-cbd9a72e797a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>function|nil<\/em><\/strong>   <em>fRule<\/em>   The predicate, or nil for an unrestricted or absent port.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ece30bf2-1c53-5b5f-6d36-5c400a089b6e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oExit = oMap.getNode(\"ground\", 3, 2);\n    local fRule = function(oRover) return oRover.isType(\"goblin\"); end;\n    oNode.addPort(oExit, false, fRule);\n    assert(oNode.getPortPassageRule(oExit) == fRule);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getPorts": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a read-only view of this node's outgoing port connections. Keys are destination nodes and values are true. A connection appears here whether it is one-way or two-way.<\/div><\/div><div class=\"custom-section\"><div id=\"881c472b-b637-1fbf-c205-d1b5cb4c8aec\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tPorts<\/em>   The outgoing connections, indexed by destination node.<br><\/div><\/div><div class=\"custom-section\"><div id=\"fe22b249-dc7f-c953-d24a-6a5effb8d52f\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oExit = oMap.getNode(\"ground\", 3, 2);\n    oNode.addPort(oExit, false);\n    assert(oNode.getPorts()[oExit] == true);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getPos": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a new table containing the node's coordinates.<\/div><\/div><div class=\"custom-section\"><div id=\"c25e3d14-8efd-9fc8-034c-d71e4533910b\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tPosition<\/em>   A table with x and y fields.<br><\/div><\/div><div class=\"custom-section\"><div id=\"96c4f9e2-d7b2-9bac-2312-26dcd82c3237\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local tPosition = oNode.getPos();\n    assert(tPosition.x == 1 and tPosition.y == 1);<\/code><\/pre><\/div><\/div><\/div>`,

                "getRovers": {

                "hasAspect": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether this node has an aspect using a case-insensitive name lookup.<\/div><\/div><div class=\"custom-section\"><div id=\"9975d260-204f-636e-b47a-78ac54140a00\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sAspect<\/em>   A nonblank aspect name.<br><\/div><\/div><div class=\"custom-section\"><div id=\"34f12a95-b292-9d7d-c5ec-d57a644dab13\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bHasAspect<\/em>   Whether the aspect exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"62743095-0123-b184-d185-b418a1ad6166\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    assert(oNode.hasAspect(\"mud\") and not oNode.hasAspect(\"snow\"));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "hasPort": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether this node has an outgoing port to the supplied node. Does not require a reverse connection.<\/div><\/div><div class=\"custom-section\"><div id=\"6f2fa2a0-316f-5da8-1422-4ed39d3163bd\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The destination node to check.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4f5af6ce-e5d4-2983-8346-8417cd736630\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bHasPort<\/em>   Whether the outgoing connection exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"a1cf4c1c-1d58-6582-b9e5-6043b9c284b9\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oExit = oMap.getNode(\"ground\", 3, 2);\n    oNode.addPort(oExit, false);\n    assert(oNode.hasPort(oExit));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "hasPorts": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether this node has any outgoing port connections. Incoming-only connections do not count.<\/div><\/div><div class=\"custom-section\"><div id=\"58e2b1fe-2143-5d50-a5f1-93572a4a40b9\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bHasPorts<\/em>   Whether at least one outgoing connection exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"96dbe2a8-5a7d-4d11-47b9-6bb3772c18db\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    assert(not oNode.hasPorts());\n    oNode.addPort(oMap.getNode(\"ground\", 3, 2));\n    assert(oNode.hasPorts());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "hasTwoWayPort": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether both nodes have an outgoing port to each other. Returns false immediately when either node has no outgoing ports.<\/div><\/div><div class=\"custom-section\"><div id=\"44bb4c86-8f7c-a7fe-61e1-e0715bd692ad\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The node to check.<br><\/div><\/div><div class=\"custom-section\"><div id=\"69949632-c6eb-c208-141f-5639a5ed6fd9\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bTwoWay<\/em>   Whether the connection exists in both directions.<br><\/div><\/div><div class=\"custom-section\"><div id=\"78b45a29-bf7e-82fe-34cb-cd723b16764e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oExit = oMap.getNode(\"ground\", 3, 2);\n    oNode.addPort(oExit);\n    assert(oNode.hasTwoWayPort(oExit));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isPassable": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether the node can be entered by every supplied rover. A false general passability flag blocks entry. Otherwise, entry is denied if any rover is forbidden from the layer, abhors an active aspect or a resident rover refuses entry to it. With no rovers supplied, returns the general passability flag. Movement points are not checked here.<\/div><\/div><div class=\"custom-section\"><div id=\"49831601-d43b-88be-5b5e-39cc78ade59a\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover|table<\/em><\/strong>   <em>...<\/em>   Individual rovers, or one table containing the rovers to check.<br><\/div><\/div><div class=\"custom-section\"><div id=\"6a5fbdf5-5f36-6f55-8d49-4c1b8565f948\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bPassable<\/em>   Whether all supplied rovers may enter.<br><\/div><\/div><div class=\"custom-section\"><div id=\"84dd07aa-c310-639a-e497-a4fb1901dc2b\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    assert(oNode.isPassable(oRover));\n    oRover.setAbhors(\"mud\", true);\n    assert(not oNode.isPassable(oRover));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "removePort": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Removes an outgoing port connection. By default, also updates the reverse connection. A one-way operation leaves any existing reverse connection unchanged.<\/div><\/div><div class=\"custom-section\"><div id=\"1680eb42-e2d8-769e-9412-08e389fbba89\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The connected node.   <strong><em>boolean|nil<\/em><\/strong>   <em>bTwoWay<\/em>   Whether to update both directions; defaults to true. False updates only this node's outgoing connection.<br><\/div><\/div><div class=\"custom-section\"><div id=\"a16b2b39-c4a9-32e1-dd28-7f5f7d3557b1\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   This node, for chaining.<br><\/div><\/div><div class=\"custom-section\"><div id=\"439f9bd4-a04e-90c4-0a37-ce42c37a97cf\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oExit = oMap.getNode(\"ground\", 3, 2);\n    oNode.addPort(oExit);\n    oNode.removePort(oExit);\n    assert(not oNode.hasPort(oExit) and not oExit.hasPort(oNode));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setPassable": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets the node's general passability flag. Non-boolean inputs leave the flag unchanged. Rover-specific restrictions are still checked by isPassable when the flag is true.<\/div><\/div><div class=\"custom-section\"><div id=\"b0be157f-7e23-1488-1e5f-cd9eab16d2b2\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bPassable<\/em>   Whether the node is generally passable.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b97d194e-c838-312c-9f34-892adf922a4f\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>nil<\/em><\/strong>   <em>vReturn<\/em>   No return value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bf5b1d3d-19e8-676d-db80-0a43b5c04a1c\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    oNode.setPassable(false);\n    assert(not oNode.isPassable());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setPortPassageRule": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets or clears an existing outgoing port's rule. Does not change node passability. Each predicate receives (rover, sourceNode, destinationNode) and must return boolean. Keep it side-effect-free: planning may evaluate it repeatedly. A two-way update requires both directions to exist and uses the same function in each direction.<\/div><\/div><div class=\"custom-section\"><div id=\"1fd1cef6-9a27-6ed1-1e54-4333b6c1cb91\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The destination.   <strong><em>function|nil<\/em><\/strong>   <em>fRule<\/em>   The predicate; nil clears the restriction.   <strong><em>boolean|nil<\/em><\/strong>   <em>bTwoWay<\/em>   True updates both directions; defaults to false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2f2ee7cd-80fc-e948-7538-55dc6c3939bb\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oSource<\/em>   This node.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9dbe5d9d-8a1b-1706-0ef9-7770023beb62\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem   = AStar();\n    local oMap      = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\")}, 3, 1);\n    local oEntrance = oMap.getNode(\"ground\", 1, 1);\n    local oExit     = oMap.getNode(\"ground\", 3, 1);\n    oEntrance.addPort(oExit);\n    oEntrance.setPortPassageRule(oExit, function(oRover, oSource, oDestination)\n        return oRover.isType(\"goblin\");\n    end, true);\n    local oHuman = oEntrance.createRover();\n    assert(oEntrance.isPassable(oHuman) and not oEntrance.canUsePort(oExit, oHuman));\n    oHuman.addType(\"goblin\");\n    assert(oEntrance.canUsePort(oExit, oHuman));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "togglePassable": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Inverts the node's general passability flag. Does not alter rover-specific restrictions.<\/div><\/div><div class=\"custom-section\"><div id=\"6ee0006f-6dfd-208a-fd0c-210a5a2f1127\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>nil<\/em><\/strong>   <em>vReturn<\/em>   No return value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7b855375-1a72-4de8-01cc-e40b5204479b\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    oNode.togglePassable();\n    assert(not oNode.getPassable());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            },
            "AStarPath": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   A planned group route. Construction searches passable nodes and outgoing ports without moving rovers or changing movement Pools. Costs remain separate per rover; route selection minimizes the largest individual total, then favors the longest prefix affordable by the entire group this turn. Node lists include the start, whose entry cost is not charged. Cycle 0 is the current turn; later cycle numbers describe future turns using each rover's capacity, regeneration and point-retention setting. Previews assume these settings and entry costs remain unchanged. Exact group search retains nondominated individual cost vectors; maps with many competing cost combinations can require substantially more time and memory than a single-rover search.<\/div><\/div><\/div>`,
                "subtable": {
                "AStarPath": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Plans a route for one or more distinct rovers at the start node. Endpoints must belong to the same AStar system. No route produces an empty node list and hasPath false; insufficient movement points do not prevent route construction.<\/div><\/div><div class=\"custom-section\"><div id=\"7ac78d18-72aa-6e20-2291-1cb2d03f6f99\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oStartNode<\/em>   The starting node.   <strong><em>AStarNode<\/em><\/strong>   <em>oEndNode<\/em>   The destination node.   <strong><em>AStarRover|table<\/em><\/strong>   <em>...<\/em>   Individual rovers or one contiguous ordered rover list.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8e342e76-c184-1abb-d7c6-5ad08abd502b\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarPath<\/em><\/strong>   <em>oPath<\/em>   The planned path.<br><\/div><\/div><div class=\"custom-section\"><div id=\"cf5358f8-09b3-539d-7269-91f95ef54d1d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar();\n    local oMap    = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\")}, 3, 1);\n    local oStart  = oMap.getNode(\"ground\", 1, 1);\n    local oRover  = oStart.createRover();\n    oRover.getMovePointPool().set(20, Pool.ASPECT.MAX);\n    oRover.getMovePointPool().set(10, Pool.ASPECT.CYCLE_FLAT);\n    local oPath = AStar.Path(oStart, oMap.getNode(\"ground\", 3, 1), oRover);\n    assert(oPath.hasPath() and oPath.getNodeCount() == 3);\n    assert(oPath.getCycleForNode(3) == 2);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getCost": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the total entry cost captured during route construction for a member rover, excluding the start. Later cost changes and payments do not alter this planned total.<\/div><\/div><div class=\"custom-section\"><div id=\"1613f9e4-e654-a08d-6a21-73b146e12dbd\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>oRover<\/em>   A member of this path.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d0aa4072-fdf1-cd2d-7529-5208e9b479d8\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nCost<\/em>   The rover's cumulative cost; zero when no route exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ab22038c-bceb-f6c5-a831-d27f1ed9b749\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    local oPoints = oRover.getMovePointPool();\n    oPoints.set(100, Pool.ASPECT.MAX);\n    oPoints.setFull();\n    local oPath = AStar.Path(oNode, oMap.getNode(\"ground\", 3, 2), oRover);\n    assert(oPath.getCost(oRover) == 30);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getCostTotal": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the largest individual cumulative cost captured during route construction, used to compare routes. This is not a sum of group members' costs or a group payment.<\/div><\/div><div class=\"custom-section\"><div id=\"8aa38f4d-c7b7-d959-98a4-8d1687b753fe\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nCost<\/em>   The route comparison cost; zero when no route exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"259fc2dc-e372-1fe3-8af3-1e91afb8c734\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    local oPoints = oRover.getMovePointPool();\n    oPoints.set(100, Pool.ASPECT.MAX);\n    oPoints.setFull();\n    local oPath = AStar.Path(oNode, oMap.getNode(\"ground\", 3, 2), oRover);\n    assert(oPath.getCostTotal() == 30);<\/code><\/pre><\/div><\/div><\/div>`,

                "hasPath": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether a passable route was found, independently of movement points.<\/div><\/div><div class=\"custom-section\"><div id=\"3c1c324e-a4d2-8ab8-ede8-ccecfa32f6e3\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bFound<\/em>   Whether the route exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d4acbb1a-1ad0-b723-5401-a8501712bcd1\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    local oPoints = oRover.getMovePointPool();\n    oPoints.set(100, Pool.ASPECT.MAX);\n    oPoints.setFull();\n    local oPath = AStar.Path(oNode, oMap.getNode(\"ground\", 3, 2), oRover);\n    assert(oPath.hasPath());<\/code><\/pre><\/div><\/div><\/div>`,

                "refreshPreview": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Recalculates cycle boundaries from the current path position and live budgets without moving, paying or replanning the route. Useful after cycling rovers or changing movement settings.<\/div><\/div><div class=\"custom-section\"><div id=\"a82c782c-19e3-7605-6cf8-c5bc09eae2bd\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarPath<\/em><\/strong>   <em>oPath<\/em>   This path.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4065a576-20c3-a89b-742d-f6a0d0fc39d0\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    local oPoints = oRover.getMovePointPool();\n    oPoints.set(100, Pool.ASPECT.MAX);\n    oPoints.setFull();\n    local oPath = AStar.Path(oNode, oMap.getNode(\"ground\", 3, 2), oRover);\n    oPoints.set(0);\n    oPoints.set(10, Pool.ASPECT.CYCLE_FLAT);\n    oPath.refreshPreview();\n    assert(oPath.getCycleCount() == 3);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setOnStepCallback": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets the step callback, or clears it for non-function input. Runs once after a successful committed group step and after rover exit, entry and move callbacks. Receives (path, rovers, currentNodeIndex, totalSteps, currentNode, previousNode); totalSteps excludes the start. Installing a callback does not execute the path.<\/div><\/div><div class=\"custom-section\"><div id=\"5a631ab8-670f-0d0d-485c-8ef99e5330f2\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>function|nil<\/em><\/strong>   <em>fFunc<\/em>   The callback.<br><\/div><\/div><div class=\"custom-section\"><div id=\"69509d5c-5c42-c558-19a8-af6deca8bc8c\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarPath<\/em><\/strong>   <em>oPath<\/em>   This path.<br><\/div><\/div><div class=\"custom-section\"><div id=\"3afc0d80-f84d-bb06-e96c-14f433ac43b7\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    local oPoints = oRover.getMovePointPool();\n    oPoints.set(100, Pool.ASPECT.MAX);\n    oPoints.setFull();\n    local oPath = AStar.Path(oNode, oMap.getNode(\"ground\", 3, 2), oRover);\n    local nCalls = 0;\n    oPath.setOnStepCallback(function() nCalls = nCalls + 1; end);\n    assert(oPath.step() and nCalls == 1);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "step": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Advances every member one node along the planned route. Rechecks current positions, traversal permission, destination passability and each budget before changing state. A failed check or completed route returns false with no movement, payment or callbacks. Success moves and charges the entire group, advances the path and refreshes preview before callbacks. Reentrant movement is blocked until notifications finish. Callback errors do not undo success: remaining notifications are attempted and the first error is rethrown.<\/div><\/div><div class=\"custom-section\"><div id=\"5be270fe-a8f4-cde3-6fea-2a59f9595aba\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bMoved<\/em>   Whether the group advanced one node.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bcd60e1e-a2b4-586d-bc4e-f5db4289fd01\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar();\n    local oMap    = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\")}, 2, 1);\n    local oStart  = oMap.getNode(\"ground\", 1, 1);\n    local oRover  = oStart.createRover();\n    oRover.getMovePointPool().set(10, Pool.ASPECT.MAX);\n    oRover.getMovePointPool().setFull();\n    local oPath = AStar.Path(oStart, oMap.getNode(\"ground\", 2, 1), oRover);\n    assert(oPath.step() and oRover.getMovePointPool().get() == 0);\n    assert(not oPath.step()); --already at the destination<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            },
