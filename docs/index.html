                }
                }
            },
            "envrepo": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   The Environment Repository is a module providing a mechanism for managing and retrieving Lua environments.\n      It allows for the registration of multiple environments indexed by string keys,\n      with a default environment set to the global environment. Users can retrieve\n      the default environment, set a new one, and add new environments while\n      preventing overwriting existing ones.<\/div><\/div><div class=\"custom-section\"><div id=\"bfcd617a-8ff6-a811-7c72-a70a67e6a87d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    -- Retrieve the default environment\n    local tDefaultEnv = envrepo.getDefault();\n\n    -- Can also get the default like this\n    local tAlsoDefaultEnv = envrepo._ENV;\n\n    -- Show their equality\n    print(tDefaultEnv == tAlsoDefaultEnv); --> true\n\n    -- Create a new environment table\n    envrepo.restricted = {\n        print = print,\n    };\n\n    -- Store the old env\n    local wOld = envrepo._ENV;\n\n    -- Create and test the new env\n    _ENV = envrepo.restricted;\n    print(\"Hello\"); --> Hello\n    print(math) --> nil\n\n    -- Restore the old env\n    _ENV = wOld;<\/code><\/pre><\/div><\/div><\/div>`,
                "subtable": {
                "Methods": {
                    "value": ``,
                    "subtable": {
                    "getDefault": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns the default environment from the environment repository.\n          This method provides access to the global environment, which is\n          used when no specific environment is specified in functions or\n          classes that utilize this module.<\/div><\/div><div class=\"custom-section\"><div id=\"7b13de1d-c1ea-5322-5e60-21498854c6c3\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>wEnv<\/em>   The default environment is the loading environment of this module <i>(_ENV)<\/i> unless another is set as default.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bdee419a-eba4-e31d-3e2e-f802d4ed8a92\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    --get the default environment using the getDefault method\n    local wDefault = envrepo.getDefault();\n\n    --the default environment can also be accessed using the index, _ENV\n    local wAlsoDefault = envrepo._ENV;\n\n    print(wDefault == wAlsoDefault); --> true<\/code><\/pre><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "getDefaultName": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns the name of the default environment in the environment repository.\n          This method provides a way to retrieve the identifier for the default\n          environment, which can be useful for reference or logging purposes.<\/div><\/div><div class=\"custom-section\"><div id=\"d4c6355b-228a-22bd-3679-7236ffbff7aa\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sEnv<\/em>   The name of the default environment.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "setDefault": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets the default environment for the repository.\n          If the specified environment name corresponds to an existing registered\n          environment, it becomes the new default environment.\n          If the environment does not exist or is invalid, the current default\n          environment remains unchanged.<\/div><\/div><div class=\"custom-section\"><div id=\"fa724845-8228-cb9a-d014-694adfe54f3f\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sEnv<\/em>   The name of the environment to be set as the default.<br><\/div><\/div><div class=\"custom-section\"><div id=\"81afc9fb-4750-079b-0789-3fe0113dfb08\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bSuccess<\/em>   True if the default environment was updated; false otherwise.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    }
                    }
                }
                }
            },
            "eventrix": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <h3>Eventrix Overview<\/h3>\nThe eventrix library is a flexible and modular event handling system designed to function in both local and global contexts. It provides a centralized approach for managing event-based interactions across different parts of a system.\n\n<ul>\n    <li><strong>Local and Global Functionality:<\/strong>\n        <ul>\n            <li>An eventrix can operate at both the global level (shared system-wide) or locally (specific to objects or components).<\/li>\n        <\/ul>\n    <\/li>\n    <li><strong>Event Management:<\/strong>\n        <ul>\n            <li>Manages events through unique identifiers, ensuring that each event is handled appropriately.<\/li>\n            <li>Supports the dynamic firing of events with arguments, allowing flexible interaction between components.<\/li>\n        <\/ul>\n    <\/li>\n    <li><strong>Hooks and Callbacks:<\/strong>\n        <ul>\n            <li>Hooks can be attached to specific events, allowing custom callbacks to execute when the event is fired.<\/li>\n            <li>Hooks are executed in a predetermined order and can exist in different environments, promoting modularity.<\/li>\n        <\/ul>\n    <\/li>\n    <li><strong>Error Handling and Validation:<\/strong>\n        <ul>\n            <li>Built-in validation ensures hooks and events receive valid inputs, with error reporting mechanisms in place.<\/li>\n        <\/ul>\n    <\/li>\n    <li><strong>System-Agnostic Design:<\/strong>\n        <ul>\n            <li>Eventrix is designed to be lightweight and decoupled from specific systems, making it suitable for use in a wide range of applications.<\/li>\n        <\/ul>\n    <\/li>\n<\/ul>\n\n<h3>Event IDs<\/h3>\nAn Event ID (eEventID) is a unique identifier used to distinguish individual events within the eventrix system. It serves as a key that helps organize and manage events, ensuring that specific actions or callbacks are triggered when particular events occur. The Event ID can represent a wide range of occurrences, such as an attack, item use, or environmental change. By assigning unique IDs to each event, the system can effectively register, track, and fire events based on their identifiers, making event handling scalable and organized across different scopes (global or local).\n<br>\nAn event ID must be of type enumitem.<\/div><\/div><\/div>`,
                "subtable": {
                "eventExists": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">           Checks whether an event with the specified ID is currently registered in the event system. This function is useful for determining if an event has been created before attempting to fire or manipulate it.<\/div><\/div><div class=\"custom-section\"><div id=\"acf25eda-827b-fe4f-3cdb-147c9ca66b67\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>enumitem<\/em><\/strong>   <em>eEventID<\/em>   The unique identifier for the event being checked. This ID must match an existing event in the system for the function to return true.<br><\/div><\/div><div class=\"custom-section\"><div id=\"be3dd35e-b930-e376-12e4-16c8676e2002\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>Returns<\/em>   true if the event exists; otherwise, returns false.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "eventrix": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       <h3>Function: eventrix(sEnv)<\/h3>\n    This is the main constructor for the eventrix system. It initializes and configures the event management system based on the provided environment as an entrix can function in different environments.<\/div><\/div><div class=\"custom-section\"><div id=\"5c90c07d-2bca-8378-b3be-342f0112c311\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string|nil<\/em><\/strong>   <em>sEnv<\/em>   The name of the environment in which the event system operates. If provided, it customizes the behavior and scope of the event handling to fit the specific needs of the given environment (e.g., global or local scope). If not provided, the default environment will be used.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "fire": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">           Triggers the execution of all registered hooks associated with the specified event ID. This method invokes each hook in the order they were registered, passing along any provided arguments. It handles the execution context and manages error handling for each hook, ensuring that an error in one hook does not prevent subsequent hooks from executing.<\/div><\/div><div class=\"custom-section\"><div id=\"13ebd267-ced6-9489-ea1a-1337f690e3e9\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>enumitem<\/em><\/strong>   <em>eEventID<\/em>   The unique identifier for the event whose hooks are to be triggered. This ID must correspond to an existing event in the system.   <strong><em>...<\/em><\/strong>   <em>Any<\/em>   additional arguments that should be passed to the hooks when they are executed. These can be of any type and will be forwarded to each registered hook.<br><\/div><\/div><div class=\"custom-section\"><div id=\"81291170-91cb-a4b5-b66f-350b811b290f\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tVals<\/em>   A numerically-indexed table containing the results of each executed hook, where each entry corresponds to the return value of a hook. If an error occurs during the execution of a hook, an entry will contain an error message instead of the hook's return value.\n        <br><b>Note<\/b>: if a function's return value is nil, the value listed in the table for that entry will be the constant, <b>EVENTRIX_NIL<\/b>.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getHookCount": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">           Determines the number of hooks that are currently registered to the specified event. Hooks are functions or callbacks associated with an event that are triggered when the event is fired. The count allows you to know how many hooks are waiting to execute when the event with the given ID is fired.<\/div><\/div><div class=\"custom-section\"><div id=\"3c006ad8-0106-7b54-0bc3-835571e5cfec\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>enumitem<\/em><\/strong>   <em>eEventID<\/em>   The unique identifier for the event. This ID is used to retrieve the count of hooks tied to the event in question.<br><\/div><\/div><div class=\"custom-section\"><div id=\"28f8d859-834c-08d9-1f93-87d754dacc3d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>The<\/em>   number of hooks associated with the specified event.   <strong><em>number<\/em><\/strong>   <em>nHookCount<\/em>   The total number of hooks associated with the event. If the event does not exist, a value of -1 will be returned.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getHookOrdinal": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">           Determines the ordinal number of the given hook, that is, in what fire position the hook exists. This is used primarily for determining to which function a returned error message belongs in the <a href=\"#LuaEx.Libraries.eventrix.fire\">fire<\/a> method's return table. This is designed for security to prevent the <b>fire<\/b> method from needing to expose the hooks. The clinet with access to the hook can get its oridinal and use it for accessing the error message.<\/div><\/div><div class=\"custom-section\"><div id=\"2dbbcd4d-3c9f-dc6b-d7fd-fc86ec08428a\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>enumitem<\/em><\/strong>   <em>eEventID<\/em>   The unique identifier for the event. This ID is used to retrieve the count of hooks tied to the event in question.   <strong><em>function<\/em><\/strong>   <em>fHook<\/em>   The hook function being checked.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e5deef95-bda5-2287-5f8e-1c76fd003b17\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>The<\/em>   number of hooks associated with the specified event.   <strong><em>number<\/em><\/strong>   <em>nHookOrdinal<\/em>   The ordinal value of the hook associated with the event. If the event or hook does not exist, a value of -1 will be returned.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isEventActive": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">           Checks whether the specified event is currently active in the event system. An active event is one that has registered hooks and can be fired. This method allows for validation of event activity before attempting to trigger hooks associated with the event, helping to prevent unnecessary operations.<\/div><\/div><div class=\"custom-section\"><div id=\"c86c6eab-cba5-4f37-4ed3-3d9c1b70b3af\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>enumitem<\/em><\/strong>   <em>eEventID<\/em>   The unique identifier for the event whose activity status is being checked. This ID must correspond to an existing event in the system.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b1a5f99a-e7e1-f27f-420e-0267860a615e\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>Returns<\/em>   \`true\` if the event is active (i.e., it has one or more registered hooks); otherwise, returns \`false\`.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isHookActive": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">           Checks whether a specific hook associated with an event is currently active in the event system. An active hook is one that has been registered to an event and can be triggered when the event is fired. This method allows for validation of a hook's status before attempting to invoke it, ensuring that only active hooks are executed.<\/div><\/div><div class=\"custom-section\"><div id=\"732a9592-a6e5-0a9c-d82c-e01f96518ccd\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>enumitem<\/em><\/strong>   <em>eEventID<\/em>   The unique identifier for the event to which the hook belongs. This ID must correspond to an existing event in the system.   <strong><em>function<\/em><\/strong>   <em>fHook<\/em>   The hook function being checked.<br><\/div><\/div><div class=\"custom-section\"><div id=\"0fddf6dc-f88e-c3e8-ed4d-2cc614698023\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>Returns<\/em>   \`true\` if the specified hook is active; otherwise, returns \`false\`.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "removeEvent": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Removes an event from the eventrix with the given event ID.<\/div><\/div><div class=\"custom-section\"><div id=\"06dcf29b-f7f3-1257-3be0-43bb73e25441\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>enumitem<\/em><\/strong>   <em>eEventID<\/em>   The unique identifier for the event. This ID must correspond to an existing event in the system.<br><\/div><\/div><div class=\"custom-section\"><div id=\"498b1918-59ec-f30f-0aa4-5c5c532f0c91\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>eventrix<\/em><\/strong>   <em>kEventrix<\/em>   The eventrix object.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "removeHook": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Removes a hook from an event.<\/div><\/div><div class=\"custom-section\"><div id=\"f52c65e3-3cac-42f3-01a7-a1708dbdd680\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>enumitem<\/em><\/strong>   <em>eEventID<\/em>   The unique identifier for the event to which the hook belongs. This ID must correspond to an existing event in the system.   <strong><em>function<\/em><\/strong>   <em>fHook<\/em>   The hook to be removed.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d864e1fb-7fa9-d3ca-8f20-69a2243b71be\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>eventrix<\/em><\/strong>   <em>kEventrix<\/em>   The eventrix object.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setEventActive": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets an event active/inactive.<\/div><\/div><div class=\"custom-section\"><div id=\"56f6fa14-a408-93f3-42be-89cb2c2ea910\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>enumitem<\/em><\/strong>   <em>eEventID<\/em>   The unique identifier for the event. This ID must correspond to an existing event in the system.   <strong><em>boolean|nil<\/em><\/strong>   <em>bActive<\/em>   A boolean (or nil) indicating whether to set the event active. If nil, the event will be deactivated.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ba7a4fae-e428-050d-9441-81694d0f69bb\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>eventrix<\/em><\/strong>   <em>kEventrix<\/em>   The eventrix object.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setHookActive": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets an event's hook activate/inactive.<\/div><\/div><div class=\"custom-section\"><div id=\"1c820d15-6356-2d94-08d1-aece5187bfc7\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>enumitem<\/em><\/strong>   <em>eEventID<\/em>   The unique identifier for the event to which the hook belongs. This ID must correspond to an existing event in the system.   <strong><em>function<\/em><\/strong>   <em>fHook<\/em>   The hook function activate/deactivate.   <strong><em>boolean|nil<\/em><\/strong>   <em>bActive<\/em>   A boolean (or nil) indicating whether to set the hook active. If nil, the hook will be deactivated.<br><\/div><\/div><div class=\"custom-section\"><div id=\"619fd875-0146-aa44-55a6-83df5369afdf\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>eventrix<\/em><\/strong>   <em>kEventrix<\/em>   The eventrix object.<br><\/div><\/div><\/div>`,

            },
            "null": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   The immutable null singleton represents an explicitly empty value. Unlike nil,\nit retains table entries and sequence slots. LuaEx publishes the same object as null\nand NULL. Null supports placeholder propagation, empty iteration, cloning and persistence.\nThe sections below document its operators and methods individually.\n<br><strong>Localization warning:<\/strong> the owner has observed unexpected behavior\nwhen localizing null in some environments. Prefer the global null/NULL names. The\nexamples use those names; this warning does not imply that assignment normally copies\nor creates another singleton.<\/div><\/div><div class=\"custom-section\"><div id=\"8597f64d-d321-ef85-8f5e-b337be876c93\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">require(\"LuaEx.init\");\n\nlocal tRecord = {owner = null, description = null};\nassert(tRecord.owner == null);\nassert(rawget(tRecord, \"owner\") ~= nil); -- The field still exists.\n\ntRecord.owner = nil; -- nil removes the field entirely.\nassert(rawget(tRecord, \"owner\") == nil);\nassert(rawequal(NULL, null));<\/code><\/pre><\/div><\/div><\/div>`,
                "subtable": {
                "Arithmetic": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Addition (+), subtraction (-), multiplication (*), division (/), integer division\n(//), modulo (%) and exponentiation (^) return null when Lua dispatches to null's\noperator hook. Unary minus also returns null. These operations propagate emptiness;\nthey do not coerce null to zero or perform numeric calculations. Another object's\noperator hook may take precedence when null is the right operand.<\/div><\/div><div class=\"custom-section\"><div id=\"c956780b-2cdb-1d97-06cd-f8c18c5f681b\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">require(\"LuaEx.init\");\nassert(null + 5 == null and 5 + null == null);\nassert(null - 5 == null and 5 - null == null);\nassert(null * 5 == null and 5 * null == null);\nassert(null / 0 == null and 5 / null == null);\nassert(null // 2 == null and 5 // null == null);\nassert(null % 2 == null and 5 % null == null);\nassert(null ^ 2 == null and 5 ^ null == null);\nassert(-null == null);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "Bitwise": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Bitwise and (&), or (|), exclusive or (~), left shift (<<), right shift (>>)\nand unary bitwise not (~) propagate null when its hook is selected. Lua's logical\nkeywords and/or/not retain their ordinary truthiness behavior.<\/div><\/div><div class=\"custom-section\"><div id=\"e88135ea-1e98-cf43-0e70-ba65e75e3721\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">require(\"LuaEx.init\");\nassert((null & 3) == null and (3 & null) == null);\nassert((null | 3) == null and (3 | null) == null);\nassert((null ~ 3) == null and (3 ~ null) == null);\nassert((null << 1) == null and (3 << null) == null);\nassert((null >> 1) == null and (3 >> null) == null);\nassert((~null) == null);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "Comparisons": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   When null's comparison hooks are selected, null is strictly less than a value\nwhose LuaEx type is neither null nor nil. Less-or-equal returns true when the left\nvalue is null and the right value is non-nil, or both operands have the same LuaEx\ntype. Thus null &lt; null is false, null &lt;= null is true, and comparisons with nil\nare false. Lua implements &gt; and &gt;= by reversing operands. Other objects may supply\ncompeting hooks; these rules do not define a universal ordering for arbitrary objects.<\/div><\/div><div class=\"custom-section\"><div id=\"478d04aa-dd36-df8e-cda9-8bac43a8e531\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">require(\"LuaEx.init\");\nassert(null < 1 and null <= 1);\nassert(null < \"text\" and null < false);\nassert(not (null < null) and null <= null);\nassert(not (null < nil) and not (null <= nil));\nassert(not (nil < null) and not (nil <= null));\nassert(1 > null and 1 >= null);\nassert(not (null > 1) and not (null >= 1));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "Immutability": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Ordinary assignment to any null key raises an error, including assignment to\nexisting method names. Its metatable cannot be replaced through setmetatable.\nRaw writes and debug APIs bypass normal Lua object protection and are outside this\ncontract. getmetatable exposes informational metadata rather than the actual operator table.<\/div><\/div><div class=\"custom-section\"><div id=\"8069720f-48e6-3958-11e5-8e0bf532d07a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">require(\"LuaEx.init\");\nassert(not pcall(function() null.owner = \"Alex\"; end));\nassert(not pcall(function() null.clone = function() end; end));\nassert(not pcall(function() null[1] = 7; end));\nassert(not pcall(setmetatable, null, {}));\nassert(null.owner == null and null.clone() == null);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "Indexing": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Named and other nonnumeric indexing propagates null unless the key names an\nactual method (clone or serialize). Numeric indexing returns nil, including zero,\nnegative and fractional indices. This permits modern ipairs to terminate. A chain\nmay continue through named indices, but cannot continue after a numeric nil result.<\/div><\/div><div class=\"custom-section\"><div id=\"d8bc2a3f-5787-830e-b5f8-83ac142602b6\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">require(\"LuaEx.init\");\nassert(null.owner.address.city == null);\nassert(null[\"missing\"] == null and null[false] == null);\nassert(null[1] == nil and null[0] == nil and null[-1] == nil and null[1.5] == nil);\nassert(type(null.clone) == \"function\" and type(null.serialize) == \"function\");\nassert(rawget(null, \"owner\") == nil); -- Raw access bypasses propagation.<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "Iteration": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   pairs(null) and ipairs(null) produce no entries. Their hooks return a real\nempty iterator. Numeric indexing also returns nil for runtimes that ignore __ipairs.\nNo meaningful fields are stored directly on the singleton; next(null) returns nil.<\/div><\/div><div class=\"custom-section\"><div id=\"fadf8a48-5a14-487d-a4f5-27312930c4e1\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">require(\"LuaEx.init\");\nlocal nCount = 0;\nfor _ in pairs(null) do nCount = nCount + 1; end\nfor _ in ipairs(null) do nCount = nCount + 1; end\nassert(nCount == 0 and next(null) == nil);\n\n-- A containing table still exposes entries whose value is null.\nlocal tFields = {owner = null};\nfor sKey, vValue in pairs(tFields) do\n    assert(sKey == \"owner\" and vValue == null);\nend<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "Truthiness": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Null is truthy because it is a Lua object. Its operators cannot change Lua's\nif, not, and or behavior. Test a value explicitly against null when checking emptiness.<\/div><\/div><div class=\"custom-section\"><div id=\"e87dae42-0cee-e2b2-5562-bd7b103b3271\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">require(\"LuaEx.init\");\nlocal bEntered = false;\nif (null) then bEntered = true; end\nassert(bEntered and not null == false);\nassert((null or \"fallback\") == null); -- or sees a truthy object.\nassert((null and \"next\") == \"next\");\n\nlocal tRecord = {owner = null};\nlocal sOwner = tRecord.owner == null and \"unassigned\" or tRecord.owner;\nassert(sOwner == \"unassigned\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "TypeAndIdentity": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   type(null) returns \"null\", subtype(null) returns \"null\", and type.isnull(null)\nis true. NULL is an alias of the same singleton. Null differs from nil, false, zero\nand ordinary tables. Lua's equality dispatch invokes null's __eq hook for applicable\nobjects; that hook compares their LuaEx type names. Use rawequal for singleton identity.<\/div><\/div><div class=\"custom-section\"><div id=\"b6e8bafd-bb3f-f3d5-7aa3-a3e6de54057a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">require(\"LuaEx.init\");\nassert(type(null) == \"null\" and subtype(null) == \"null\");\nassert(type.isnull(null) and rawequal(null, NULL));\nassert(null ~= nil and null ~= false and null ~= 0 and null ~= {});<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "__call": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Calling null accepts any arguments, ignores them, and returns zero values.\nA single assignment or equality expression adjusts that empty result to nil.\nCalling null does not return null and cannot replace a callback needing a meaningful result.<\/div><\/div><div class=\"custom-section\"><div id=\"8f0e0ec6-47ab-3d95-132a-ae2aaf07d4c9\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">require(\"LuaEx.init\");\nassert(select(\"#\", null()) == 0);\nassert(select(\"#\", null(\"ignored\", 42)) == 0);\nassert(null() == nil);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "__concat": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Concatenation propagates the null object when its hook is selected; it does\nnot produce a string containing \"null\". Call tostring(null) explicitly to produce text.<\/div><\/div><div class=\"custom-section\"><div id=\"aaa71204-a031-4ba2-6cc4-02acdca09191\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">require(\"LuaEx.init\");\nassert((\"owner: \"..null) == null and (null..\" suffix\") == null);\nassert(type(\"owner: \"..null) == \"null\");\nassert(\"owner: \"..tostring(null) == \"owner: null\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "__len": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   #null returns zero. A surrounding sequence containing null has real occupied\nslots, so its length is independent of null's own length. Ordinary Lua rules for\nsequences containing nil holes still apply.<\/div><\/div><div class=\"custom-section\"><div id=\"9dc90478-aff5-967a-26fc-df094197359a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">require(\"LuaEx.init\");\nassert(#null == 0);\nlocal tSlots = {null, null, null};\nassert(#tSlots == 3);\nfor nIndex = 1, #tSlots do assert(tSlots[nIndex] == null); end<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "__tostring": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   tostring(null) returns the string \"null\". This is a textual representation,\nnot a different placeholder object. print(null) uses this representation.<\/div><\/div><div class=\"custom-section\"><div id=\"30399ac6-c6b5-d2b6-719f-9db17db6793e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">require(\"LuaEx.init\");\nassert(tostring(null) == \"null\");\nassert(type(tostring(null)) == \"string\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "clone": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns the same immutable singleton. The __clone hook and global clone(null)\nshare this behavior; no new null instance is allocated. Dot and colon calls are both accepted.<\/div><\/div><div class=\"custom-section\"><div id=\"412d81e9-f5c0-d49c-f48c-44c2a7bf35d5\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>null<\/em><\/strong>   <em>The<\/em>   original singleton.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1ac7f795-185f-74ed-207f-8e70dbccad3a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">require(\"LuaEx.init\");\nassert(rawequal(null.clone(), null));\nassert(rawequal(null:clone(), null));\nassert(rawequal(clone({owner = null}).owner, null));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "serialize": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns the Lua expression string \"null\". The __serialize hook and global\nserialize(null) use the same representation. Deserialization restores the singleton;\nits identity is retained when it occurs inside a larger saved graph. LuaEx must be\ninitialized before evaluating the expression. Dot and colon calls are both accepted.<\/div><\/div><div class=\"custom-section\"><div id=\"3d478e3d-ef77-930d-1426-f44f08aa770a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>The<\/em>   expression \"null\".<br><\/div><\/div><div class=\"custom-section\"><div id=\"3f791991-0b16-a0df-de2b-a6cb4b9816d5\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">require(\"LuaEx.init\");\nassert(null.serialize() == \"null\" and null:serialize() == \"null\");\nassert(rawequal(deserialize(serialize(null)), null));\nlocal tRestored = deserialize(serialize({owner = null, slots = {null, null}}));\nassert(tRestored.owner == null and #tRestored.slots == 2);\nassert(rawequal(tRestored.slots[1], null));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            },
            "serializer": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Serializes LuaEx values as Lua expressions and restores them in the\n    current LuaEx environment. Tables and Lua closures use a graph representation\n    to preserve shared references, table keys, cycles, and captured upvalue cells.\n    Object hooks define saved state; their matching factories restore it. Plain\n    table metatables are omitted. Data is executable Lua and must be trusted.\n    Bytecode requires a compatible Lua runtime. Threads/userdata and cycles through\n    object hooks are rejected explicitly; objects need a staged restoration API\n    before their cyclic private state can be reconstructed safely.<\/div><\/div><\/div>`,
                "subtable": {
                "deserialize": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Evaluates one trusted serialized Lua expression in the current global\n    environment. Accepts current graph saves and earlier LuaEx packed expressions.\n    Malformed expressions and restoration errors raise errors. Also global deserialize.<\/div><\/div><div class=\"custom-section\"><div id=\"f926a2b5-fb4b-8184-d0ee-99c06a9baa1c\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sData<\/em>   Serialized Lua expression.<br><\/div><\/div><div class=\"custom-section\"><div id=\"84218c30-7d7f-458e-49c1-60363c1bc06a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>The<\/em>   restored value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ee3abfba-b80e-e379-b041-9e1658ea672d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local tValue = deserialize(serialize({value = false}));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "loadFunction": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Restores compatible Lua bytecode used by the graph format. Upvalues are\n    assigned separately by restoreGraph. Not a portable function interchange format.<\/div><\/div><div class=\"custom-section\"><div id=\"ee00dac1-d040-eecd-2111-db36b15509a3\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sEncoded<\/em>   Canonical Base64 bytecode.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8673e560-68aa-1cd2-d813-dbe01b90f8f0\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>function<\/em><\/strong>   <em>The<\/em>   restored Lua function.<br><\/div><\/div><div class=\"custom-section\"><div id=\"547c1a14-2e91-8ca6-7e94-fa44ba993f8c\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local fValue = serializer.loadFunction(base64.enc(string.dump(function() return 3; end)));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "registerFactory": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Registers a callable factory's own declaration. name is its stable saved\n    reference; optional types lists the object-state types it restores. An optional\n    restore(state, context) function overrides factory.deserialize for those types.\n    context is an opaque per-restoration ownership token. Factories call\n    this in their defining modules; the serializer contains no built-in factory list.\n    The factory module must be loaded in the restoring process. Identical repeated\n    declarations are harmless; conflicting names, types, or callbacks reject.<\/div><\/div><div class=\"custom-section\"><div id=\"03ded0f8-8e0a-52d4-2d9d-942aa342db44\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>oFactory<\/em>   The callable factory declaring its persistence contract.   <strong><em>table<\/em><\/strong>   <em>tDeclaration<\/em>   The declaration {name, types, restore}.<br><\/div><\/div><div class=\"custom-section\"><div id=\"3e5c3ac5-969a-7b05-f89b-12731fff37d8\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local Factory = setmetatable({deserialize = function(tState) return tState; end}, {__call = function() return {}; end}); serializer.registerFactory(Factory, {name = \"FactoryDoxReference\", types = {\"FactoryDoxState\"}});<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "registerType": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Registers a restoration factory for a named object type. Instances still\n    supply __serialize. With direct=true the hook returns a complete Lua expression\n    instead of state; otherwise factory.deserialize(state) restores each object.\n    Identical repeated registration is harmless; conflicting registration rejects.<\/div><\/div><div class=\"custom-section\"><div id=\"b0142edc-73cd-8b56-5c76-3a0e129e0ec7\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sType<\/em>   The identifier or dotted type name.   <strong><em>table<\/em><\/strong>   <em>oFactory<\/em>   The restoration factory.   <strong><em>boolean<\/em><\/strong>   <em>bDirect<\/em>   Optional; defaults to false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"cdb40134-041d-881c-3917-02ca85363280\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">serializer.registerType(\"RegisteredExample\", {deserialize = function(tState) return tState; end});<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "restoreGraph": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Restores version-one graph data emitted by serialize. Allocates plain\n    tables and functions first, then restores dependencies before object factories\n    validate their state. Plain table metatables are not persisted. Shared upvalue\n    cells are rejoined after their values are restored; _ENV binds to current _G.<\/div><\/div><div class=\"custom-section\"><div id=\"0de154df-a37c-0ad9-cc0b-e3c66fae0f1d\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tGraph<\/em>   The encoded graph description.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e58bea09-1575-79bc-0920-167197e8fa26\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>The<\/em>   graph's root value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"0a1072fa-e085-8485-9ed3-976d96f8d822\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local bValue = serializer.restoreGraph({version = 1, root = {value = false}, nodes = {}});<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "serialize": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Saves a value, including arbitrary binary strings, precise native numbers,\n    graph tables, Lua closures, enums, and objects with __serialize/deserialize.\n    Class persistence remains autogenerated. Nested hook calls join the current\n    graph, preserving repeated object references across hook state boundaries.\n    Cycles through object state fail explicitly rather than producing broken saves.\n    Hook strings are Lua state expressions; hook tables are state values. An\n    ordinary table's custom hook restores its supplied state without a factory.\n    Optional metatable __serialtype selects a registered state type independently\n    of __type. Optional __serialref returns a symbolic path; an identity-matching\n    binding is saved by reference, otherwise the object's state hook is used.\n    Also available globally as serialize.<\/div><\/div><div class=\"custom-section\"><div id=\"6278ad1f-e15e-74ac-20fb-4c4068ae5fc5\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vValue<\/em>   The value to save.<br><\/div><\/div><div class=\"custom-section\"><div id=\"6efbcd98-77a0-092e-0459-29a3b0aaae7d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>A<\/em>   trusted Lua expression that restores the value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8f60bbbf-2c9f-e22d-1396-34d7f7ecc51a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local tSource = {}; tSource.self = tSource; local sSave = serialize(tSource);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "unpackData": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Decodes and evaluates canonical Base64 state from older packed saves.\n    Retained for compatibility with Type.deserialize(serializer.unpackData(...)).<\/div><\/div><div class=\"custom-section\"><div id=\"8fe3eb76-8411-7f17-e87d-24fed5a7423b\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sEncoded<\/em>   The Base64 serialized expression.<br><\/div><\/div><div class=\"custom-section\"><div id=\"5bfe99d2-cb03-2670-aa80-21b9ac1e29a9\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>The<\/em>   restored state value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"eec28a9f-8a28-c7ab-205d-0ecd77fdc5cd\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local vValue = serializer.unpackData(base64.enc(\"false\"));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            },
            "struct": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Fixed-field records built by named factories. Field types are fixed;\n    a null default acquires its type on the first non-null assignment.\n    Read-only records protect field bindings, not the contents of referenced objects.\n    Defaults are copied for each instance; supplied values retain their identity.\n    Instances compare by identity and support pairs, cloning and serialization.<\/div><\/div><div class=\"custom-section\"><div id=\"12ccab7b-b495-7ab2-41ac-e22b66ef5f99\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    require(\"LuaEx.init\");\n\n    -- Define the fields once, then create as many records as needed.\n    local BulletFactory = structfactory(\"DoxBullet\", {\n        speed = 5,\n        damage = 10,\n        caliber = \"9mm\",\n        enabled = false,\n    });\n\n    local oStandard = BulletFactory();\n    local oHeavy = BulletFactory({damage = 25, caliber = \".45\"});\n    oHeavy.speed = 3;\n\n    assert(oStandard.damage == 10);\n    assert(oHeavy.damage == 25 and oHeavy.speed == 3);\n    assert(oHeavy.enabled == false); -- false is a value, not a missing field.\n\n    -- Only declared fields exist, and their types cannot change.\n    assert(not pcall(function() oHeavy.damage = \"high\"; end));\n    assert(not pcall(function() oHeavy.weight = 20; end));\n    assert(not pcall(function() return oHeavy.weight; end));\n\n    local tFields = {};\n    for sKey, vValue in pairs(oHeavy) do\n        tFields[sKey] = vValue;\n    end\n    assert(tFields.caliber == \".45\" and tFields.enabled == false);<\/code><\/pre><\/div><\/div><\/div>`,
                "subtable": {
                "CloningAndOwnership": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Defaults are captured when the factory is defined and independently copied\n    for each instance. Explicit overrides retain their supplied identity. Cloning\n    copies current values and preserves aliases/cycles within the copied record.<\/div><\/div><div class=\"custom-section\"><div id=\"fabf7ead-8fff-03bf-0774-53ef65b5292b\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    require(\"LuaEx.init\");\n\n    local tDefault = {quantity = 1};\n    local InventoryFactory = structfactory(\"DoxInventory\", {stock = tDefault});\n    tDefault.quantity = 99; -- The factory already owns a snapshot of this default.\n\n    local oFirst = InventoryFactory();\n    local oSecond = InventoryFactory();\n    oFirst.stock.quantity = 5;\n    assert(oSecond.stock.quantity == 1);\n\n    local tSupplied = {quantity = 8};\n    local oThird = InventoryFactory({stock = tSupplied});\n    assert(rawequal(oThird.stock, tSupplied));\n\n    local oCopy = clone(oThird);\n    assert(oCopy.stock.quantity == 8 and not rawequal(oCopy.stock, tSupplied));\n    oCopy.stock.quantity = 12;\n    assert(oThird.stock.quantity == 8);\n    assert(rawequal(clone(InventoryFactory), InventoryFactory));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "EnumKeys": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Enum members may be field keys. Use the member itself when constructing,\n    reading and assigning; its name string is a different key.<\/div><\/div><div class=\"custom-section\"><div id=\"bf3201ed-f7b2-45d2-c7a5-01750cf634fe\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    require(\"LuaEx.init\");\n\n    local Stat = enum(\"DoxStructStat\", {\"HEALTH\", \"ARMOR\"}, nil, true);\n    local StatsFactory = structfactory(\"DoxStats\", {\n        [Stat.HEALTH] = 100,\n        [Stat.ARMOR] = 0,\n    });\n\n    local oStats = StatsFactory({[Stat.ARMOR] = 15});\n    oStats[Stat.HEALTH] = 75;\n\n    assert(oStats[Stat.HEALTH] == 75 and oStats[Stat.ARMOR] == 15);\n    assert(not pcall(function() return oStats.HEALTH; end));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "__call": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Defines a factory and returns its default instance. Use structfactory\n    when multiple instances of the same named record are needed.<\/div><\/div><div class=\"custom-section\"><div id=\"49a9622d-892c-ff7e-1838-53e71f92d9c6\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sName<\/em>   Unique non-blank factory name.   <strong><em>table<\/em><\/strong>   <em>tDefaults<\/em>   Nonempty field defaults.   <strong><em>boolean<\/em><\/strong>   <em>bReadOnly<\/em>   Optional; defaults to false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c88e67cc-939f-2095-bf0b-9fe2aa49e1b9\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>struct<\/em><\/strong>   <em>The<\/em>   default record.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c55b6c47-fd86-5080-bb6c-87f9f9593490\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    require(\"LuaEx.init\");\n\n    -- For a single record, define its factory and create its default instance together.\n    local oWindow = struct(\"DoxWindowSize\", {width = 800, height = 600});\n    oWindow.width = 1024;\n    assert(oWindow.width == 1024 and oWindow.height == 600);\n\n    local oCopy = clone(oWindow);\n    oCopy.height = 768;\n    assert(oWindow.height == 600 and oCopy.height == 768);\n\n    -- Names identify factory definitions; use a factory for repeated construction.\n    assert(not pcall(struct, \"DoxWindowSize\", {width = 1, height = 1}));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "deserialize": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Restores a record snapshot. Accepts current factory references and legacy\n    factory names. Chosen null-field types and read-only policy are validated before allocation.<\/div><\/div><div class=\"custom-section\"><div id=\"65d542d6-0a71-8a0c-5e69-4eb2ea7ad239\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tData<\/em>   The snapshot returned by the instance serialization hook.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b23e92bd-d18b-cc5f-4b5b-840f50174034\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>struct<\/em><\/strong>   <em>The<\/em>   restored record.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e77c2a50-2982-3f19-3570-b3ea1d25a4a5\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    require(\"LuaEx.init\");\n\n    local ProfileFactory = structfactory(\"DoxProfile\", {score = 0, owner = null});\n    local oProfile = ProfileFactory({score = 42});\n    oProfile.owner = \"James\"; -- First non-null value binds this field to string.\n    oProfile.owner = null; -- Clearing it does not forget that binding.\n    assert(not pcall(function() oProfile.owner = 123; end));\n\n    -- Global persistence reconstructs the factory dependency and current fields.\n    local sSave = serialize(oProfile);\n    local oRestored = deserialize(sSave);\n    assert(oRestored.score == 42 and oRestored.owner == null);\n    assert(not pcall(function() oRestored.owner = false; end));\n    oRestored.owner = \"Kaeley\";\n    assert(oProfile.owner == null);\n\n    -- Explicit restoration takes a snapshot table, not the serialized string.\n    -- Omit types only for legacy snapshots without historical null-field bindings.\n    local oExplicit = ProfileFactory.deserialize({\n        factory = ProfileFactory,\n        readOnly = false,\n        values = {score = 7, owner = \"Alex\"},\n        types = {score = \"number\", owner = \"string\"},\n    });\n    assert(oExplicit.score == 7 and oExplicit.owner == \"Alex\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            },
            "structfactory": {
                "value": ``,
                "subtable": {
                "__call": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Defines a named fixed-field factory. Keys may be strings or enum members;\n    metadata names are reserved. Defaults are captured independently. A read-only\n    factory cannot have null defaults. Calling the returned factory accepts optional field overrides.<\/div><\/div><div class=\"custom-section\"><div id=\"84a5701f-b8e4-97e6-8b86-d2931a5b4b11\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sName<\/em>   Unique non-blank factory name.   <strong><em>table<\/em><\/strong>   <em>tDefaults<\/em>   Nonempty field defaults.   <strong><em>boolean<\/em><\/strong>   <em>bReadOnly<\/em>   Optional; defaults to false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9766854f-fd99-9196-a2d7-a64df9545e52\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>structfactory<\/em><\/strong>   <em>The<\/em>   record factory.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1817112c-bb5d-8fff-7d56-8e299f44f74f\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    require(\"LuaEx.init\");\n\n    local SettingsFactory = structfactory(\"DoxFrozenSettings\", {\n        enabled = false,\n        options = {volume = 50},\n    }, true);\n    local oSettings = SettingsFactory({enabled = true});\n\n    assert(oSettings.__name == \"DoxFrozenSettings\" and oSettings.__readOnly);\n    assert(not pcall(function() oSettings.enabled = false; end));\n    assert(not pcall(function() oSettings.options = {}; end));\n\n    -- Read-only protects bindings; a referenced table's contents are still mutable.\n    oSettings.options.volume = 25;\n    assert(oSettings.options.volume == 25);\n\n    local oRestored = deserialize(serialize(oSettings));\n    assert(oRestored.enabled and oRestored.options.volume == 25);\n    assert(not pcall(function() oRestored.enabled = false; end));\n    assert(not pcall(structfactory, \"DoxInvalidFrozen\", {owner = null}, true));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "deserialize": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Restores a factory definition. An existing name is reused only when its\n    field names/types and read-only policy agree. Existing defaults remain authoritative.<\/div><\/div><div class=\"custom-section\"><div id=\"f4ea4049-69ba-80bd-189d-baa9bbcf9ada\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tData<\/em>   Factory snapshot with name, constraints and readOnly.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e15a9e0e-72c3-e775-a73a-7635e01afff3\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>structfactory<\/em><\/strong>   <em>The<\/em>   restored or existing factory.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7646789f-712d-4729-945c-5eab5c879a8f\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    require(\"LuaEx.init\");\n\n    -- A definition snapshot can create a factory that does not exist yet.\n    local PointFactory = structfactory.deserialize({\n        name = \"DoxStructPoint\",\n        readOnly = false,\n        constraints = {x = 0, y = 0},\n    });\n    local oPoint = PointFactory({x = 3, y = 4});\n    assert(oPoint.x == 3 and oPoint.y == 4);\n\n    -- A saved existing factory resolves to the same registered factory identity.\n    local RestoredFactory = deserialize(serialize(PointFactory));\n    assert(rawequal(RestoredFactory, PointFactory));\n\n    -- An existing name cannot silently acquire a different field schema.\n    assert(not pcall(structfactory.deserialize, {\n        name = \"DoxStructPoint\",\n        readOnly = false,\n        constraints = {x = \"wrong\", y = 0},\n    }));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            }
            }
        },
        "Libraries%20(external)": {
