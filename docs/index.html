                "isEmpty": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Determines whether the Pool is empty.\n    <br>This is true when the current value is less than or equal to 0.<\/div><\/div><div class=\"custom-section\"><div id=\"f20a4318-399f-a66b-9f18-60fa7d133ea3\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bEmpty<\/em>   True if the Pool is empty, false otherwise.<br><\/div><\/div><div class=\"custom-section\"><div id=\"314a5cf6-5071-d1f4-384b-d4ce244a0fe7\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 0);\n    assert(oPool.isEmpty());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isFull": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Determines whether the Pool is full.\n    <br>This is true when current fills available capacity (maximum minus reserved), independently of low/high status.<\/div><\/div><div class=\"custom-section\"><div id=\"e3e23c5c-e56e-50fe-98fb-4e4f5516c6f7\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bFull<\/em>   True if the Pool is full, false otherwise.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bc1a6c47-6173-083f-ea67-c72c2acc85e7\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 80);\n    oPool.set(20, Pool.ASPECT.RESERVED_FLAT);\n    assert(oPool.isFull()); --80 fills the available capacity<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isHigh": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Determines whether current reaches the configurable high marker times total maximum. Reservations do not count toward this threshold.<\/div><\/div><div class=\"custom-section\"><div id=\"43e5e2c2-9876-5501-e0b8-980936ebdff6\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bHigh<\/em>   Whether the Pool is high.<br><\/div><\/div><div class=\"custom-section\"><div id=\"cbb2c215-0520-6e51-0efb-156b0ef63160\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 80);\n    oPool.setHighMarker(0.8);\n    assert(oPool.isHigh());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isLow": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Determines whether the Pool is low.\n    <br>This is true when a nonempty Pool has a status value at or below maximum times the low marker.<\/div><\/div><div class=\"custom-section\"><div id=\"934890e7-94e9-577d-4d57-7bdba2cf43b6\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bLow<\/em>   True if the Pool is low, false otherwise.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e84c047d-1060-da6e-a3ba-6a6d5601ae95\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 20);\n    assert(oPool.isLow()); --default low marker is 30% of total maximum<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "set": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets a writable aspect or modifier. CURRENT is clamped to available capacity; invalid capacity or reservation changes are rejected without changing the prior settings.<\/div><\/div><div class=\"custom-section\"><div id=\"101cb7d5-b1ba-d912-2bd3-9f51742ef21f\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nValue<\/em>   The value to which the item should be set.   <strong><em>Pool.ASPECT|nil<\/em><\/strong>   <em>eAspect<\/em>   If provided, this refers to the aspect of the pool to set such as MAX or CYCLE.\n    <br>If not provided it will default to <b>CURRENT<\/b>.   <strong><em>Pool.MODIFIER|nil<\/em><\/strong>   <em>eModifier<\/em>   If provided, this indicates which modifier to set such as BASE, BASE_BONUS, etc.\n    <br>If not provided, it will default to BASE.\n    <br><strong>Note<\/strong>: not all aspects have all modifiers. E.g., Pool.ASPECT.CURRENT has no modifiers whatsoever.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e20eec16-921d-8456-e39b-f71320798d52\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This pool.   <strong><em>boolean<\/em><\/strong>   <em>bSuccess<\/em>   Whether the setting was accepted or changed CURRENT.   <strong><em>number<\/em><\/strong>   <em>nOverage<\/em>   The rejected capacity or reservation overage; zero for CURRENT changes.<br><\/div><\/div><div class=\"custom-section\"><div id=\"870d6117-493a-dcb8-ec3a-0797ad5a2758\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    local oResult, bSuccess, nOverage = oPool.set(120);\n    assert(oResult == oPool and bSuccess and nOverage == 0);\n    assert(oPool.get() == 100);\n    oPool.set(10, Pool.ASPECT.CYCLE_FLAT); --BASE is the default modifier<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setEmpty": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Set the Pool to empty (if not already empty).<\/div><\/div><div class=\"custom-section\"><div id=\"f63477ec-61d5-f33d-c657-a94aec87d8ad\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   The Pool object.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2b9e9651-2986-3e7c-c901-6a48bb6c6036\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool.setEmpty();\n    assert(oPool.isEmpty());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setEventActive": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Enables\\disables an event from triggering.\n    <br>Note: this does not affect any current callback function for this event, it simply makes<br>\n    the event dormant until manually reactivated.<\/div><\/div><div class=\"custom-section\"><div id=\"379ec998-c6b0-ef60-b51b-75edea761833\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Pool.EVENT<\/em><\/strong>   <em>eEvent<\/em>   The event to enable or disable.   <strong><em>boolean<\/em><\/strong>   <em>bFlag<\/em>   Enables the event if true, disables it otherwise.<br><\/div><\/div><div class=\"custom-section\"><div id=\"3c352e3f-0399-6ebb-a56b-bcfd50fcee4f\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   The Pool object.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4d317fce-2215-6955-8fe7-c84306de23fa\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    local nCalls = 0;\n    oPool.setEventCallback(Pool.EVENT.ON_INCREASE, function() nCalls = nCalls + 1; end);\n    oPool.setEventActive(Pool.EVENT.ON_INCREASE, false);\n    oPool.adjust(10);\n    assert(nCalls == 0);\n    oPool.setEventActive(Pool.EVENT.ON_INCREASE, true);\n    oPool.adjust(10);\n    assert(nCalls == 1);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setEventCallback": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets a callback function for the specified event. The function will fire whenever the event is triggered.<\/div><\/div><div class=\"custom-section\"><div id=\"828ed6db-eb82-4ce5-7ffb-cefe6b4c0549\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Pool.EVENT<\/em><\/strong>   <em>eEvent<\/em>   The event for which the function should be called.   <strong><em>function|nil<\/em><\/strong>   <em>fCallback<\/em>   The callback function.\n    <br>Note: If a function is not input, it will delete any previous callback function and disable the event trigger.   <strong><em>boolean|nil<\/em><\/strong>   <em>bDoNotAutoActivate<\/em>   If a true value is input, it will prevent the event from being activated by this call.\n    <br>If nothing is provided, the event is active by default and the callback function will fire on event trigger.<br><\/div><\/div><div class=\"custom-section\"><div id=\"71f0227b-9367-6531-d86e-3f77ff74bd03\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   The Pool object.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4b208378-d71a-387f-f5e7-398ca97a82e7\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    local nCalls = 0;\n    oPool.setEventCallback(Pool.EVENT.ON_INCREASE, function() nCalls = nCalls + 1; end);\n    oPool.adjust(10);\n    assert(nCalls == 1);\n    oPool.setEventCallback(Pool.EVENT.ON_INCREASE, nil); --clears and disables the callback<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setFull": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets Pool's current value to the maximum available (if not already that high).\n    <br>Note: this is not the same as the maximum value.\n    <br>For instance, if 20% of a Pool (whose max is 100) is reserved, the value would be set to 80.<\/div><\/div><div class=\"custom-section\"><div id=\"6433d870-1bc0-dac8-1211-6cf955643b5a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   The Pool object.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7028820d-702b-ec49-ddb5-d3ee3af4e1d8\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool.set(20, Pool.ASPECT.RESERVED_FLAT);\n    oPool.setFull();\n    assert(oPool.get() == 80);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setHighMarker": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets the high threshold as a fraction of total maximum. Must be greater than the low marker and no greater than 1. Recalculates status immediately.<\/div><\/div><div class=\"custom-section\"><div id=\"45ac8c0d-07c5-d0b4-1038-afd1167ac5ce\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nValue<\/em>   The high marker.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2525a9a5-0c42-a2ff-2fdb-e8f31e1d7ad3\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This pool.<br><\/div><\/div><div class=\"custom-section\"><div id=\"0bfe28b6-ff12-b6cb-5b3a-6cb9d38e6309\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 80);\n    oPool.setHighMarker(0.8);\n    assert(oPool.isHigh());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setLowMarker": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets the low threshold as a fraction of total maximum. Must be greater than 0 and less than the high marker. Recalculates status immediately.<\/div><\/div><div class=\"custom-section\"><div id=\"002abb5d-a655-30c3-52b6-d115eda9aecf\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nValue<\/em>   The low marker.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9d8441e2-e0a0-8ff2-fb83-600604e47a50\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This pool.<br><\/div><\/div><div class=\"custom-section\"><div id=\"5a784bbe-abac-2f51-4a4d-730d47e5f324\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 20);\n    oPool.setLowMarker(0.2);\n    assert(oPool.isLow());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            },
            "Static%20Methods": {
                "value": ``,
                "subtable": {
                "withDeferredEvents": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Runs a synchronous action, deferring Pool callbacks until it finishes. Values and status update immediately; callbacks then run in order and all queued callbacks are attempted. Nested calls share the outer queue. This is not a rollback transaction: action or callback errors leave committed values intact and the first error is rethrown after notifications. The action must not yield.<\/div><\/div><div class=\"custom-section\"><div id=\"d6337967-7bd0-6498-099f-8b999dac73ce\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>function<\/em><\/strong>   <em>fAction<\/em>   The action to run.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8cdf4a01-5082-e082-d0a1-9334814bf8df\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>...<\/em>   The action's return values.<br><\/div><\/div><div class=\"custom-section\"><div id=\"39b8e427-a41f-3ad5-c8ea-ee2378177cac\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oFirst = Pool(100, 40);\n    local oSecond = Pool(100, 40);\n    oFirst.setEventCallback(Pool.EVENT.ON_DECREASE, function()\n        assert(oFirst.get() == 30 and oSecond.get() == 30);\n    end);\n    Pool.withDeferredEvents(function()\n        oFirst.adjust(-10);\n        oSecond.adjust(-10);\n    end);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            }
            }
        },
        "RNG": {
            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   A static helper class for rolling dice, drawing cards, etc. Uses the shared math.random stream; callers control seeding with math.randomseed. Defaults apply only to omitted/nil arguments. Invalid supplied inputs raise errors. All numeric inputs must be finite; die sides and counts must be integers.<\/div><\/div><\/div>`,
            "subtable": {
            "Methods": {
                "value": ``,
                "subtable": {
                "binary": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Generates a random value of 0 or 1.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"06929aa6-2b99-cdbb-300a-92fb932b6ff7\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>vWeight<\/em>   An optional float value that indicates whether to favor the lower or higher result. A higher weight favors 1s while a lower weight value favors 0s. E.g., a weight value of 0.2 will produce a <b>0<\/b> 80% of the time and a <b>1<\/b> 20% of the time, while a value of 0.75 will produce a <b>1<\/b> 75% of the time and a <b>0<\/b> 25% of the time.\n    <br>A nil value will force the default weight of 0.5. Supplied weights must be finite numbers in [0, 1]; 0 always selects the lower/first result, and 1 always selects the higher/second result.<br><\/div><\/div><div class=\"custom-section\"><div id=\"67edb711-26df-55e4-4b77-0a745d10f46a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nResult<\/em>   Randomly, 0 or 1.<br><\/div><\/div><div class=\"custom-section\"><div id=\"cf01fbf8-dd06-a5c5-fc13-18234d22fd12\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    print(tostring(RNG.binary())) --randomly, 0 or 1<\/code><\/pre><\/div><\/div><div class=\"custom-section\"><div id=\"af67f742-99bb-ddee-0735-7b4f6b0f0f4d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nZeros = 0;\n    local nOnes = 0;\n    local nWeight = 0.33;\n    local nTrials = 100000;\n\n    for x = 1, nTrials do\n      local nRes = RNG.binary(nWeight);\n\n      if nRes == 0 then\n        nZeros = nZeros + 1;\n      elseif nRes == 1 then\n        nOnes = nOnes + 1;\n      end\n\n    end\n\n    print(\"Using a weight value of \"..nWeight..\" for \"..nTrials..\" trials.\",\n          \"\\r\\nZeroes Rate: \"..nZeros / nTrials,\n          \"\\r\\nOnes Rate: \"..nOnes / nTrials);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "bipolar": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Generates a random value of -1 or 1.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"6981c5ea-ab6d-39a1-5e3f-54d8c32afac8\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>vWeight<\/em>   An optional float value that indicates whether to favor the lower or higher result. A higher weight favors 1s while a lower weight value favors -1s. E.g., a weight value of 0.2 will produce a <b>-1<\/b> 80% of the time and a <b>1<\/b> 20% of the time, while a value of 0.75 will produce a <b>1<\/b> 75% of the time and a <b>-1<\/b> 25% of the time.\n    <br>A nil value will force the default weight of 0.5. Supplied weights must be finite numbers in [0, 1]; 0 always selects the lower/first result, and 1 always selects the higher/second result.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ab7f3177-0492-cca8-6f4b-71487460e8aa\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nResult<\/em>   Randomly, -1 or 1.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c00d0487-99c9-f3ae-b6f0-0468055341c3\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    print(tostring(RNG.bipolar())) --randomly, -1 or 1<\/code><\/pre><\/div><\/div><div class=\"custom-section\"><div id=\"f301823f-a519-cf46-1e1c-9c66144e0f5c\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nLows = 0;\n    local nHighs = 0;\n    local nWeight = 0.75;\n    local nTrials = 100000;\n\n    for x = 1, nTrials do\n      local nRes = RNG.bipolar(nWeight);\n\n      if nRes == -1 then\n        nLows = nLows + 1;\n      elseif nRes == 1 then\n        nHighs = nHighs + 1;\n      end\n\n    end\n\n    print(\"Using a weight value of \"..nWeight..\" for \"..nTrials..\" trials.\",\n          \"\\r\\n-1s Rate: \"..nLows / nTrials,\n          \"\\r\\n1s Rate: \"..nHighs / nTrials);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "boolean": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Generates a random boolean value.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"89f3d90f-8f5b-0d0d-e0f9-7494289c9a6f\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>vWeight<\/em>   An optional float value that indicates whether to favor the lower or higher result. A higher weight favors trues while a lower weight value favors falses. E.g., a weight value of 0.2 will produce a <b>false<\/b> 80% of the time and a <b>true<\/b> 20% of the time, while a value of 0.75 will produce a <b>true<\/b> 75% of the time and a <b>false<\/b> 25% of the time.\n    <br>A nil value will force the default weight of 0.5. Supplied weights must be finite numbers in [0, 1]; 0 always selects the lower/first result, and 1 always selects the higher/second result.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1ad0ced7-7a77-9308-b5b0-201e13d4f690\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bFlag<\/em>   Randomly, true or false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c84b5524-6b8d-bdad-933e-efa72a1172c4\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    print(tostring(RNG.boolean())) --randomly, true or false<\/code><\/pre><\/div><\/div><div class=\"custom-section\"><div id=\"98bcd583-34b7-bc70-b09d-ece87b7c4abf\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nLows = 0;\n    local nHighs = 0;\n    local nWeight = 0.10;\n    local nTrials = 100000;\n\n    for x = 1, nTrials do\n      local bRes = RNG.boolean(nWeight);\n\n      if bRes == false then\n        nLows = nLows + 1;\n      elseif bRes == true then\n        nHighs = nHighs + 1;\n      end\n\n    end\n\n    print(\"Using a weight value of \"..nWeight..\" for \"..nTrials..\" trials.\",\n          \"\\r\\nFalse Rate: \"..nLows / nTrials,\n          \"\\r\\nTrue Rate: \"..nHighs / nTrials);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "choice": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Chooses between two input values.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"3dab6c53-2fdc-17df-b807-dee695d7cc48\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Any<\/em><\/strong>   <em>vItem1<\/em>   Any non-nil value;   <strong><em>Any<\/em><\/strong>   <em>vItem2<\/em>   Any non-nil value;   <strong><em>number|nil<\/em><\/strong>   <em>vWeight<\/em>   An optional float value that indicates whether to favor the <b>first<\/b> or <b>second<\/b> input value. A higher weight favors the <b>second<\/b> while a lower weight value favors the <b>first<\/b>. E.g., a weight value of 0.2 will choose the <b>first<\/b> input value 80% of the time and the <b>second<\/b> input value 20% of the time, while a value of 0.75 will choose the <b>second<\/b> input value 75% of the time and the <b>first<\/b> input value 25% of the time.\n    <br>A nil value will force the default weight of 0.5. Supplied weights must be finite numbers in [0, 1]; 0 always selects the lower/first result, and 1 always selects the higher/second result.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1c570fae-9b34-d6d9-4e62-eecca7d0c9bb\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vRet<\/em>   Either the <b>first<\/b> or <b>second<\/b> input value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"da038e84-eeb8-319c-604d-002ac64775da\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    print(tostring(RNG.choice(\"Bunny\", \"Cat\"))) --Randomly, \"Bunny\" or \"Cat\"<\/code><\/pre><\/div><\/div><div class=\"custom-section\"><div id=\"a330182f-3ed1-0cff-6ca6-054830dbc8f7\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local vItem1 = \"Bunny\";\n    local vItem2 = 31;\n\n    local nLows = 0;\n    local nHighs = 0;\n    local nWeight = 0.66;\n    local nTrials = 100000;\n\n    for x = 1, nTrials do\n      local vRes = RNG.choice(vItem1, vItem2, nWeight);\n\n      if vRes == vItem1 then\n        nLows = nLows + 1;\n      elseif vRes == vItem2 then\n        nHighs = nHighs + 1;\n      end\n\n    end\n\n    print(\"Using a weight value of \"..nWeight..\" for \"..nTrials..\" trials.\",\n          \"\\r\\nItem1 Rate: \"..nLows / nTrials,\n          \"\\r\\nItem2 Rate: \"..nHighs / nTrials);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "multiChoice": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Accepts a variable number of arguments and randomly selects one of them. It is an unweighted selection, meaning each argument has an equal chance of being chosen.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"76554f90-0fed-91af-c055-2da5cb8bb829\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>...<\/em>   At least one item to choose from; nil arguments are rejected. These can be of any non-nil type (numbers, strings, tables, etc.).<br><\/div><\/div><div class=\"custom-section\"><div id=\"df8f8565-d40a-eb99-4808-7a7fc1613028\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vItem<\/em>   One of the provided arguments, randomly selected.<br><\/div><\/div><div class=\"custom-section\"><div id=\"3b73439d-43db-80c7-43f2-9de60ea23a12\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    -- Example 1: Randomly select a fruit from a list\n    local sSelectedFruit = RNG.multiChoice(\"apple\", \"banana\", \"cherry\");\n    print(\"Selected fruit: \" .. sSelectedFruit)\n\n    -- Example 2: Randomly select a number from a list\n    local nSelectedNumber = RNG.multiChoice(10, 20, 30, 40, 50);\n    print(\"Selected number: \" .. nSelectedNumber)\n\n    -- Example 3: Randomly select a color from a list\n    local sSelectedColor = RNG.multiChoice(\"red\", \"green\", \"blue\", \"yellow\");\n    print(\"Selected color: \" .. sSelectedColor)\n\n    -- Example 4: Randomly select from mixed types (string, number, boolean)\n    local vSelectedItem = RNG.multiChoice(\"apple\", 42, true, \"banana\", 3.14, false);\n    print(\"Selected item: \" .. tostring(vSelectedItem))<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "percent": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Generates a percentage value.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"649136f1-a669-e65d-639c-7d23a4ecd0b5\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>boolean|nil<\/em><\/strong>   <em>bFloat<\/em>   Must be boolean when supplied. Whether the result should be a float from 0.01-1 or an int from 1-100 (defaults to false).<br><\/div><\/div><div class=\"custom-section\"><div id=\"ff8899e1-44aa-5d36-250e-215306599199\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nPercent<\/em>   An int or float value from 1-100 or 0.01-1 respectively (inclusive).<br><\/div><\/div><div class=\"custom-section\"><div id=\"e74881d8-63bc-cf74-d92a-a53749e7a48c\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    print(tostring(RNG.percent(true)))  --generates a random float from 0.01-1 (inclusive).\n    print(tostring(RNG.percent()))      --generates a random int from 1-100 (inclusive).<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "pick": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Selects and returns a single random element from a numerically indexed table. Supports sparse tables and both 0-based and 1-based numeric indexing.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"9de59f07-2602-1e56-f01f-e718572d8654\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tInput<\/em>   A table containing numeric indices to choose from.   <strong><em>number|nil<\/em><\/strong>   <em>nPicks<\/em>   Optional nonnegative integer count. When supplied, returns a list of picks; zero returns an empty list.   <strong><em>boolean|nil<\/em><\/strong>   <em>bAllowRepeats<\/em>   Allows the same source entry more than once when true; defaults to false. Distinct entries may hold equal values.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ecf87315-1915-2dc3-1dcc-d7a0832d778e\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vItem<\/em>   One randomly selected item from the table, or nil if no numeric entries exist in single-pick mode. With nPicks, returns a list; impossible counts raise an error. The source is unchanged.<br><\/div><\/div><div class=\"custom-section\"><div id=\"68588e68-66bd-c584-1d30-4f27009fc53a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">        local vPick = RNG.pick({[0] = \"A\", [8] = \"B\"});\n        local tPicks = RNG.pick({\"A\", \"B\", \"C\"}, 2, false);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "randomx": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns an integer in [1, N] with exponential bias.\n        <br>N must be an integer in [1,10]. Each step upward has nWeight times the probability of the preceding step (half as likely at the default weight 0.5).\n        <br><br>\n        -- Weight reference (approximate behavior)\n        -- 1.00 → uniform (no bias)\n        -- 0.80 → gentle bias (most values possible)\n        -- 0.65 → noticeable bias\n        -- 0.50 → strong bias (small values common)\n        -- 0.30 → very strong bias\n        -- 0.10 → extreme bias (almost always 1)<\/div><\/div><div class=\"custom-section\"><div id=\"e121b013-bd47-7ce5-e850-17dd4473c982\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nMax<\/em>   Requested integer maximum from 1 through 10; defaults to 1.   <strong><em>number|nil<\/em><\/strong>   <em>vWeight<\/em>   A finite value between 0.01 and 1 (inclusive) that sets the ratio from one number to the next; defaults to 0.5. Invalid inputs are rejected rather than clamped.<br><\/div><\/div><div class=\"custom-section\"><div id=\"89239147-ba45-b40f-7e43-2b0db5c625ad\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nResult<\/em>   Biased random integer.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f150598e-1201-eaad-5daa-0e8fdf2bc7b6\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local function TestRandomX(nMax, nRuns, nWeight)\n            local tCount = {};\n\n            for i = 1, nMax do\n                tCount[i] = 0;\n            end\n\n            for i = 1, nRuns do\n                local nV = RNG.randomx(nMax, nWeight);\n                tCount[nV] = tCount[nV] + 1;\n            end\n\n            print((\"RNG.randomx(%d), weight = %.2f, runs = %d\")\n                :format(nMax, nWeight, nRuns));\n            print(\"--------------------------------\");\n\n            for i = 1, nMax do\n                local nPct = (tCount[i] / nRuns) * 100;\n                print((\"%2d : %6.2f%%\"):format(i, nPct));\n            end\n\n            print(\"\");\n        end\n\n        TestRandomX(10, 100000, 0.5);\n        TestRandomX(10, 100000, 0.8);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "rollCheck": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Determines whether a check is made based on the input. Often used for things like stat checks. The check will be successful if the number rolled by the function is equal to or higher than the <strong><em>nCheck<\/em><\/strong> parameter.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"0d7a797f-cd70-e7cb-3076-3940d5b96ee8\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nSides<\/em>   Positive integer die sides; defaults to 20.   <strong><em>number|nil<\/em><\/strong>   <em>nCheck<\/em>   Finite integer success threshold; defaults to 10. Values below 1 always succeed, and values above nSides always fail.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4ce2396e-b131-5457-93c0-6ee2fcc618b8\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bSuccess<\/em>   True if the check was successful or false otherwise.   <strong><em>number<\/em><\/strong>   <em>nRoll<\/em>   The die result.   <strong><em>number<\/em><\/strong>   <em>nMargin<\/em>   The roll minus the threshold.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d8ecb1a4-9335-d4e7-369c-3a6c62d5ddc4\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local bSuccess, nRoll, nMargin = RNG.rollCheck(20, 12);<\/code><\/pre><\/div><\/div><\/div>`,

                "rollDice": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Rolls a number of dice, returning the sum total of the roll.\n    <br>The number of sides on the dice is determined by the <strong><em>nSides<\/em><\/strong> parameter (defaults to 6).\n    <br>The number of dice to roll is determined by the <strong><em>nDice<\/em><\/strong> parameter (defaults to 1).\n    <br>The number of attempts is determined by the <strong><em>nAttempts<\/em><\/strong> parameter (defaults to 1).\n    <br> If the number of attempts is set to a value greater than 1, the roll will happen that many times, keeping only the highest total out of all the attempts.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"1f745c5c-1d44-2798-e7a6-eda46bc62627\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nSides<\/em>   Positive integer die sides; defaults to 6.   <strong><em>number|nil<\/em><\/strong>   <em>nDice<\/em>   Positive integer number of dice; defaults to 1.   <strong><em>number|nil<\/em><\/strong>   <em>nAttempts<\/em>   Positive integer number of complete rolls; defaults to 1.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9ce6c048-808e-aac8-ec3a-5c417da71d2f\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nTotal<\/em>   The highest sum from the complete attempts.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bd018948-0160-42f3-e3d8-995a3ccb5dd3\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local nTotal = RNG.rollDice(6, 3, 2); -- Best of two complete 3d6 rolls.<\/code><\/pre><\/div><\/div><\/div>`,

                "rollPercentage": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Rolls a percentage chance based on the input value.\n    <br>The number of attempts is determined by the <strong><em>nAttempts<\/em><\/strong> parameter (defaults to 1).\n    <br> If the number of attempts is set to a value greater than 1, the roll will happen that many times or until it is successful (if successful before the number of attempts runs out).<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"731a6179-6c7b-6a60-a3fd-1b3eddeac84b\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nChance<\/em>   Finite chance in [0, 100], including exact fractional percentages; defaults to 50. Zero always fails and 100 always succeeds.   <strong><em>number|nil<\/em><\/strong>   <em>nAttempts<\/em>   Positive integer number of attempts; defaults to 1.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bf41fc42-f87f-7502-350b-5f9b05575b59\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bSuccess<\/em>   True if any attempt succeeded, false otherwise.   <strong><em>number<\/em><\/strong>   <em>nRoll<\/em>   The lowest percentage roll made, in (0, 100]; may be fractional.   <strong><em>number<\/em><\/strong>   <em>nMargin<\/em>   The chance minus the lowest roll.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ff2734e4-a6b6-4ef5-8af9-daddf9604ff7\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local bSuccess, nRoll, nMargin = RNG.rollPercentage(12.5, 3);<\/code><\/pre><\/div><\/div><\/div>`,

        "Rarity": {
            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <div class=\"text-center\" style=\"margin: 20px;\">\n    <div class=\"alert\" style=\"background-color: #CCDC90; color: #333333; border-radius: 15px; padding: 10px; display: inline-block;\">\n        <b>Overview of the Rarity Class<\/b>\n        <br>\n        The Rarity class is a static helper class and defines the properties and characteristics of objects based on their rarity levels.\n        The system is flexible, allowing for easy customization through a configuration table.\n        Each rarity level is associated with unique attributes, which can impact gameplay, item appearance, and player experience.\n    <\/div>\n<\/div>\n\n<table class=\"table table-bordered\">\n    <thead>\n        <tr>\n            <th style=\"background-color: #CCDC90; color: #000000;\">Aspect<\/th>\n            <th style=\"background-color: #CCDC90; color: #000000;\">Description<\/th>\n        <\/tr>\n    <\/thead>\n    <tbody style=\"background-color: #3F3F3F; color: #DCDCCC;\">\n        <tr>\n            <td><b>Affix System<\/b><\/td>\n            <td>Defines the maximum tier of affixes applicable to items, influencing their capabilities and attributes.<\/td>\n        <\/tr>\n        <tr>\n            <td><b>Rarity Levels<\/b><\/td>\n            <td>Specifies multiple rarity levels, each with distinct characteristics affecting item drop rates, appearances, and enhancements.<\/td>\n        <\/tr>\n        <tr>\n            <td><b>Color Coding<\/b><\/td>\n            <td>Each rarity level can have an associated color for visual differentiation in the UI, enhancing user experience.<\/td>\n        <\/tr>\n        <tr>\n            <td><b>Chance Mechanism<\/b><\/td>\n            <td>Establishes the probability of obtaining items of varying rarities, allowing for balanced item distribution.<\/td>\n        <\/tr>\n        <tr>\n            <td><b>Affix Tiers<\/b><\/td>\n            <td>Sets the minimum and maximum affix tiers for each rarity level, impacting the potential power and utility of items.<\/td>\n        <\/tr>\n        <tr>\n            <td><b>Prefix and Suffix Ranges<\/b><\/td>\n            <td>Defines the numeric range of prefixes and suffixes that can be assigned to items, further diversifying their properties and effects.<\/td>\n        <\/tr>\n    <\/tbody>\n<\/table><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Note<\/div><div class=\"section-content\">   Configuration is validated when this module loads: all lists must be dense and the\nsame length, level names unique, colors #RRGGBB, chances descending integer thresholds\nin [0,100] beginning at 100, and affix tiers/counts valid ordered ranges. Equal chance\nthresholds permit zero-probability levels. Validated lists are retained as private snapshots.\n\nThe Rarity system's configuration is designed for customization on a per-game basis, enabling developers to establish unique rarity systems tailored to their specific game mechanics and aesthetics. However, once the game is running, the configuration data is immutable and cannot be altered during gameplay. This intentional design choice ensures that the rarity framework remains stable and consistent, preventing any tampering or unintended modifications while the game is in execution. By restricting changes to the configuration file outside of gameplay, developers can maintain the integrity of the game's mechanics, fostering a reliable experience for players.<\/div><\/div><\/div>`,

                "getRandom": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   This method selects a Rarity LEVEL based on cumulative percentage thresholds. It rolls an integer percentage, adds the adjustment to the roll, and checks rarity levels from highest to lowest. The first threshold at least as large as the adjusted roll wins; the lowest rarity is the fallback. A negative adjustment increases the likelihood of obtaining a higher rarity, while a positive adjustment decreases it.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Public Static<\/div><\/div><div class=\"custom-section\"><div id=\"77239ec2-f2e8-cca8-6a5a-684dcb24041c\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nAdjustment<\/em>   An optional numeric adjustment to the chance roll. Negative values enhance the chance for higher rarities, while positive values diminish it.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1056ce7a-0a93-fc31-debb-258d838cd330\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Rarity.LEVEL<\/em><\/strong>   <em>eLevel<\/em>   The Rarity <a href=\"#CoG.Rarity.Enums.LEVEL\">LEVEL<\/a> determined based on the random roll and any adjustments made.<br><\/div><\/div><\/div>`,

        "Shuffler": {
            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates systems for randomized, non-repeating selection from a set of items, with support for resetting once all items have been selected. It maintains two internal tables: the pool, which stores all added items, and the buffer, a shuffled working copy used for pulling items via pop(). By default, when the buffer is emptied through pop(), it automatically resets by refilling from the pool.<\/div><\/div><\/div>`,
            "subtable": {
            "Methods": {
                "value": ``,
                "subtable": {
                "Shuffler": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   The class constructor.<\/div><\/div><div class=\"custom-section\"><div id=\"55cc6516-167d-3174-8a28-df28cf749d2c\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table|nil<\/em><\/strong>   <em>Optional<\/em>   argument that is a numerically-indexed table containing items to add to the pool.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "add": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adds any non-nil item to the pool and resets the buffer.<\/div><\/div><div class=\"custom-section\"><div id=\"a2e83cd3-ac3e-5685-8031-5e2691948e61\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vItem<\/em>   Any non-nil item.   <strong><em>boolean|nil<\/em><\/strong>   <em>Optional<\/em>   argument that, if set to true, will skip resetting the buffer. This is useful for bulk additions.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8d590dc9-62a9-4e2e-1357-7e6cf4751646\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bAddded<\/em>   True if the item was added, false otherwise.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "empty": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Empties the buffer so that no items are available for popping. The buffer will refill upon a reset.<\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getRemaining": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns the total number items available in the buffer to pop before it requires reset.<\/div><\/div><div class=\"custom-section\"><div id=\"3a179b90-7972-bf61-5afc-5b56b396788d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>bRemaining<\/em>   The total number of items available.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "pop": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Removes a random item from the buffer and returns that item to the caller. If it's the last item in the buffer and auto-reset is enabled, the buffer is reset.<\/div><\/div><div class=\"custom-section\"><div id=\"c9d4df26-e9d4-6c2a-5e3f-655760ee172a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vItem<\/em>   The item removed from the buffer.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "purge": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Removes all the items from the pool and buffer.<\/div><\/div><\/div>`,
                    "subtable": null
                },
                "remove": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Removes an item from the pool and resets the buffer.\n    <br>Note: if there is more than one instance of the item, only the first one (arbitrarily) encountered will be removed.<\/div><\/div><div class=\"custom-section\"><div id=\"2b7df4f6-6301-6544-2adb-688237e637ed\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vItem<\/em>   Any non-nil item that exists in the pool.   <strong><em>boolean|nil<\/em><\/strong>   <em>Optional<\/em>   argument that, if set to true, will skip resetting the buffer. This is useful for bulk removals.<br><\/div><\/div><div class=\"custom-section\"><div id=\"cd6f29e0-1551-347d-47a5-a1d5af2205d1\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>bRemoved<\/em>   True if the item was removed, false otherwise.<br><\/div><\/div><\/div>`,
                    "subtable": null

                "reset": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Resets the buffer to contain all pool items, shuffles it and makes available all items for popping.<\/div><\/div><\/div>`,

        "TagSystem": {

        "XPSystem": {
            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   An experience tracker and leveling system. Every curve calculates the\n    XP cost of gaining one level. Rounded-up costs accumulate into total thresholds;\n    earned XP is cumulative and is not spent when gaining levels. Level zero starts\n    at zero XP. Levels cap at MaxLevel, while surplus XP is retained.<\/div><\/div><\/div>`,
            "subtable": {
            "Enums": {
                "value": ``,
                "subtable": {
                "TYPE": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Dictates the mathematical mechanisms used to calculate experience\n        cost per level. Let B be level-one cost, P progression, L the destination\n        level, and S step size. Each cost is rounded up before accumulation.\n        <ul>\n            <li><b>LINEAR<\/b>: B + P * (L - 1)<\/li>\n            <li><b>LOGARITHMIC<\/b>: B + P * log(L), using the natural logarithm<\/li>\n            <li><b>EXPONENTIAL<\/b>: B * P^(L - 1), with P at least 1<\/li>\n            <li><b>QUADRATIC<\/b>: B + P * (L - 1)^2<\/li>\n            <li><b>CUBIC<\/b>: B + P * (L - 1)^3<\/li>\n            <li><b>STEP<\/b>: B + P * floor((L - 1) / S)<\/li>\n        <\/ul><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            },
            "Methods": {
                "value": ``,
                "subtable": {
                "XPSystem": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates a tracker. Level-one cost is at least 1; maximum level and step\n    size are positive integers. Progression is nonnegative, or at least 1 for\n    exponential curves. All numbers must be finite. Step size defaults to 2.<\/div><\/div><div class=\"custom-section\"><div id=\"bdadc81c-d752-674c-fe25-908e92b52fa4\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>XPSystem.TYPE<\/em><\/strong>   <em>eType<\/em>   The curve.   <strong><em>number<\/em><\/strong>   <em>nLevelOneXP<\/em>   The cost to reach level one.   <strong><em>number<\/em><\/strong>   <em>nMaxLevel<\/em>   The maximum level.   <strong><em>number<\/em><\/strong>   <em>nProgression<\/em>   The curve's increment or exponential multiplier.   <strong><em>number|nil<\/em><\/strong>   <em>nStepSize<\/em>   The levels per step.<br><\/div><\/div><\/div>`,

    "Dox": {
        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <strong>Dox<\/strong> auto-generates documentation for code by reading and parsing comment blocks.\n<br><br>\nNote: Dox is intended only to be used by being subclassed.\n<br>Subclasses of Dox (called parsers), provide the required parameters to properly parse comments blocks for specific languages.\n<br><a href=\"https://imgflip.com/i/910ysh\"><img style=\"width: 200px; height: 200px\" class=\"rounded float-left img-thumbnail\" src=\"https://i.imgflip.com/910ysh.jpg\" title=\"made at imgflip.com\"/><\/a>\n<br>--...Meta End<\/div><\/div><div class=\"custom-section\"><div id=\"11b1fc3e-8508-56f7-3919-adc4cd037aa3\" class=\"section-title\">Bug(s)<\/div><div class=\"section-content\">   In an FQXN with multiple spaces, only the first is handled correcly.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2c8dab3b-9962-6842-bb75-5b8c8c35ae1b\" class=\"section-title\">TODO<\/div><div class=\"section-content\">   <!--TODO-->\n<ul>\n    <li>allow user to suround content block with (optional tags) tags...<\/li>\n    <li>color dead anchor links<\/li>\n    <li>add option to get and print TODO, BUG, etc.<\/li>\n    <li>parse single-line comments too<\/li>\n    <li>add tooltip with @des info (if available) in sidemenu items<\/li>\n    <li>allow custom BlockTag sort order (in what order items are displayed in the output)<\/li>\n    <li>allow escaping . in FQXN<\/li>\n    <li>fix bug in fqxns with multiple-spaces<\/li>\n<\/ul><br><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Summary<\/div><div class=\"section-content\">   Below is the layout and hierarchy of Dox and all its elements.\n<!-- Parsers -->\n    <div class=\"accordion-item\">\n      <h2 class=\"accordion-header\" id=\"headingParsers\">\n        <button class=\"accordion-button\" type=\"button\" data-bs-toggle=\"collapse\"\n                data-bs-target=\"#collapseParsers\" aria-expanded=\"true\" aria-controls=\"collapseParsers\">\n          📦 Parsers\n        <\/button>\n      <\/h2>\n      <div id=\"collapseParsers\" class=\"accordion-collapse collapse show\"\n           aria-labelledby=\"headingParsers\" data-bs-parent=\"#doxAccordion\">\n        <div class=\"accordion-body\">\n          <p>Language-specific modules that scan your source for <code>--[[! … ]]<\/code> blocks and <code>@tags<\/code>, then emit <strong>DoxBlockTag<\/strong> objects.<\/p>\n          <ul>\n            <li><code>DoxSyntax.lua<\/code> – core tokenizer, finds raw tags and text<\/li>\n            <li><code>DoxLua.lua<\/code>, <code>DoxCPP.lua<\/code>, etc. – apply comment-style rules and normalize into <code>DoxBlockTag<\/code><\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- Components -->\n    <div class=\"accordion-item\">\n      <h2 class=\"accordion-header\" id=\"headingComponents\">\n        <button class=\"accordion-button collapsed\" type=\"button\" data-bs-toggle=\"collapse\"\n                data-bs-target=\"#collapseComponents\" aria-expanded=\"false\" aria-controls=\"collapseComponents\">\n          🔧 Components\n        <\/button>\n      <\/h2>\n      <div id=\"collapseComponents\" class=\"accordion-collapse collapse\"\n           aria-labelledby=\"headingComponents\" data-bs-parent=\"#doxAccordion\">\n        <div class=\"accordion-body\">\n          <p>Core in-memory models and the abstract builder interface.<\/p>\n          <ul>\n            <li><strong>DoxBlockTag.lua<\/strong> – represents one <code>@tag<\/code> (name, type, description)<\/li>\n            <li><strong>DoxBlock.lua<\/strong> – groups tags &amp; text into a logical block<\/li>\n            <li><strong>DoxBuilder.lua<\/strong> – abstract base with <code>refresh()<\/code> and <code>build()<\/code> signatures<\/li>\n            <li><strong>DoxMime.lua<\/strong> – escaping &amp; formatting helpers<\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- Builders -->\n    <div class=\"accordion-item\">\n      <h2 class=\"accordion-header\" id=\"headingBuilders\">\n        <button class=\"accordion-button collapsed\" type=\"button\" data-bs-toggle=\"collapse\"\n                data-bs-target=\"#collapseBuilders\" aria-expanded=\"false\" aria-controls=\"collapseBuilders\">\n          🏗️ Builders\n        <\/button>\n      <\/h2>\n      <div id=\"collapseBuilders\" class=\"accordion-collapse collapse\"\n           aria-labelledby=\"headingBuilders\" data-bs-parent=\"#doxAccordion\">\n        <div class=\"accordion-body\">\n          <div class=\"row\">\n            <div class=\"col-md-6\">\n              <h5>HTML Builder<\/h5>\n              <ul>\n                <li><code>DoxBuilderHTML.lua<\/code> – nests by FQXN, injects CSS/JS, outputs HTML page<\/li>\n                <li><code>Data/dox.css<\/code> &amp; <code>prism.js<\/code> for styling &amp; highlighting<\/li>\n              <\/ul>\n            <\/div>\n            <div class=\"col-md-6\">\n              <h5>PulsarLua Builder<\/h5>\n              <ul>\n                <li><code>DoxBuilderPulsarLua.lua<\/code> – filters <code>@display PulsarLua<\/code>, builds nested table, emits JSON (to adapt for CSON snippets)<\/li>\n              <\/ul>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- Integration -->\n    <div class=\"accordion-item\">\n      <h2 class=\"accordion-header\" id=\"headingIntegration\">\n        <button class=\"accordion-button collapsed\" type=\"button\" data-bs-toggle=\"collapse\"\n                data-bs-target=\"#collapseIntegration\" aria-expanded=\"false\" aria-controls=\"collapseIntegration\">\n          🔄 How It Fits Together\n        <\/button>\n      <\/h2>\n      <div id=\"collapseIntegration\" class=\"accordion-collapse collapse\"\n           aria-labelledby=\"headingIntegration\" data-bs-parent=\"#doxAccordion\">\n        <div class=\"accordion-body\">\n          <ol>\n            <li><strong>Parse<\/strong> source → <code>DoxBlockTag<\/code> → <code>DoxBlock<\/code><\/li>\n            <li><strong>Refresh<\/strong> in builder → nest by FQXN → <code>tFinalizedData<\/code><\/li>\n            <li><strong>Build<\/strong> in builder → serialize to HTML/JSON/CSON<\/li>\n            <li><strong>Output<\/strong> injected into docs or editor snippets<\/li>\n          <\/ol>\n        <\/div>\n      <\/div>\n    <\/div>\n\n  <\/div>\n<\/div><\/div><\/div><div class=\"custom-section\"><div id=\"502b1435-007a-4a81-c751-0963f0288ec6\" class=\"section-title\">Field(s) - Private<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>blockOpen<\/em>   Set during contruction, this is the string that tells Dox when to <strong>start<\/strong> reading a <a href=\"#Dox.Components.DoxBlock\">DoxBlock<\/a>.   <strong><em>string<\/em><\/strong>   <em>blockClose<\/em>   Set during contruction, this is the string that tells Dox when to <strong>stop<\/strong> reading a <a href=\"#Dox.Components.DoxBlock\">DoxBlock<\/a>.   <strong><em>table<\/em><\/strong>   <em>blockTags<\/em>   A complete list of <a href=\"#Dox.Components.DoxBlockTag\">DoxBlockTags<\/a> available to the instance.\n<br>It's built during construction by first importing all built-in <a href=\"#Dox.Components.DoxBlockTag\">DoxBlockTags<\/a>, then by creating and inserting the example <strong>BlockTags<\/strong> and finally by inputting all input varargs (input <strong>BlockTags<\/strong>) if any are provided.--TODO FINISH<br><\/div><\/div><div class=\"custom-section\"><div id=\"8e5a03de-df66-1c28-5b97-74b68bbf960f\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    --[[!\n        @fqxn Dox\n        @desc &lt;strong&gt;Dox&lt;/strong&gt; auto-generates documentation for code by reading and parsing comment blocks.\n        <br>&lt;br&gt;\n        <br>&lt;br&gt;Note:Dox is intended only to be used by being subclassed.\n        <br>&lt;br&gt;Subclasses of Dox (called parsers), provide the required parameters to properly parse comments blocks for specific languages.\n        @ex&lt;br&gt;--Many Wow! How Yay! Much Meta!\n        <br>&lt;br&gt;--...Meta End\n    !]]<\/code><\/pre><\/div><\/div><div class=\"custom-section\"><div id=\"1ea718aa-1b48-c3f9-ea4d-161ead85e282\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">--for this example, we're using Lua\n\n--create the Lua language parser object (with the project name)\nlocal oDoxLua = DoxLua(\"MyProject\");\n\n--import a directory recursively (read & parse files)\nlocal pImport = \"C:\\\\Path\\\\To\\\\My\\\\Project\"\n\nlocal function importFiles(pDir)\n\n    for _, pFile in pairs(io.listfiles(pDir, false, nil, \"lua\")) do\n        oDoxLua.importFile(pFile, true); --don't refresh the data until we're done importing\n        --print(pFile);\n    end\n\nend\n\nlocal tFolders = io.listdirs(pImport, true, importFiles); --set recursion to true\n\n--set the output path\noDoxLua.setOutputPath(\"C:\\\\Users\\\\MyUsername\\\\MyProject\");\n\n--[[we don't need to set a Dox.BUILDER since it defaults\n    to Dox.BUILDER.HTML and that's what we want]]\n\n--refresh the data\noDoxLua.refresh();\n\n--export html help file.\noDoxLua.export(); --profit!<\/code><\/pre><\/div><\/div><\/div>`,

                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Used to create DoxBlockTags used in a Dox parser.<br>While Dox ships with many pre-made DoxBlockTags, users may also create and add their own by subclassing Dox.<\/div><\/div><div class=\"custom-section\"><div id=\"63743cc1-faa8-8d61-a16c-3f20db8c4348\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local tAliases          = {\"fqxn\"};\n    local sDisplay          = \"FQXN\";\n    local bRequired         = true;\n    local bMultipleAllowed  = false;\n    local bCombined         = false;\n    local bUtil             = false;\n    local nExtraColumns     = 0;\n    local oFQXN             = DoxBlockTag(tAliases, sDisplay, bRequired, bMultipleAllowed, bCombined, bUtil, nExtraColumns);\n    --TODO more examples<\/code><\/pre><\/div><\/div><\/div>`,
                "subtable": {
                "Methods": {
                    "value": ``,
                    "subtable": {
                    "DoxBlockTag": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   This is the constructor for the class.<\/div><\/div><div class=\"custom-section\"><div id=\"96bb5152-4c37-a2fd-6c22-0d09ecb61b7c\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tAliases<\/em>   A table of aliases that may be used. Each alias must be unique to every other DoxBlockTag's alias. There must be at least one alias.   <strong><em>string<\/em><\/strong>   <em>sDisplay<\/em>   The display text for the tag (as opposed to the alias).   <strong><em>boolean|nil<\/em><\/strong>   <em>bRequired<\/em>   Whether this DoxBlockTag is required. Defaults to false if nil.   <strong><em>boolean|nil<\/em><\/strong>   <em>bMultipleAllowed<\/em>   Whether multiple of this DoxBlockTag are permitted in a DoxBlock. Defaults to false if nil.   <strong><em>boolean|nil<\/em><\/strong>   <em>bCombined<\/em>   Whether the content in each of multiple of this DoxBlockTag should be combined under one section. Defaults to false if nil.   <strong><em>boolean|nil<\/em><\/strong>   <em>bIsUtil<\/em>   Whether this DoxBlockTag is a utility tag. If so, it may still be used by the builder but its contents should be ignored in the builder's final output. Defaults to false if nil.   <strong><em>number|nil<\/em><\/strong>   <em>nExtraColumns<\/em>   The number of extra columns this DoxBlockTag has. Defaults to 0 if nil. Zero extra columns means one content column; two extra columns means three content columns, as demonstrated by the @param DoxBlockTag.<br><\/div><\/div><\/div>`,

            "FQXN": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   This is the Fully Qualified Dox Name of a given item.\n<br>For example, the FQXN of this specific document item that you're reading now is <strong>Dox.Glossary.FQXN<\/strong>.\n<br>\n<br>FQXNs are used to not only arrange documentation hierarchically, but also to create internal anchor links. For example, to link to this documentation item, a link is created as follows:\n<br>&lt;a href=&quot;#Dox.Glossary.FQXN&quot;&gt;Dox.Glossary.FQXN&lt;/a&gt;\n<br><br>\n<strong>Note<\/strong>: Whether FQXNs may contain spaces is up to each <a href=\"#Dox.Components.DoxBuilder\">DoxBuilder<\/a>.<br>For example, the <a href=\"#Dox.Components.DoxBuilderHTML\">DoxBuilderHTML<\/a> allows spaces seemlessly in FQXNs and handles them at several points in the code so the links still function properly while maintaining the visual spaces in the FQXN names.<\/div><\/div><\/div>`,
