                "subtable": {
                "AStarRover": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates a rover owned by the supplied node, with neutral affinities and aversions for every aspect in its AStar system and zero movement points.<\/div><\/div><div class=\"custom-section\"><div id=\"80dc28e8-4aec-e26b-003d-01c0c1c91534\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oAStarNode<\/em>   The initial owning node.   <strong><em>boolean|nil<\/em><\/strong>   <em>bRetainsPointsOverCycle<\/em>   Whether unused points carry into the next cycle; defaults to true.<br><\/div><\/div><div class=\"custom-section\"><div id=\"78e38389-88dd-2d3c-74d7-953fa4e7f7eb\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>oRover<\/em>   The new rover.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f506676d-32ed-41a1-bfbc-8d3f02632b2f\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    assert(type(oRover) == \"AStarRover\" and oRover.getOwner() == oNode);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "RetainsPointsOverCycle": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Whether unused movement points carry into the next cycle. Defaults to true. Generates getRetainsPointsOverCycle and setRetainsPointsOverCycle; both methods are final. False clears CURRENT before applying regeneration.<\/div><\/div><div class=\"custom-section\"><div id=\"9bf4e738-5fd3-0d10-d85c-950e2615076b\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar();\n    local oMap    = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\")}, 1, 1);\n    local oRover  = oMap.getNode(\"ground\", 1, 1).createRover(false);\n    assert(not oRover.getRetainsPointsOverCycle());\n    oRover.setRetainsPointsOverCycle(true);\n    assert(oRover.getRetainsPointsOverCycle());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "abhors": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether this rover abhors the named aspect. Names are matched in uppercase; an unknown aspect returns false.<\/div><\/div><div class=\"custom-section\"><div id=\"0fe7365c-914f-25bd-11d6-38906794f7df\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sAspect<\/em>   A nonblank aspect name.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c55f9472-5d78-9029-b87f-bd112532ba4d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bAbhors<\/em>   Whether this rover abhors the aspect.<br><\/div><\/div><div class=\"custom-section\"><div id=\"680d2d95-0eb3-2e02-adda-80f57ca94387\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    oRover.setAbhors(\"mud\", true);\n    assert(oRover.abhors(\"MUD\"));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "addDeniedType": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adds a type denied entry to nodes occupied by this rover. An asterisk denies all unlike types. A type already owned by this rover cannot be denied. Names are stored in uppercase.<\/div><\/div><div class=\"custom-section\"><div id=\"f81a9def-8624-0c93-ad6c-28408b72f41f\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sType<\/em>   A nonblank type name.<br><\/div><\/div><div class=\"custom-section\"><div id=\"eb6afa2b-a536-bd26-1dcf-3ef2e7d99579\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>oRover<\/em>   This rover, for chaining.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9557ab9a-8e3b-970d-8d57-9fa71b1e1d49\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    oRover.addDeniedType(\"enemy\");\n    assert(oRover.hasDeniedType(\"ENEMY\"));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "addType": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adds an uppercase rover type unless it is already present or explicitly denied.<\/div><\/div><div class=\"custom-section\"><div id=\"2542ade7-c155-539c-722a-0584d5f0b120\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sType<\/em>   A nonblank type name.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c1fd9246-2b2e-4cde-6b78-2d1cfb59f594\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>oRover<\/em>   This rover, for chaining.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b35e703a-7673-090c-9592-6b4b8709a6a7\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    oRover.addType(\"goblin\");\n    assert(oRover.isType(\"GOBLIN\"));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null

                "allowsEntryTo": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether another rover may enter a node occupied by this rover. A shared type always allows entry; otherwise the wildcard or a matching denied type blocks entry.<\/div><\/div><div class=\"custom-section\"><div id=\"c23bea48-ba34-7000-49c1-5c43ba99273e\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>other<\/em>   The other rover.<br><\/div><\/div><div class=\"custom-section\"><div id=\"6356668d-e3f9-e7d7-162d-082578e869d3\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bAllowed<\/em>   Whether the other rover may enter.<br><\/div><\/div><div class=\"custom-section\"><div id=\"58e16fe9-23ae-0338-4ec6-adf0818f2d2f\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    local oOther = oNode.createRover();\n    oOther.addType(\"enemy\");\n    oRover.addDeniedType(\"enemy\");\n    assert(not oRover.allowsEntryTo(oOther));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null

                "cycle": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Cycles this rover's movement-point Pool using its configured regeneration and available capacity. When RetainsPointsOverCycle is false, clears unused points before regeneration. Does not move the rover. The caller determines when turns or cycles occur.<\/div><\/div><div class=\"custom-section\"><div id=\"5757a56a-21b3-3006-5131-4a15e8e285cf\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nMultiplier<\/em>   The regeneration multiplier; defaults to 1, as for Pool.cycle.<br><\/div><\/div><div class=\"custom-section\"><div id=\"476feb7e-68fe-49be-4dce-1fd3585c530b\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>oRover<\/em>   This rover.<br><\/div><\/div><div class=\"custom-section\"><div id=\"01b9a2af-cd27-eb0e-2665-86e6fc3ee2f1\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar();\n    local oMap    = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\")}, 1, 1);\n    local oRover  = oMap.getNode(\"ground\", 1, 1).createRover();\n    local oPoints = oRover.getMovePointPool();\n    oPoints.set(30, Pool.ASPECT.MAX);\n    oPoints.set(10, Pool.ASPECT.CYCLE_FLAT);\n    oRover.cycle();\n    assert(oPoints.get() == 10);<\/code><\/pre><\/div><\/div><\/div>`,

                "getMovePointPool": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the caller-configurable movement-point Pool, initially zero with capacity 1 and zero regeneration. Configure MAX for capacity and CYCLE_FLAT or CYCLE_PERCENT for regeneration. Movement deducts entry cost from CURRENT without changing capacity or regeneration.<\/div><\/div><div class=\"custom-section\"><div id=\"07e33300-787a-dec2-f892-d02b076059c6\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPoints<\/em>   The movement-point budget.<br><\/div><\/div><div class=\"custom-section\"><div id=\"5a3bf791-7cfd-55a1-25d5-dabfdf06e60d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar();\n    local oMap    = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\")}, 2, 1);\n    local oRover  = oMap.getNode(\"ground\", 1, 1).createRover();\n    local oPoints = oRover.getMovePointPool();\n    oPoints.set(30, Pool.ASPECT.MAX);\n    oPoints.set(10, Pool.ASPECT.CYCLE_FLAT);\n    oPoints.setFull();\n    assert(oPoints.get() == 30);\n    assert(oPoints.get(Pool.ASPECT.CYCLE) == 10);<\/code><\/pre><\/div><\/div><\/div>`,

e(\"ground\", 2, 1)) and oPoints.get() == 0);<\/code><\/pre><\/div><\/div><\/div>`,

e Affix.<\/li>\n        <\/ol>\n        If a return is provided by the activator function, it must be a table whose keys are enumitems and values are numerically-indexed tables with event hook function values. This tables is used by the calling object to add events to the object's eventrix during application of the Affix.\n    TODO FINISH OTHER PARAMS\n    <br><strong>Note<\/strong>: the handler of the item/monster/etc. that hosts the affix is responsible for calling this function and determining when it should be called.<br><\/div><\/div><\/div>`,

        "EventSystem": {
            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   The EventSystem is designed to provide a simple-to-use, safe event system for your games.\n<br>Each event must have an \"owner\" whether that be an object, a table, or even a simple string. In fact, the owner of a registered event can be any non-nil value.\n<br>Event callbacks are executed in the environment set during event registration or the default environment if one is not set during registration.\n<br>Each EventSystem can be created with a default environment in which all not-otherwise-specified callbacks will fire.\n<br>Note: The EventSystem class is <b>not<\/b> static. You may create as many EventSystems as you wish since each one must be instantiated.<\/div><\/div><\/div>`,

                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   The constructor for the EventSystem.<\/div><\/div><div class=\"custom-section\"><div id=\"378d6e64-89c4-52a7-06ae-1fab53bae362\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table|nil<\/em><\/strong>   <em>tEnv<\/em>   The default <a href=\"https://www.lua.org/manual/5.3/manual.html#2.2\" target=\"_blank\">environment<\/a> in which to fire event callbacks (if one is not specified during event registration). If nil, the current environment will be used as the default.<br><\/div><\/div><div class=\"custom-section\"><div id=\"73d2ac87-3073-2fbc-d599-92bfa8cf46bf\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local tRestrictedEnv = {print = print, type = type, string = string};\n    local oRestrictedEventSystem = EventSystem(tRestrictedEnv); -- creates an EventSystem with a restricted default env\n\n    local oEventSystem = EventSystem(); --creates an EventSystem using the current environment as the default<\/code><\/pre><\/div><\/div><\/div>`,

        "ItemSystem": {
            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   The item system is designed to be used for inventories, equipment, and other such applications.\n    <br>\n    <hr>\n    <h4>Components<\/h4>\n    <ul>\n        <li>\n            <h6><a href=\"#CoG.ItemSystem.BaseItem\">BaseItem<\/a><h6>\n            <p>The entire system is predecated on the <b>BaseItem<\/b> which must be extended in order to be used.<\/p>\n        <\/li>\n            <h6><a href=\"#CoG.ItemSystem.ItemSystem\">ItemSystem<\/a><h6>\n            <p>The <b>ItemSytem<\/b> is used to create systems such as inventories.\n            <br>It has obligatory methods such as those used to add, remove, count and check for the existence of items.\n            <br>It is suitable for many purposes as-is and may be extended for futher customization.<\/p>\n        <li>\n            <h6><a href=\"#CoG.ItemSystem.ItemStashSystem\">ItemStashSystem<\/a><h6>\n            <p>This system has virtual tabs that each contain an <b>ItemSystem<\/b> and is designed to used for things like inventory pages or a player's item stash.<\/p>\n        <\/li>\n        <li>\n            <h6><a href=\"#CoG.ItemSystem.ItemSlot\">ItemSlot<\/a><h6>\n            <p>Allows the containment of items as well specifiying which subtypes of items may be contained inside.\n            <br>This permits/restricts the containment of specific <b>BaseItem<\/b> subclasses within an <b>ItemSlot<\/b>.<\/p>\n        <\/li>\n        <li>\n            <h6><a href=\"#CoG.ItemSystem.ItemSlotSystem\">ItemSlotSystem<\/a><h6>\n            <p>This operates much like the <b>ItemSystem<\/b> except that instead of hosting items, it hosts <b>ItemSlots<\/b>.\n            <br>This is designed to be used for things like player equipment systems or other such applications where one may wish to restict the type of items permitted in a given <b>ItemSlot<\/b>.<\/p>\n        <\/li>\n    <\/ul><\/div><\/div><\/div>`,

            "BaseMod": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   BaseMod is designed to contain basic information on game mods. In addition, it is meant to be extended (having a protected constructor) by a custom Mod class which handles the more specific details of your game's Mods.<\/div><\/div><\/div>`,

            "Factorium": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Factorium is a static class designed to handle factory methods for classes. Specifically, it handles building class instances from blueprint tables. Once a class has registered with Factorium, it's factory method is publicly available. Blueprints can be added for the class and objects built from those blueprints.\n<br><br>When registering <i>(which must be done within its static contructor)<\/i>, the class provides a schema TODO add link function <i>(used to validate blueprint tables)<\/i> and a factory method that builds the object and is responsible for returning that built object.\n<br><br>In additional, this can even be used for classes with private/protected constructors ensuring only blueprints could be used to build instances for those classes.<\/div><\/div><div class=\"custom-section\"><div id=\"cedc6d84-ea7f-7355-cdbb-5080b53b7ad6\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">TODO example should show - create a class, register it, build objects<\/code><\/pre><\/div><\/div><\/div>`,
                "subtable": {
                "Methods": {
                    "value": ``,
                    "subtable": {
                    "registerFactory": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Registers a class with Factorium for the purposes of being able to build class instances from blueprints.\n    <br><b><i>Note<\/i><\/b>: this <b>must<\/b> be called from within the class's static contructor (not static initializer).<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   static public<\/div><\/div><div class=\"custom-section\"><div id=\"3848f62c-63b1-7eee-0f55-bd015f10d69e\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>class<\/em><\/strong>   <em>cClass<\/em>   The class to be registered.   <strong><em>string<\/em><\/strong>   <em>SAuthCode<\/em>   The authentication code available within the class's static constructor.   <strong><em>function<\/em><\/strong>   <em>fSchema<\/em>   The schema record <b>TODO<\/b> (put link here) used to validate imported blueprints.   <strong><em>function<\/em><\/strong>   <em>fFromBlueprint<\/em>   The factory function used to build an instance of the class (see <a href=\"CoG.ModSystem.Factorium.Methods.fromBlueprint\">Factorium.fromBlueprint<\/a>).<br><\/div><\/div><div class=\"custom-section\"><div id=\"a82b84a0-8d8a-a982-ae22-7634a1fabb92\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bSuccess<\/em>   True if the class was registered, false otherwise. If false, a message describing the error is returned as well.   <strong><em>string|nil<\/em><\/strong>   <em>sError<\/em>   If the class was not registered successfully, this message is returned describing what went wrong.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    }
                    }
                }
                }
            }
            }
        },
        "Pool": {
            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <h2>Pool<\/h2><h3>Utility class used to keep track of things like Health, Magic, etc.<\/h3><p>You can operate on <strong>Pool<\/strong> objects using some math operators.<\/p>\n    <ul>\n        <li><p><b>+<\/b>: adds a number to the Pool's CURRENT value or, if adding another Pool object instead of a number, it will add the other Pool's CURRENT value to it's own <em>(up to its available capacity)<\/em> value.<\/p><\/li>\n        <li><p><b>-<\/b>: does the same as addition but for subtraction. Will not go below the Pool's MIN value.<\/p><\/li>\n        <li><p><b>%<\/b>: will modify a Pool's MAX value using a number value or another Pool object <em>(uses it's MAX value)<\/em>. Requires a calculated maximum of at least 1 and enough capacity for existing reservations.<\/p><\/li>\n        <li><p><b>*<\/b>: operates as expected on the object's CURRENT value.<\/p><\/li>\n        <li><p><b>/<\/b>: operates as expected on the object's CURRENT value. All div is floored.<\/p><\/li>\n        <li><p><b>-<\/b><em>(unary minus)<\/em>: will set the object's CURRENT value to the value of MIN.<\/p><\/li>\n        <li><p><b>#<\/b>: will set the object's CURRENT value to the available capacity and return that current value.<\/p><\/li>\n    <\/ul><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Note<\/div><div class=\"section-content\">   Arithmetic operators update the left Pool in place and return it. Unary minus empties it; length fills available capacity and returns current. Numbers on the left are not supported.<\/div><\/div><div class=\"custom-section\"><div id=\"25b05027-b5ea-cb64-6aa2-3cfb1d0becbb\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool.set(10, Pool.ASPECT.CYCLE_FLAT);\n    oPool.cycle();\n    assert(oPool.get() == 50);<\/code><\/pre><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Version<\/div><div class=\"section-content\">   2.1<\/div><\/div><div class=\"custom-section\"><div id=\"eb5b3c96-6363-803b-73dc-c389994fc6ab\" class=\"section-title\">Author(s)<\/div><div class=\"section-content\">   Centauri Soldier<br><\/div><\/div><\/div>`,
            "subtable": {
            "Enums": {
                "value": ``,
                "subtable": {
                "ASPECT": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Used in class methods for setting/getting values.\n    <ul>\n        <li><b class=\"text-primary\">AVAILABLE<\/b>\n            <p>Used for getting the total <b>Available<\/b> (<i>Max - Reserved<\/i>).\n            <br>This value is cached and changes only when the Pool's <b>Max<\/b> or <b>Reserved<\/b> values change.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">CURRENT<\/b>\n            <p>Used for getting the <b>Current<\/b> value.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">CYCLE<\/b>\n            <p>Used for getting the <b>Cycle<\/b> amount.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">RESERVED<\/b>\n            <p>Used for getting the total <b>Reserved<\/b> value.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">MAX<\/b>\n            <p>Used for setting/getting <b>Max<\/b> values.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">CYCLE_FLAT<\/b>\n            <p>Used for setting/getting <b>Cycle Flat<\/b> values.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">CYCLE_PERCENT<\/b>\n            <p>Used for setting/getting <b>Cycle Percent<\/b> values.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">RESERVED_FLAT<\/b>\n            <p>Used for setting/getting <b>Reserved Flat<\/b> values.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">RESERVED_PERCENT<\/b>\n            <p>Used for setting/getting <b>Reserved Percent<\/b> values.<\/p>\n        <\/li>\n    <\/ul><\/div><\/div><div class=\"custom-section\"><div id=\"3f18fee4-19af-ed1d-f8ac-57310606fef9\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(200, 80); --create the Pool object with 200 max and 80 current\n    oPool.set(0.36, Pool.ASPECT.RESERVED_PERCENT); --reserve 36% of the Pool\n    print(\"Reserved: \"..oPool.get(Pool.ASPECT.RESERVED)); --> Reserved: 72.0\n    print(\"Available: \"..oPool.get(Pool.ASPECT.AVAILABLE)); --> Available: 128.0\n    oPool.set(0.10, Pool.ASPECT.MAX, Pool.MODIFIER.MULTIPLICATIVE_BONUS); --adjust the max value by 10%\n    print(\"Max: \"..oPool.get(Pool.ASPECT.MAX)); --> Max: 220.0\n    print(\"Reserved: \"..oPool.get(Pool.ASPECT.RESERVED)); --> Reserved: 79.2\n    print(\"Available: \"..oPool.get(Pool.ASPECT.AVAILABLE)); --> Available: 140.8<\/code><\/pre><\/div><\/div><div class=\"custom-section\"><div id=\"322a2e1b-6cf7-5b13-8d9c-35a0f197b8fa\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 20);\n    oPool.set(10, Pool.ASPECT.CYCLE_FLAT);\n    oPool.cycle(); --current is now 30<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "EVENT": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <p>Used in class methods for setting/getting events.\n    <br><b>Note<\/b>: events fire only if an event callback function has been set and only if the event is active.\n    <br><b>Note<\/b>: events that trigger because of a change in the <b>Current<\/b> value, proccess before the <b>ON_CYCLE<\/b> event (if active).<\/p>\n    <br><br>\n    <h6>Setting an Event Callback<\/h6>\n    <ol>\n        <li>Create the function, ensuring it accepts the relevant arguments for that specific event (as shown below).<\/li>\n        <li>Set the event by using the object's <b>setEventCallback<\/b> method.<\/li>\n    <\/ol>\n    <br><b>Note<\/b>: event callbacks are auto-enabled once set. To prevent this, provide true as the third argument to <b>setEventCallback<\/b>.\n    <br><b>Note<\/b>: event callbacks can be changed (or deleted using nil as the callback argument).\n    <br><b>Note<\/b>: events can be activated/deactivated by using the <b>setEventActive<\/b> method.\n    <\/p>\n    <ul>\n        <li><b class=\"text-primary\">ON_INCREASE<\/b>\n            <p>This event occurs whenever the current value is increased.<\/p>\n            <p>This event callback function must accept the following arguments:\n                <ul>\n                    <li><b><i>Pool<\/i><\/b> <i>oPool<\/i> The Pool object.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nOld<\/i> The old <b>Current<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nNew<\/i> The new <b>Current<\/b> value.<\/li>\n                <\/ul>\n            <\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ON_DECREASE<\/b>\n            <p>This event occurs whenever the current value is decreased.<\/p>\n            <p>This event callback function must accept the following arguments:\n                <ul>\n                    <li><b><i>Pool<\/i><\/b> <i>oPool<\/i> The Pool object.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nOld<\/i> The old <b>Current<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nNew<\/i> The new <b>Current<\/b> value.<\/li>\n                <\/ul>\n            <\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ON_EMPTY<\/b>\n            <p>This event occurs whenever the current value drops to 0.<\/p>\n            <p>This event callback function must accept the following arguments:\n                <ul>\n                    <li><b><i>Pool<\/i><\/b> <i>oPool<\/i> The Pool object.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nOld<\/i> The old <b>Current<\/b> value.<\/li>\n                <\/ul>\n            <\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ON_LOW<\/b>\n            <p>This event occurs whenever the current value drops to or below the <b>Low<\/b> threshold.\n            <br>The <b>Low<\/b> threshold is determined by the following formula:\n            <br>Let <b><i>l<\/i><\/b> be a float value between 0 and 1 (exlusive).\n            <br>Let <b><i>m<\/i><\/b> be the max value of the Pool.\n            <b><i>LowThreshold<\/i><\/b> = <b><i>l<\/i><\/b> * <b><i>m<\/i><\/b>\n            <br><br>The <b>Low<\/b> threshold can be set using the object's <b>setLowMarker<\/b> method.\n            <br><b>Note<\/b>: the <b>Low<\/b> value must be less than the <b>High<\/b> value.<\/p>\n            <p>This event callback function must accept the following arguments:\n                <ul>\n                    <li><b><i>Pool<\/i><\/b> <i>oPool<\/i> The Pool object.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nOld<\/i> The old <b>Current<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nNew<\/i> The new <b>Current<\/b> value.<\/li>\n                <\/ul>\n            <\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ON_HIGH<\/b>\n            <p>This event occurs whenever the current value moves to or above the <b>High<\/b> threshold.\n            <br>The <b>High<\/b> threshold is determined by the following formula:\n            <br>Let <b><i>f<\/i><\/b> be a value greater than 0 and no greater than 1.\n            <br>Let <b><i>m<\/i><\/b> be the max value of the Pool.\n            <b><i>HighThreshold<\/i><\/b> = <b><i>f<\/i><\/b> * <b><i>m<\/i><\/b>\n            <br><br>The <b>High<\/b> threshold can be set using the object's <b>setHighMarker<\/b> method.\n            <br><b>Note<\/b>: the <b>High<\/b> value must be greater than the <b>Low<\/b> value.<\/p>\n            <p>This event callback function must accept the following arguments:\n                <ul>\n                    <li><b><i>Pool<\/i><\/b> <i>oPool<\/i> The Pool object.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nOld<\/i> The old <b>Current<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nNew<\/i> The new <b>Current<\/b> value.<\/li>\n                <\/ul>\n            <\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ON_FULL<\/b>\n            <p>This event occurs when current fills the available capacity (maximum minus reserved). A Pool can be full and low at the same time.<\/p>\n            <p>The callback receives the Pool, old current value and new current value.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ON_CYCLE<\/b>\n            <p>This event occurs when the object's <b>cycle<\/b> method changes the current value.\n            <b>Note<\/b>: this event fires after other events that may fire in this call.<\/p>\n            <p>This event callback function must accept the following arguments:\n                <ul>\n                    <li><b><i>Pool<\/i><\/b> <i>oPool<\/i> The Pool object.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nOld<\/i> The old <b>Current<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nNew<\/i> The new <b>Current<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nCycle<\/i> The <b>Cycle<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nMultiplier<\/i> The multiplier used to multiply the <b>Cycle<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nTotal<\/i> The total: multiplier times the <b>Cycle<\/b> value.<\/li>\n                    <li><b><i>boolean<\/i><\/b> <i>bIsPositive<\/i> Whether the <b>Cycle<\/b> value was positive.<\/li>\n                    <li><b><i>boolean<\/i><\/b> <i>bCurrentChanged<\/i> Whether the <b>Current<\/b> value actually changed.<\/li>\n                <\/ul>\n            <\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ON_RESERVE<\/b>\n            <p>This event occurs whenever the resevered amount increases.\n            <b>Note<\/b>: this can trigger other events such as <b>ON_LOW<\/b>, <b>ON_DECREASE<\/b>, etc.<\/p>\n            <p>This event callback function must accept the following arguments:\n                <ul>\n                    <li><b><i>Pool<\/i><\/b> <i>oPool<\/i> The Pool object.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nOld<\/i> The old <b>Reserved<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nNew<\/i> The new <b>Reserved<\/b> value.<\/li>\n                    <li><b><i>boolean<\/i><\/b> <i>bIsPositive<\/i> Whether the <b>Current<\/b> value was changed.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nCurrent<\/i> The <b>Current<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nAvailable<\/i> The <b>Available<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nMax<\/i> The <b>Max<\/b> value.<\/li>\n                <\/ul>\n            <\/p>\n        <\/li>\n            <li><b class=\"text-primary\">ON_UNRESERVE<\/b>\n            <p>This event occurs whenever the resevered amount decreases.\n            <b>Note<\/b>: this can trigger other events such as <b>ON_FULL<\/b>, <b>ON_INCREASE<\/b>, etc.<\/p>\n            <p>This event callback function must accept the following arguments:\n                <ul>\n                    <li><b><i>Pool<\/i><\/b> <i>oPool<\/i> The Pool object.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nOld<\/i> The old <b>Reserved<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nNew<\/i> The new <b>Reserved<\/b> value.<\/li>\n                    <li><b><i>boolean<\/i><\/b> <i>bIsPositive<\/i> Whether the <b>Current<\/b> value was changed.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nCurrent<\/i> The <b>Current<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nAvailable<\/i> The <b>Available<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nMax<\/i> The <b>Max<\/b> value.<\/li>\n                <\/ul>\n            <\/p>\n        <\/li>\n    <\/ul><\/div><\/div><div class=\"custom-section\"><div id=\"dba6df4b-e377-7210-248c-16339877e3f4\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 100);\n\n    local function adjustLifeUI(this, nPrevious, nCurrent)\n        UI.LifeBar.SetCurrent(nCurrent);\n    end\n    --optionally, disable auto-activation by providing true as the third argument.\n    oPool.setEventCallback(Pool.EVENT.ON_INCREASE, adjustLifeUI);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "MODIFIER": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Used in class methods for getting/setting modifier values of <a href=\"#CoG.Pool.Enums.ASPECT\" target=\"_blank\">ASPECTS<\/a>.\n    <ul>\n        <li><b class=\"text-primary\">BASE<\/b>\n            <p>The unmodified starting value.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">FINAL<\/b>\n            <p>The calculated value; read-only.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">MAX<\/b>\n            <p>An upper cap on the calculated modifier-bearing value.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">BASE_BONUS<\/b>\n            <p>Added to the base before multiplication.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">BASE_PENALTY<\/b>\n            <p>Subtracted from the base before multiplication.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">MULTIPLICATIVE_BONUS<\/b>\n            <p>Added to the multiplier; 0.2 represents a 20% bonus.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">MULTIPLICATIVE_PENALTY<\/b>\n            <p>Subtracted from the multiplier.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ADDITIVE_BONUS<\/b>\n            <p>Added after multiplication.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ADDITIVE_PENALTY<\/b>\n            <p>Subtracted after multiplication.<\/p>\n        <\/li>\n    <\/ul><\/div><\/div><div class=\"custom-section\"><div id=\"f6fefa14-7718-9a05-99b1-049a8072df3d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 50);\n    oPool.set(0.2, Pool.ASPECT.MAX, Pool.MODIFIER.MULTIPLICATIVE_BONUS);\n    print(oPool.get(Pool.ASPECT.MAX)); --120<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            },
            "Metamethods": {
                "value": ``,
                "subtable": {
                "__add": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adds a number or another Pool's current value to this Pool, clamped to available capacity.<\/div><\/div><div class=\"custom-section\"><div id=\"d83b9c74-c0ba-151a-5da1-d84a8d18515f\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Pool|number<\/em><\/strong>   <em>other<\/em>   The right operand.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e8831b30-b5ac-b592-6fc6-ca5dfcfeac6c\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This Pool.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ab74f489-4788-ed80-c5d5-e2a008c68604\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool = oPool + 10;\n    assert(oPool.get() == 50);\n    oPool = oPool + Pool(100, 20);\n    assert(oPool.get() == 70);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "__clone": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates an independent Pool with the same values, thresholds and event activation. Callback function references are retained.<\/div><\/div><div class=\"custom-section\"><div id=\"b9882d2b-5d61-74bd-02f2-347f0dc389c8\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oCopy<\/em>   The cloned Pool.<br><\/div><\/div><div class=\"custom-section\"><div id=\"656dd9e6-2440-0181-77bb-62ffb365b4b6\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    local oCopy = clone(oPool);\n    oCopy.adjust(10);\n    assert(oCopy.get() == 50 and oPool.get() == 40);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "__div": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Divides current by a number or another Pool's current value and floors the result. Zero divisors are rejected.<\/div><\/div><div class=\"custom-section\"><div id=\"930dd00a-96c4-4fc4-a57c-0bf2a96fea28\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Pool|number<\/em><\/strong>   <em>other<\/em>   The right operand.<br><\/div><\/div><div class=\"custom-section\"><div id=\"430d9ec5-ebb4-8747-1626-da41bbed228a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This Pool.<br><\/div><\/div><div class=\"custom-section\"><div id=\"49311220-5f75-cecf-485e-5977497443ba\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 41);\n    oPool = oPool / 2;\n    assert(oPool.get() == 20); --division is floored<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "__len": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Fills available capacity and returns the new current value.<\/div><\/div><div class=\"custom-section\"><div id=\"de01c44d-7c44-0c2b-bb71-c1e357728add\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nCurrent<\/em>   The filled current value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"02146952-a3e3-56c3-6719-acca0687690c\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool.set(20, Pool.ASPECT.RESERVED_FLAT);\n    assert(#oPool == 80); --also fills the Pool\n    assert(oPool.isFull());<\/code><\/pre><\/div><\/div><\/div>`,

                "__mod": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets maximum base from a number or another Pool's calculated maximum, using normal capacity validation.<\/div><\/div><div class=\"custom-section\"><div id=\"7f6d8eee-f28f-bcbe-1aaa-09694864a605\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Pool|number<\/em><\/strong>   <em>other<\/em>   The right operand.<br><\/div><\/div><div class=\"custom-section\"><div id=\"146568a4-1253-2d69-a95e-ee9eb5289a59\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This Pool.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8a4df511-d2c6-220f-9f44-64528ab30789\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool = oPool % 200; --sets maximum base, rather than calculating a remainder\n    assert(oPool.get(Pool.ASPECT.MAX) == 200);<\/code><\/pre><\/div><\/div><\/div>`,

                "__mul": {

                "__sub": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Subtracts a number or another Pool's current value from this Pool, clamped at zero.<\/div><\/div><div class=\"custom-section\"><div id=\"5b786863-3c64-487a-f596-9788a7e1ce3d\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Pool|number<\/em><\/strong>   <em>other<\/em>   The right operand.<br><\/div><\/div><div class=\"custom-section\"><div id=\"07ddcdfc-ea17-ab57-58a4-436d1fbd991e\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This Pool.<br><\/div><\/div><div class=\"custom-section\"><div id=\"268e5bd5-e9c3-1d99-ec06-c78f3c7dd64b\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool = oPool - 10;\n    assert(oPool.get() == 30);<\/code><\/pre><\/div><\/div><\/div>`,

                "__unm": {

            "Methods": {
                "value": ``,
                "subtable": {
                "Pool": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   The constructor for the <b>Pool<\/b> class.<\/div><\/div><div class=\"custom-section\"><div id=\"c664efe8-5ff0-daca-2cde-540d2a7e9fec\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nMax<\/em>   The maximum value of the Pool (minimum 1).   <strong><em>number|nil<\/em><\/strong>   <em>nCurrent<\/em>   The current value of the Pool (minimum 0, maximum nMax).<br><\/div><\/div><div class=\"custom-section\"><div id=\"3b9b0795-aaae-3921-29fc-6f8c4638e901\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40); --maximum, current\n    assert(oPool.get(Pool.ASPECT.MAX) == 100 and oPool.get() == 40);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "adjust": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adjusts the selected value by an amount. Defaults to CURRENT; modifier-bearing aspects default to their BASE value. Uses the same bounds and events as set.<\/div><\/div><div class=\"custom-section\"><div id=\"70b13c10-bf51-bb66-5330-f33f1d578ca0\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nAmount<\/em>   The amount to add or subtract.   <strong><em>Pool.ASPECT|nil<\/em><\/strong>   <em>eAspect<\/em>   The aspect to adjust.   <strong><em>Pool.MODIFIER|nil<\/em><\/strong>   <em>eModifier<\/em>   The modifier to adjust.<br><\/div><\/div><div class=\"custom-section\"><div id=\"94e361e9-d1d5-1b91-8515-482c49596aec\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This pool.   <strong><em>boolean<\/em><\/strong>   <em>bSuccess<\/em>   Whether the adjustment was accepted or changed CURRENT.   <strong><em>number<\/em><\/strong>   <em>nOverage<\/em>   The rejected capacity or reservation overage; zero for CURRENT changes.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9c3b9fd0-eb02-7c8f-b90c-92db41632236\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    local oResult, bSuccess, nOverage = oPool.adjust(-10);\n    assert(oResult == oPool and bSuccess and nOverage == 0);\n    assert(oPool.get() == 30);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "cycle": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Causes the Pool to cycle based on the cycle value (after all modifiers have been applied).\n    <br>This is used for things like regeneration of mana, regen and/or poisoning of life, consumption of fuel, etc.<\/div><\/div><div class=\"custom-section\"><div id=\"2f901473-b15a-29fc-c732-75abb292fbaf\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nMultiplier<\/em>   If a number is provided, it will cycle the number of times input, otherwise, once.\n    <br>Note: regardless of the multiple provided (if any), the <strong>onCycle<\/strong> event will fire only once per cycle.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b73aee95-dd91-28ac-ec4e-ed2fffa29ce4\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   The Pool object.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4008a7c0-58b2-9a1a-344f-96396572997f\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool.set(10, Pool.ASPECT.CYCLE_FLAT);\n    oPool.cycle(2); --two regeneration amounts in one call\n    assert(oPool.get() == 60);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "get": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a Pool aspect or one of its modifiers.<\/div><\/div><div class=\"custom-section\"><div id=\"0df56138-7c75-1492-6674-66193ef00d9e\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Pool.ASPECT|nil<\/em><\/strong>   <em>eAspect<\/em>   If provided, this refers to the aspect of the pool to get such as MAX or CYCLE.\n    <br>If not provided it will default to CURRENT.   <strong><em>Pool.MODIFIER|nil<\/em><\/strong>   <em>eModifier<\/em>   If provided, this indicates which modifier to get such as BASE, BASE_BONUS, etc.\n    <br>If not provided, it will default to FINAL.\n    <br><strong>Note<\/strong>: not all aspects have all modifiers. E.g., Pool.ASPECT.RESERVED, Pool.ASPECT.CURRENT Pool.ASPECT.AVAILABLE have no modifiers whatsoever and only accessor methods.<br><\/div><\/div><div class=\"custom-section\"><div id=\"78c95081-7934-2402-ba68-2588ce4e97ac\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nRet<\/em>   The value requested in either a flat value or a percentage between 0 and 1.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f60eb75d-3828-1bf4-5465-7cb2f8be0561\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    assert(oPool.get() == 40);\n    assert(oPool.get(Pool.ASPECT.MAX, Pool.MODIFIER.BASE) == 100);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getHighMarker": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the high-status fraction of total maximum.<\/div><\/div><div class=\"custom-section\"><div id=\"b4e0d107-e143-f1eb-eac3-a6c4c9485ed3\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nMarker<\/em>   The configured value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8e39f6cb-c102-c93b-4933-8b43812e2ba1\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool.setHighMarker(0.8);\n    assert(oPool.getHighMarker() == 0.8);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getLowMarker": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the low-status fraction of total maximum.<\/div><\/div><div class=\"custom-section\"><div id=\"059eab83-95a2-1377-6119-708dcb9681e5\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nMarker<\/em>   The configured value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c4b8b750-bae3-826e-edba-7c1225df5d46\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool.setLowMarker(0.2);\n    assert(oPool.getLowMarker() == 0.2);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
