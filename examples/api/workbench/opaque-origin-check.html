<!doctype html>
<html lang="en"><meta charset="utf-8"><title>LuaEx opaque-origin check</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0}</style>
<!-- An opaque sandbox reproduces the blob:null worker origin without needing
     filesystem permissions or weakening browser security. -->
<iframe title="Opaque origin workbench" sandbox="allow-scripts" src="../../../Examples.html"></iframe>
</html>
